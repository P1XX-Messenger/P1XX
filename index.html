  function showChannelPostComposer(channelId) {
    let mediaData = null; let mediaType = 'image';
    showModal(`
      <h3>✏️ Новый пост</h3>
      <textarea id="channelPostText" placeholder="Текст поста" rows="4" maxlength="4000"
        style="width:100%;padding:10px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);resize:vertical;"></textarea>
      <input type="file" id="channelPostMediaInput" accept="image/*,video/*" style="display:none;">
      <button class="btn secondary" id="channelPostMediaBtn">📷 Прикрепить фото / видео</button>
      <div id="channelPostMediaPreview" style="margin:6px 0;"></div>
      <button class="btn" id="channelPostSendBtn">Опубликовать</button>
      <button class="btn secondary" id="channelPostCancelBtn">Отмена</button>`);

    document.getElementById('channelPostMediaBtn').addEventListener('click', () => document.getElementById('channelPostMediaInput').click());
    document.getElementById('channelPostMediaInput').addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      if (file.size > 30 * 1024 * 1024) return toast('Файл до 30MB', 'error');
      mediaType = file.type.startsWith('video') ? 'video' : 'image';
      const reader = new FileReader();
      reader.onload = (ev) => {
        mediaData = ev.target.result;
        const prev = document.getElementById('channelPostMediaPreview');
        if (prev) prev.innerHTML = mediaType === 'video'
          ? `<video src="${mediaData}" style="max-width:100%;max-height:160px;border-radius:12px;" controls muted></video>`
          : `<img src="${mediaData}" style="max-width:100%;max-height:160px;border-radius:12px;">`;
      };
      reader.readAsDataURL(file);
    });
    document.getElementById('channelPostCancelBtn').addEventListener('click', closeModal);
    document.getElementById('channelPostSendBtn').addEventListener('click', async () => {
      const text = document.getElementById('channelPostText')?.value.trim() || '';
      if (!text && !mediaData) return toast('Добавьте текст или медиа', 'error');
      let finalMedia = mediaData;
      if (mediaData && mediaType === 'image') {
        try {
          const img = new Image(); img.src = mediaData;
          await new Promise(r => img.onload = r);
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height; const mx = 1280;
          if (w > mx || h > mx) { const r2 = Math.min(mx / w, mx / h); w *= r2; h *= r2; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          finalMedia = canvas.toDataURL('image/jpeg', 0.85);
        } catch (e) {}
      }
      try {
        const postRef = push(ref(db, `channelPosts/${channelId}`));
        await set(postRef, {
          text, mediaBase64: finalMedia || '', mediaType: finalMedia ? mediaType : '',
          timestamp: Date.now(), authorUid: window.currentUser.uid, commentCount: 0
        });
        closeModal();
        toast('Пост опубликован ✨', 'success');
      } catch (e) { toast('Ошибка публикации: ' + e.message, 'error'); }
    });
  }

      await remove(ref(db, `channelComments/${channelId}/${postId}`));
      toast('Пост удалён');
    } catch (e) { toast('Ошибка удаления', 'error'); }
  }

  async function deleteChannel(channelId) {
    try {
      await remove(ref(db, `channels/${channelId}`));
      await remove(ref(db, `channelPosts/${channelId}`));
      await remove(ref(db, `channelComments/${channelId}`));
      toast('Канал удалён');
      if (window.currentChannelId === channelId) switchScreen('channels');
    } catch (e) { toast('Ошибка удаления канала', 'error'); }
  }

  async function toggleChannelSubscription(channelId) {
    try {
      const snap = await get(ref(db, `channels/${channelId}`));
      const channel = snap.val();
      if (!channel) return;
      const myUid = window.currentUser.uid;
      const isSubscribed = channel.subscribers && channel.subscribers[myUid];
      if (isSubscribed && channel.ownerUid === myUid) {
        return toast('Владелец не может отписаться — удалите канал, если он больше не нужен', 'warning');
      }
      if (isSubscribed) {
        await remove(ref(db, `channels/${channelId}/subscribers/${myUid}`));
        toast('Вы отписались');
        if (window.currentChannelId === channelId) switchScreen('channels');
      } else {
        await set(ref(db, `channels/${channelId}/subscribers/${myUid}`), true);
        toast('Вы подписались ✨', 'success');
      }
    } catch (e) { toast('Ошибка', 'error'); }
  }

    document.body.appendChild(overlay);

    const closeOverlay = () => {

    };
    document.getElementById('closeChannelCommentsBtn').addEventListener('click', closeOverlay);

    if (channelCommentsUnsubscribe) { try { channelCommentsUnsubscribe(); } catch(e) {} }
    channelCommentsUnsubscribe = onValue(ref(db, `channelComments/${channelId}/${postId}`), (snap) => {

            <div class="channel-comment-time">${formatTime(c.timestamp || Date.now())}

  function openChat(chatId) {
    if (!chatId || !window.currentUser) return;
    stopTitleBlink();
    // Clean up previous chat listeners
    if (chatTypingUnsubscribe) { try { chatTypingUnsubscribe(); } catch(e) {} chatTypingUnsubscribe = null; }
    if (chatOnlineUnsubscribe) { try { chatOnlineUnsubscribe(); } catch(e) {} chatOnlineUnsubscribe = null; }
    if (chatPinnedUnsubscribe) { try { chatPinnedUnsubscribe(); } catch(e) {} chatPinnedUnsubscribe = null; }
    currentPinnedMessage = null;
    window.currentChat = chatId;
    if (window._allChatData && window._allChatData[chatId]) {
      window._allChatData[chatId].unreadCount = 0;
      updateNavUnreadBadge();
    }
    switchScreen('chat');
    if (chatListeners[chatId]) { try { chatListeners[chatId](); } catch (e) {} }
    const chatName = chatNames[chatId] || 'Чат';
    const otherUid = chatId.includes('_') ? chatId.split('_').find(uid => uid !== window.currentUser?.uid) : null;
    loadChatMessages(chatId, chatName, false, otherUid);
    loadDraftForChat(chatId);
    // Start heat wallpaper if it was selected
    if (currentWallpaper === '__heat__') startHeatWallpaper(chatId);

    // Typing indicator listener (set up once per chat session)
    chatTypingUnsubscribe = onValue(ref(db, `typing/${chatId}`), (snap) => {
      const typing = snap.val() || {};
      const others = Object.keys(typing).filter(uid => uid !== window.currentUser?.uid);
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.style.display = others.length > 0 ? 'flex' : 'none';
    });

    // Online status listener (set up once per chat session)
    if (otherUid) {
      chatOnlineUnsubscribe = onValue(ref(db, `users/${otherUid}/online`), (snap) => {
        const dot = document.getElementById('onlineDot');
        if (dot) dot.className = 'online-dot ' + (snap.val() ? '' : 'offline');
      });
    }

    // Pinned message listener (set up once per chat session)
    chatPinnedUnsubscribe = onValue(ref(db, `pinned/${chatId}`), (snap) => {
      currentPinnedMessage = snap.val();
      renderPinnedBanner();
    });
  }

  function loadChatMessages(chatId, chatName, isGroup = false, otherUid = null) {
    const msgsRef = ref(db, `messages/${chatId}`);
    // No limit – load all messages
    const chatQuery = query(msgsRef, orderByChild('timestamp'));

    if (chatListeners[chatId]) { try { chatListeners[chatId](); } catch (e) {} }

    chatListeners[chatId] = onValue(chatQuery, async (snap) => {
      const msgs = snap.val() || {};
      const sorted = Object.values(msgs)
        .filter(m => !(m.deletedFor && m.deletedFor[window.currentUser?.uid]))
        .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

      for (const m of sorted) {
        if (m.uid !== window.currentUser?.uid && !m.read) {
          await update(ref(db, `messages/${chatId}/${m.id}`), { read: true }).catch(() => {});
        }
        if (isGroup && m.uid !== window.currentUser?.uid) {
          const rbSnap = await get(ref(db, `messages/${chatId}/${m.id}/readBy`));
          const readBy = rbSnap.val() || {};
          if (!readBy[window.currentUser.uid]) {
            await update(ref(db, `messages/${chatId}/${m.id}`), {
              [`readBy/${window.currentUser.uid}`]: Date.now()
            }).catch(() => {});
            m.readBy = { ...readBy, [window.currentUser.uid]: Date.now() };
          } else {
            m.readBy = readBy;
          }
        }
      }

      if (sorted.length > 0) {
        const last = sorted[sorted.length - 1];
        if (last.uid !== window.currentUser?.uid && document.hidden)
          sendNotification(last.name || 'Новое сообщение', (last.text || '').slice(0, 100), chatId);
      }

      // Pre-cache profiles for reactions avatars
      const allUids = [...new Set(sorted.flatMap(m => Object.keys(m.reactions || {})))];
      if (!window._reactionProfiles) window._reactionProfiles = {};
      for (const uid of allUids) {
        if (!window._reactionProfiles[uid]) {
          try {
            const ps = await get(ref(db, `users/${uid}`));
            window._reactionProfiles[uid] = ps.val() || {};
          } catch(e) { window._reactionProfiles[uid] = {}; }
        }
      }

      // Сохраняем позицию скролла до перерисовки
      const container = document.getElementById('msgContainer');
      const prevScrollTop = container ? container.scrollTop : 0;
      const prevScrollHeight = container ? container.scrollHeight : 0;
      const wasNearBottom = container ? (container.scrollTop + container.clientHeight >= container.scrollHeight - 50) : false;
      const isInitialLoad = currentMessages.length === 0;
      
      // СОХРАНЯЕМ ТЕКУЩЕЕ КОЛИЧЕСТВО СООБЩЕНИЙ
      const prevMsgCount = currentMessages.length; 

      currentMessages = sorted;
      oldestTimestamp = sorted.length > 0 ? sorted[0].timestamp : null;
      renderChatMessages(sorted, chatName, otherUid, false, isGroup);

      // Восстанавливаем скролл после перерисовки
      const newContainer = document.getElementById('msgContainer');
      if (newContainer) {
        newContainer.style.scrollBehavior = 'auto';
        if (isInitialLoad) {
          newContainer.scrollTop = newContainer.scrollHeight;
        } else if (sorted.length === prevMsgCount) {
          newContainer.scrollTop = prevScrollTop;
        } else {
          const newScrollHeight = newContainer.scrollHeight;
          if (wasNearBottom) {
            newContainer.scrollTop = newContainer.scrollHeight;
          } else {
            const heightDiff = newScrollHeight - prevScrollHeight;
            newContainer.scrollTop = prevScrollTop + heightDiff;
          }
        }
        requestAnimationFrame(() => { newContainer.style.scrollBehavior = ''; });
      }

      await update(ref(db, `user_chats/${window.currentUser.uid}/${chatId}`), { unreadCount: 0 }).catch(() => {});
    });
  }

  async function loadOlderMessages() {
    if (!window.currentChat || loadingMore || !oldestTimestamp) return;
    loadingMore = true;
    const chatId = window.currentChat;
    const msgsRef = ref(db, `messages/${chatId}`);
    const container = document.getElementById('msgContainer');
    const prevScrollHeight = container ? container.scrollHeight : 0;
    const olderQuery = query(msgsRef, orderByChild('timestamp'), endAt(oldestTimestamp - 1), limitToLast(50));
    try {
      const snap = await get(olderQuery);
      const msgs = snap.val() || {};
      const older = Object.values(msgs)
        .filter(m => !(m.deletedFor && m.deletedFor[window.currentUser?.uid]))
        .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
      if (older.length === 0) {
        toast('Загружены все сообщения', 'success');
        loadingMore = false;
        return;
      }
      const merged = [...older, ...currentMessages].reduce((acc, m) => {
        if (!acc.find(x => x.id === m.id)) acc.push(m);
        return acc;
      }, []).sort((a, b) => a.timestamp - b.timestamp);
      currentMessages = merged;
      oldestTimestamp = merged.length > 0 ? merged[0].timestamp : null;
      const otherUid = chatId.includes('_') ? chatId.split('_').find(uid => uid !== window.currentUser?.uid) : null;
      renderChatMessages(merged, chatNames[chatId] || 'Чат', otherUid, false);
      const newContainer = document.getElementById('msgContainer');
      if (newContainer) {
        newContainer.style.scrollBehavior = 'auto';
        newContainer.scrollTop = newContainer.scrollHeight - prevScrollHeight;
        requestAnimationFrame(() => { newContainer.style.scrollBehavior = ''; });
      }
    } catch (e) {
      toast('Ошибка загрузки старых сообщений', 'error');
    }
    loadingMore = false;
  }

  // ══════════════════════════════════════════════════════════════
  // Secret chats — screen (open / render / send / delete)
  // Deliberately a separate, self-contained code path from the regular
  // chat screen (own element ids, own render function) rather than a
  // branch bolted onto renderChatMessages — keeps encrypted-chat logic
  // isolated from the much bigger regular/group chat surface area
  // (polls, stickers, dice, etc. don't exist here in v1, on purpose).
  // ══════════════════════════════════════════════════════════════

  async function openSecretChat(secretChatId, otherUid) {
    if (!secretChatId || !otherUid || !window.currentUser) return;
    stopTitleBlink();
    if (chatTypingUnsubscribe) { try { chatTypingUnsubscribe(); } catch(e) {} chatTypingUnsubscribe = null; }
    if (chatOnlineUnsubscribe) { try { chatOnlineUnsubscribe(); } catch(e) {} chatOnlineUnsubscribe = null; }
    if (chatPinnedUnsubscribe) { try { chatPinnedUnsubscribe(); } catch(e) {} chatPinnedUnsubscribe = null; }
    if (secretMsgUnsubscribe) { try { secretMsgUnsubscribe(); } catch(e) {} secretMsgUnsubscribe = null; }
    if (secretTypingUnsubscribe) { try { secretTypingUnsubscribe(); } catch(e) {} secretTypingUnsubscribe = null; }
    if (secretOnlineUnsubscribe) { try { secretOnlineUnsubscribe(); } catch(e) {} secretOnlineUnsubscribe = null; }
    window.currentChat = null;
    currentPinnedMessage = null;
    secretChatKey = null;
    window.currentSecretChat = secretChatId;
    window.currentSecretOtherUid = otherUid;

    switchScreen('chat');
    document.getElementById('chatScreen').innerHTML = `
      <div class="header">
        <span class="icon-btn" id="secretBackBtn">←</span>
        <h2>🔒 Устанавливаем защищённое соединение…</h2>
      </div>
      <div class="messages-container"></div>`;
    document.getElementById('secretBackBtn').addEventListener('click', () => {
      window.currentSecretChat = null;
      switchScreen('chats');
    });

    const otherSnap = await get(ref(db, `users/${otherUid}`));
    const otherUser = otherSnap.val() || {};
    const myKeys = await ensureSecretKeys();

    if (window.currentSecretChat !== secretChatId) return; // navigated away while loading

    if (!myKeys || !otherUser.publicKey) {
      document.getElementById('chatScreen').innerHTML = `
        <div class="header">
          <span class="icon-btn" id="secretBackBtn">←</span>
          <h2>🔒 ${escapeHtml(otherUser.name || 'Секретный чат')}</h2>
        </div>
        <div class="secret-empty-state">
          <div style="font-size:2.4rem;">🔒</div>
          <div>${!myKeys ? 'Шифрование недоступно в этом браузере' : `${escapeHtml(otherUser.name || 'Собеседник')} ещё не открывал(а) новую версию — секретный чат пока недоступен`}</div>
        </div>`;
      document.getElementById('secretBackBtn').addEventListener('click', () => {
        window.currentSecretChat = null;
        switchScreen('chats');
      });
      return;
    }

    try {
      secretChatKey = await deriveSecretChatKey(myKeys.privateKey, otherUser.publicKey);
      currentSecretSafetyNumber = await computeSafetyNumber(myKeys.publicJwk, otherUser.publicKey);
    } catch (e) {
      toast('Не удалось установить защищённое соединение', 'error');
      switchScreen('chats');
      return;
    }
    if (window.currentSecretChat !== secretChatId) return;

    if (window._allChatData && window._allChatData[secretChatId]) {
      window._allChatData[secretChatId].unreadCount = 0;
      updateNavUnreadBadge();
    }
    update(ref(db, `user_chats/${window.currentUser.uid}/${secretChatId}`), { unreadCount: 0 }).catch(() => {});

    secretTypingUnsubscribe = onValue(ref(db, `typing/${secretChatId}`), (snap) => {
      const typing = snap.val() || {};
      const others = Object.keys(typing).filter(uid => uid !== window.currentUser?.uid);
      const indicator = document.getElementById('secretTypingIndicator');
      if (indicator) indicator.style.display = others.length > 0 ? 'flex' : 'none';
    });
    secretOnlineUnsubscribe = onValue(ref(db, `users/${otherUid}/online`), (snap) => {
      const dot = document.getElementById('secretOnlineDot');
      if (dot) dot.className = 'online-dot ' + (snap.val() ? '' : 'offline');
    });

    secretMsgUnsubscribe = onValue(ref(db, `messages/${secretChatId}`), async (snap) => {
      const data = snap.val() || {};
      const list = Object.values(data).filter(m => !(m.deletedFor && m.deletedFor[window.currentUser.uid]));
      list.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
      await Promise.all(list.map(async (m) => {
        if (!secretChatKey) return;
        try {
          const plain = await secretDecrypt(secretChatKey, m.iv, m.ciphertext);
          if (m.type === 'image') m.plainImage = plain; else m.plainText = plain;
        } catch (e) {
          m.decryptError = true;
        }
      }));
      renderSecretChatMessages(list, otherUid, secretChatId, otherUser);
    });
  }

  function renderSecretChatMessages(list, otherUid, secretChatId, otherUser) {
    const bubbles = list.map(m => {
      const isMine = m.uid === window.currentUser?.uid;
      const time = formatTime(m.timestamp);
      let bodyHtml;
      if (m.decryptError) {
        bodyHtml = `<span style="opacity:.6;">⚠️ Не удалось расшифровать</span>`;
      } else if (m.type === 'image') {
        bodyHtml = `<img src="${m.plainImage}" class="image-in-msg" alt="фото" data-image-base64="${m.plainImage}">`;
      } else {
        bodyHtml = parseMarkdown(m.plainText || '');
      }
      const isFresh = Date.now() - (m.timestamp || 0) < 1200;
      return `
        <div class="message-container ${isMine ? 'outgoing' : 'incoming'} ${isFresh ? 'msg-fresh' : ''}">
          <div class="bubble" data-msg-id="${escapeHtml(m.id || '')}">
            <span class="text-content">${bodyHtml}</span>
            <span class="meta">${escapeHtml(time)}</span>
          </div>
        </div>`;
    }).join('');

    const introHtml = `
      <div class="secret-chat-intro">
        🔒 Это <b>секретный чат</b>. Сообщения и фото шифруются на устройстве — на сервере хранится только нечитаемый шифротекст.<br>
        Сверьте код безопасности (🔑 сверху) с собеседником лично или по другому каналу, чтобы исключить подмену ключа.
      </div>`;

    document.getElementById('chatScreen').innerHTML = `
      <div class="header">
        <span class="icon-btn" id="secretBackBtn">←</span>
        <span class="header-avatar" id="secretHeaderAvatar">
          ${otherUser.avatarBase64
            ? `<img src="${otherUser.avatarBase64}" alt="avatar">`
            : `<div style="width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${avatarColor(otherUser.name||'?')};">${escapeHtml((otherUser.name||'?')[0]?.toUpperCase()||'?')}</div>`}
        </span>
        <h2><span class="secret-lock-badge">🔒</span> ${escapeHtml(otherUser.name || 'Секретный чат')} <span id="secretOnlineDot" class="online-dot offline"></span></h2>
        <span class="icon-btn" id="safetyNumberBtn" title="Код безопасности">🔑</span>
        <span class="icon-btn" id="secretDeleteChatBtn" title="Удалить чат">🗑</span>
      </div>
      <div class="messages-container" id="secretMsgContainer">
        ${list.length === 0 ? introHtml : ''}
        ${bubbles}
        <div class="typing-indicator" id="secretTypingIndicator" style="display:none;">
          <span style="font-size:0.75rem;color:var(--text-secondary);">печатает</span>
          <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
        </div>
      </div>
      <div class="input-area no-nav">
        <span class="icon-btn" id="secretImageBtn" title="Фото">📷</span>
        <input id="secretMsgInput" placeholder="Секретное сообщение..." maxlength="5000" autocomplete="off">
        <span class="icon-btn" id="secretSendBtn">➤</span>
      </div>`;

    const container = document.getElementById('secretMsgContainer');
    if (container) container.scrollTop = container.scrollHeight;

    document.getElementById('secretBackBtn').addEventListener('click', () => {
      window.currentSecretChat = null;
      switchScreen('chats');
    });
    document.getElementById('safetyNumberBtn').addEventListener('click', () => showSafetyNumberModal(otherUser.name));
    document.getElementById('secretDeleteChatBtn').addEventListener('click', async () => {
      if (!confirm('Удалить этот секретный чат навсегда?')) return;
      try {
        await remove(ref(db, `user_chats/${window.currentUser.uid}/${secretChatId}`));
        window.currentSecretChat = null;
        switchScreen('chats');
        toast('Секретный чат удалён 🗑');
      } catch (e) { toast('Ошибка удаления', 'error'); }
    });
    document.getElementById('secretSendBtn').addEventListener('click', sendSecretMessage);
    document.getElementById('secretImageBtn').addEventListener('click', triggerSecretImageUpload);

    const input = document.getElementById('secretMsgInput');
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendSecretMessage(); }
    });
    input.addEventListener('input', () => { if (window.currentSecretChat) setTypingIndicator(window.currentSecretChat); });

    document.querySelectorAll('#secretMsgContainer .image-in-msg').forEach(img => {
      img.addEventListener('click', (e) => {
        e.stopPropagation();
        if (img.dataset.imageBase64) viewFullImage(img.dataset.imageBase64);
      });
    });

    document.querySelectorAll('#secretMsgContainer .bubble').forEach(bubble => {
      let longPressTimer;
      const msgId = bubble.dataset.msgId;
      const msg = list.find(m => m.id === msgId);
      if (!msg) return;
      const isMine = msg.uid === window.currentUser?.uid;
      const openActions = () => {
        const rect = bubble.getBoundingClientRect();
        const items = [
          (!msg.decryptError && msg.type !== 'image') ? { icon: '📋', label: 'Копировать текст', action: () => {
            navigator.clipboard?.writeText(msg.plainText || '').then(() => toast('Скопировано!'), () => toast('Ошибка', 'error'));
          }} : null,
          { icon: '🗑', label: 'Удалить у меня', action: () => deleteSecretMessageForMe(msgId) },
          isMine ? { icon: '🗑', label: 'Удалить у всех', danger: true, action: () => deleteSecretMessageForAll(msgId) } : null,
        ].filter(Boolean);
        showContextMenu(Math.min(rect.left + rect.width / 2 - 100, window.innerWidth - 220), rect.top, items);
      };
      bubble.addEventListener('touchstart', () => { longPressTimer = setTimeout(openActions, 500); });
      bubble.addEventListener('touchend', () => clearTimeout(longPressTimer));
      bubble.addEventListener('touchmove', () => clearTimeout(longPressTimer));
      bubble.addEventListener('contextmenu', (e) => { e.preventDefault(); openActions(); });
    });
  }

  async function sendSecretMessage() {
    const input = document.getElementById('secretMsgInput');
    if (!input || !window.currentSecretChat || !secretChatKey || !window.currentUser) return;
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    try {
      const { iv, ciphertext } = await secretEncrypt(secretChatKey, text);
      const msgId = push(ref(db, 'messages')).key;
      await set(ref(db, `messages/${window.currentSecretChat}/${msgId}`), {
        id: msgId, type: 'text', iv, ciphertext,
        uid: window.currentUser.uid, name: window.userProfile?.name || 'User',
        timestamp: Date.now(), read: false
      });
      await updateChatMetadata(window.currentSecretChat, '🔒 Сообщение', Date.now());
      playMessageSound();
    } catch (e) { toast('Ошибка отправки', 'error'); }
  }

  function triggerSecretImageUpload() {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { toast('Изображение слишком большое (макс 5MB)', 'error'); return; }
      const reader = new FileReader();
      reader.addEventListener('load', (ev) => {
        const img = new Image();
        img.addEventListener('load', async () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          const maxW = 800, maxH = 800;
          if (w > maxW || h > maxH) {
            const ratio = Math.min(maxW / w, maxH / h);
            w = Math.round(w * ratio); h = Math.round(h * ratio);
          }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          await sendSecretImageMessage(canvas.toDataURL('image/jpeg', 0.7));
        });
        img.src = ev.target.result;
      });
      reader.readAsDataURL(file);
    });
    fileInput.click();
  }

  async function sendSecretImageMessage(dataUrl) {
    if (!window.currentSecretChat || !secretChatKey || !window.currentUser) return;
    try {
      const { iv, ciphertext } = await secretEncrypt(secretChatKey, dataUrl);
      const msgId = push(ref(db, 'messages')).key;
      await set(ref(db, `messages/${window.currentSecretChat}/${msgId}`), {
        id: msgId, type: 'image', iv, ciphertext,
        uid: window.currentUser.uid, name: window.userProfile?.name || 'User',
        timestamp: Date.now(), read: false
      });
      await updateChatMetadata(window.currentSecretChat, '🔒 Фото', Date.now());
      playMessageSound();
    } catch (e) { toast('Ошибка отправки фото', 'error'); }
  }

  async function deleteSecretMessageForMe(msgId) {
    if (!window.currentSecretChat || !window.currentUser) return;
    try {
      await update(ref(db, `messages/${window.currentSecretChat}/${msgId}`), {
        [`deletedFor/${window.currentUser.uid}`]: true
      });
      toast('Сообщение удалено (только у вас) 🗑');
    } catch (e) { toast('Ошибка удаления', 'error'); }
  }

  async function deleteSecretMessageForAll(msgId) {
    if (!window.currentSecretChat || !window.currentUser) return;
    if (!confirm('Удалить это сообщение у всех участников?')) return;
    try {
      await remove(ref(db, `messages/${window.currentSecretChat}/${msgId}`));
      toast('Сообщение удалено у всех 🗑');
    } catch (e) { toast('Ошибка удаления', 'error'); }
  }

  function showSafetyNumberModal(otherName) {
    showModal(`
      <h3>🔑 Код безопасности</h3>
      <p style="font-size:.82rem;color:var(--text-secondary);">
        Сравните этот код с ${escapeHtml(otherName || 'собеседником')} лично или по другому каналу связи (звонок, другой мессенджер).
        Совпадает — значит ключи не подменены и переписку никто не перехватывает.
      </p>
      <div class="safety-number-display">${escapeHtml(currentSecretSafetyNumber || '—')}</div>
      <button class="btn secondary" id="safetyNumCloseBtn">Понятно</button>`);
    document.getElementById('safetyNumCloseBtn')?.addEventListener('click', closeModal);
  }

  function renderChatMessages(sorted, chatName, otherUid, scrollToBottom, isGroup = false) {
    let messagesHTML = '';

    if (sorted.length > 0) {

      messagesHTML += sorted.map(m => {
        const isMine = m.uid === window.currentUser?.uid;
        const time = formatTime(m.timestamp);
        const fwd = m.forwarded ? '↩️ ' : '';
        const edited = m.edited ? ' (изм.)' : '';

        const replyHTML = m.replyToId
          ? `<div class="reply-preview-in-msg" data-reply-to="${escapeHtml(m.replyToId)}"><small style="color:var(--accent);">↩️ ${escapeHtml(m.replyToName || '')}</small><div>${escapeHtml((m.replyToText || '').slice(0, 60))}</div></div>`
          : '';

        const imageHTML = m.imageBase64
          ? `<img src="${m.imageBase64}" class="image-in-msg" alt="фото" data-image-base64="${m.imageBase64}">`
          : '';

        const audioHTML = m.audioBase64
          ? `<div class="audio-msg"><span>🎤</span><audio controls preload="none"><source src="${m.audioBase64}" type="${m.audioMime || 'audio/webm'}"></audio>${m.audioDuration ? `<span style="font-size:0.7rem;opacity:0.7;">${m.audioDuration}с</span>` : ''}</div>`
          : '';

        // Smart link card: only for plain text messages (not stickers/polls/location/dice/media)
        const linkUrl = (!m.isSticker && m.type !== 'poll' && m.type !== 'location' && m.type !== 'dice' && !m.imageBase64 && !m.audioBase64)
          ? extractFirstUrl(m.text) : null;
        const linkCardHTML = linkUrl ? renderLinkCard(linkUrl) : '';

        // Build reactions HTML with per-emoji groups showing avatars
        let reactionsHTML = '';
        if (m.reactions && Object.keys(m.reactions).length > 0) {
          // Group by emoji: { emoji: [{uid, avatar, name}] }
          const groups = {};
          Object.entries(m.reactions).forEach(([uid, emoji]) => {
            if (!groups[emoji]) groups[emoji] = [];
            groups[emoji].push(uid);
          });
          const myUid = window.currentUser?.uid;
          const groupsHTML = Object.entries(groups).map(([emoji, uids]) => {
            const isMine = uids.includes(myUid);
            const avatarsHTML = uids.slice(0, 3).map(uid => {
              const prof = window._reactionProfiles?.[uid];
              return `<div class="reaction-mini-av" style="background:${avatarColor(uid)};" data-uid="${uid}">${prof?.avatarBase64 ? `<img src="${prof.avatarBase64}">` : escapeHtml((prof?.name || uid)[0]?.toUpperCase() || '?')}</div>`;
            }).join('');
            return `<span class="reaction-group ${isMine ? 'mine' : ''}" data-emoji="${escapeHtml(emoji)}" data-msg-id="${escapeHtml(m.id || '')}"><span class="reaction-emoji">${emoji}</span><span class="reaction-avatars">${avatarsHTML}</span></span>`;
          }).join('');
          reactionsHTML = `<div class="reactions">${groupsHTML}</div>`;
        }
        let readByHTML = '';
        if (isGroup && m.readBy) {
          const readers = Object.keys(m.readBy).filter(uid => uid !== m.uid);
          if (readers.length > 0) {
            readByHTML = `<div class="read-avatars">${readers.slice(0, 5).map(uid =>
              `<div class="mini-avatar" style="background:${avatarColor(uid)};">${escapeHtml((uid || '?')[0]?.toUpperCase() || '?')}</div>`
            ).join('')}</div>`;
          }
        }

        const isFresh = Date.now() - (m.timestamp || 0) < 1200;
        return `
          <div class="message-container ${isMine ? 'outgoing' : 'incoming'} ${isFresh ? 'msg-fresh' : ''}">
            <div class="bubble" data-msg-id="${escapeHtml(m.id || '')}">
              ${replyHTML}
              ${imageHTML}
              ${audioHTML}
              <span class="text-content" data-raw="${escapeHtml(m.text||'')}">
                ${m.audioBase64
                  ? ''
                  : m.isSticker
                    ? renderStickerBubble(m)
                    : m.type === 'poll'
                      ? renderPollBubble(m)
                      : m.type === 'location'
                        ? renderLocationBubble(m)
                        : m.type === 'dice'
                          ? renderGameBubble(m)
                          : `${fwd}${parseMarkdown(m.text || '')}${edited}${m.disappearAt ? `<span class="disappear-badge">⏱</span>` : ''}${linkCardHTML}`}
              </span>
              <span class="meta">
                ${time}
                ${isMine ? `<span class="msg-status${m.read ? ' read' : ''}">${m.read ? '✓✓' : '✓'}</span>` : ''}
              </span>
              ${reactionsHTML}
            </div>
            ${readByHTML}
          </div>`;
      }).join('');
    } else {
      messagesHTML = '<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-title">Нет сообщений. Напишите первое!</div></div>';
    }

    document.getElementById('chatScreen').innerHTML = `
      <div class="header header-slim">
        <span class="icon-btn" id="backChatBtn">←</span>
        <h2 id="headerChatName" class="header-name-center"><span id="headerNameSpan">${escapeHtml(chatName)}</span>${otherUid ? ' <span id="onlineDot" class="online-dot offline"></span>' : ''}</h2>
        <span class="icon-btn" id="chatMenuBtn" title="Меню">⋮</span>
        ${otherUid ? `<span class="icon-btn" id="callBtn" title="Позвонить">📞</span>` : ''}
        ${otherUid ? `<span class="header-avatar" id="headerChatAvatar" title="Профиль"></span>` : ''}
      </div>
      <div id="pinnedBanner" class="pinned-banner" style="display:none;"></div>
      <div id="birthdayBanner" class="birthday-banner" style="display:none;"></div>
      <div class="messages-container" id="msgContainer">
        ${messagesHTML}
        <div id="typingIndicator" class="typing-indicator" style="display:none;">
          <span style="font-size:0.75rem;color:var(--text-secondary);">печатает</span>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
      <div class="input-area no-nav" style="position:relative;">
        <span class="icon-btn" id="attachMenuBtn" title="Прикрепить" style="flex-shrink:0;">⊕</span>
        <div class="attach-menu" id="attachMenu">
          <div class="attach-menu-item" data-attach="photo"><span class="am-icon">📷</span>Фото</div>
          <div class="attach-menu-item" data-attach="file"><span class="am-icon">📎</span>Файл</div>
          <div class="attach-menu-item" data-attach="geo"><span class="am-icon">📍</span>Геолокация</div>
          <div class="attach-menu-item" data-attach="games"><span class="am-icon">🎮</span>Игры</div>
          <div class="attach-menu-item" data-attach="poll"><span class="am-icon">📊</span>Опрос</div>
          <div class="attach-menu-item" data-attach="disappear"><span class="am-icon">⏱</span>Исчезающее</div>
          <div class="attach-menu-item" data-attach="schedule"><span class="am-icon">📅</span>Запланировать</div>
        </div>
        <input id="msgInput" placeholder="Сообщение..." maxlength="5000" autocomplete="off">
        <span class="icon-btn" id="sendMsgBtn">➤</span>
        <span class="icon-btn" id="voiceMsgBtn">🎤</span>
      </div>`;

    applyWallpaper(currentWallpaper);
    renderPinnedBanner();

    const msgContainer = document.getElementById('msgContainer');

    if (otherUid) {
      get(ref(db, `users/${otherUid}`)).then(snap => {
        const u = snap.val() || {};
        // Fix: update only the name span, NOT the entire h2 (which would destroy the onlineDot span)
        const nameSpan = document.getElementById('headerNameSpan');
        const hAvatar = document.getElementById('headerChatAvatar');
        if (nameSpan) nameSpan.textContent = u.name || 'Пользователь';
        if (hAvatar) {
          if (u.avatarBase64) {
            hAvatar.innerHTML = `<img src="${u.avatarBase64}" alt="avatar">`;
          } else {
            hAvatar.style.background = avatarColor(u.name || '?');
            hAvatar.textContent = (u.name || '?')[0]?.toUpperCase() || '?';
          }
          hAvatar.onclick = () => showChatInfo(window.currentChat, chatName, otherUid);
        }

        // Birthday banner: check if today matches the other user's birthday (YYYY-MM-DD)
        const todayDate = new Date();
        let isBirthdayToday = false;
        if (u.birthday) {
          const bd = new Date(u.birthday + 'T12:00:00');
          if (!isNaN(bd.getTime()) && bd.getMonth() === todayDate.getMonth() && bd.getDate() === todayDate.getDate()) {
            isBirthdayToday = true;
          }
        }
        renderBirthdayBanner(isBirthdayToday ? (u.name || 'Пользователь') : null);
        if (isBirthdayToday) {
          const onceKey = `p1xx_bdayShown_${otherUid}_${todayDate.getFullYear()}-${todayDate.getMonth()}-${todayDate.getDate()}`;
          if (!sessionStorage.getItem(onceKey)) {
            try { sessionStorage.setItem(onceKey, '1'); } catch (e) {}
            setTimeout(fireConfetti, 600);
          }
        }
      });
    }

    document.getElementById('backChatBtn').addEventListener('click', () => {

          const msgId = bubble.dataset.msgId;

      bubble.addEventListener('touchend', () => clearTimeout(longPressTimer));
      bubble.addEventListener('touchmove', () => clearTimeout(longPressTimer));
      bubble.addEventListener('contextmenu', (e) => {

        if (msgId) showMessageActions(msgId);

    // Reply preview click → scroll to original message
    document.querySelectorAll('.reply-preview-in-msg[data-reply-to]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const targetId = el.dataset.replyTo;
        const targetBubble = document.querySelector(`.bubble[data-msg-id="${targetId}"]`);
        if (targetBubble) {

    document.querySelectorAll('.bubble .reactions .reaction-group').forEach(el => {

        e.stopPropagation();

        const msgId = el.dataset.msgId;
        if (!emoji || !msgId) return;
        const snap = await get(ref(db, `messages/${window.currentChat}/${msgId}/reactions`));
        const reactions = snap.val() || {};
        const myUid = window.currentUser?.uid;
        if (reactions[myUid] === emoji) {
          // Own reaction — remove it
          delete reactions[myUid];
        } else {
          // Someone else's reaction — copy it
          reactions[myUid] = emoji;
        }
        await update(ref(db, `messages/${window.currentChat}/${msgId}`), { reactions });
      });
    });
  }

  async function sendMessage() {
    const input = document.getElementById('msgInput');
    if (!input || !input.value.trim() || !window.currentChat) return;
    const text = input.value.trim();
    input.disabled = true;
    try {
      const snap = await get(ref(db, `users/${window.currentUser.uid}`));
      const user = snap.val() || {};
      const msgId = push(ref(db, 'messages')).key;
      const msg = {
        id: msgId,
        text,
        encrypted: null,
        uid: window.currentUser.uid,
        name: user.name || 'User',
        username: user.username || '',
        timestamp: Date.now(),
        read: false,
        reactions: {}
      };
      if (disappearTimer > 0) {
        msg.disappearAt = Date.now() + disappearTimer;
        setTimeout(async () => {
          try { await remove(ref(db, `messages/${window.currentChat}/${msgId}`)); } catch(e) {}
        }, disappearTimer);
        disappearTimer = 0;
      }
      if (replyToMessage) {
        msg.replyToId = replyToMessage.id;
        msg.replyToText = replyToMessage.text;
        msg.replyToName = replyToMessage.name;
        replyToMessage = null;
        const rp = document.getElementById('replyPreview');
        if (rp) rp.remove();
      }
      await set(ref(db, `messages/${window.currentChat}/${msgId}`), msg);
      await updateChatMetadata(window.currentChat, text, msg.timestamp);
      playMessageSound();
      input.value = '';
      clearDraft(window.currentChat);
    } catch (e) {
      toast('Ошибка отправки: ' + e.message, 'error');
    }
    input.disabled = false;
    input.focus();
  }

  async function updateChatMetadata(chatId, lastMessage, timestamp) {
    if (!chatId || !db) return;
    try {
      await update(ref(db, `chats/${chatId}`), { lastMessage, lastMessageTime: timestamp });
      const chatSnap = await get(ref(db, `chats/${chatId}`));
      const chatData = chatSnap.val() || {};
      const participants = chatData.participants || [];
      for (const uid of participants) {
        if (!uid) continue;
        const uSnap = await get(ref(db, `user_chats/${uid}/${chatId}`));
        const curr = uSnap.val() || {};
        const currUnread = curr.unreadCount || 0;
        await update(ref(db, `user_chats/${uid}/${chatId}`), {
          lastMessage,
          lastMessageTime: timestamp,
          unreadCount: uid === window.currentUser?.uid ? 0 : currUnread + 1
        });
      }
    } catch (e) {
      console.error('Metadata update error:', e);
    }
  }

  function triggerImageUpload() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) return toast('Изображение слишком большое (макс 5MB)', 'error');
      const reader = new FileReader();
      reader.addEventListener('load', (ev) => {
        const img = new Image();
        img.src = ev.target.result;
        img.addEventListener('load', async () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          const maxW = 800, maxH = 800;
          if (w > maxW || h > maxH) {
            const ratio = Math.min(maxW / w, maxH / h);
            w *= ratio; h *= ratio;
          }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          await sendImageMessage(canvas.toDataURL('image/jpeg', 0.7));
        });
      });
      reader.readAsDataURL(file);
    });
    input.click();
  }

  function triggerFileUpload() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '*/*';
    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) return toast('Файл слишком большой (макс 10MB)', 'error');
      const reader = new FileReader();
      reader.addEventListener('load', (ev) => sendFileMessage(ev.target.result, file.name));
      reader.readAsDataURL(file);
    });
    input.click();
  }

  function showMessageActions(msgId) {
    const el = document.querySelector(`.bubble[data-msg-id="${msgId}"]`);
    if (!el) return;
    const msg = currentMessages.find(m => m.id === msgId);
    if (!msg) return;
    const isMine = msg.uid === window.currentUser?.uid;

    // Remove existing sheet
    document.querySelector('.msg-sheet-overlay')?.remove();
    document.querySelector('.msg-sheet')?.remove();

    const REACTIONS = ['❤️','😂','👍','😮','😢','😡'];
    const date = msg.timestamp
      ? new Date(msg.timestamp).toLocaleDateString('ru-RU')
      : '';
    const isPinned = !!(currentPinnedMessage && currentPinnedMessage.msgId === msgId);

    const actions = [
      { icon: '↩️', label: 'Ответить',             fn: () => replyToMessageById(msgId) },
      { icon: '📌', label: isPinned ? 'Открепить' : 'Закрепить', fn: () => isPinned ? unpinMessage() : pinMessage(msgId) },
      isMine ? { icon: '✏️', label: 'Редактировать', fn: () => editMessage(msgId) } : null,
      { icon: '📝', label: 'Переслать в заметки',   fn: () => forwardToNotes(msgId) },
      { icon: '💬', label: 'Переслать в чат',        fn: () => forwardToChat(msgId) },
      { icon: '📋', label: 'Копировать текст',
        fn: () => {
          const txt = el.querySelector('.text-content')?.textContent || '';
          navigator.clipboard?.writeText(txt.trim()).then(
            () => toast('Скопировано!'),
            () => toast('Ошибка', 'error')
          );
        }
      },
      { icon: '🗑', label: 'Удалить у меня',         fn: () => deleteMessageForMe(msgId) },
      isMine ? { icon: '🗑', label: 'Удалить у всех', danger: true, fn: () => deleteMessageForAll(msgId) } : null,
      (window.isAdmin && !isMine) ? { icon: '🚫', label: 'Забанить отправителя', danger: true, fn: () => banUser(msg.uid) } : null,
    ].filter(Boolean);

    const overlay = document.createElement('div');
    overlay.className = 'msg-sheet-overlay';
    const sheet = document.createElement('div');
    sheet.className = 'msg-sheet';
    sheet.innerHTML = `
      <div class="msg-sheet-reactions">
        ${REACTIONS.map(e => `<span class="msr-emoji" data-r="${e}">${e}</span>`).join('')}
      </div>
      <div class="msg-sheet-preview">
        <span class="msp-name">${escapeHtml(msg.name || 'Сообщение')}</span>
        <span class="msp-date">${date}</span>
      </div>
      ${actions.map(a => `
        <div class="msg-sheet-item${a.danger ? ' danger' : ''}" data-action="${escapeHtml(a.label)}">
          <span class="msi-icon">${a.icon}</span>
          ${escapeHtml(a.label)}
        </div>`).join('')}`;

    const close = () => { overlay.remove(); sheet.remove(); };
    overlay.addEventListener('click', close);
    sheet.querySelectorAll('.msr-emoji').forEach(e => {
      e.addEventListener('click', () => { close(); addReaction(msgId, e.dataset.r); });
    });
    sheet.querySelectorAll('.msg-sheet-item').forEach((el2, i) => {
      el2.addEventListener('click', () => { close(); actions[i].fn(); });
    });

    document.body.appendChild(overlay);
    document.body.appendChild(sheet);
  }

  async function replyToMessageById(msgId) {

    const msg = snap.val();
    if (!msg) return toast('Сообщение не найдено', 'error');
    replyToMessage = { id: msg.id, text: msg.text, name: msg.name };
    const inputArea = document.querySelector('.input-area');
    const existing = document.getElementById('replyPreview');
    if (existing) existing.remove();
    const preview = document.createElement('div');
    preview.id = 'replyPreview';

    preview.innerHTML = `
      <div>
        <small style="color:var(--accent);">↩️ ${escapeHtml(msg.name)}</small>
        <div style="font-size:0.85rem;opacity:0.8;">${escapeHtml((msg.text || '').slice(0, 50))}</div>
      </div>

  function showReactionPicker(msgId, x, y) {
    const old = document.querySelector('.reaction-picker');
    if (old) old.remove();
    const picker = document.createElement('div');
    picker.className = 'reaction-picker';
    picker.style.left = Math.min(x, window.innerWidth - 280) + 'px';
    picker.style.top = Math.max(60, y - 60) + 'px';
    picker.innerHTML = REACTIONS_LIST.map(r => `<span data-reaction="${r}">${r}</span>`).join('');
    document.body.appendChild(picker);
    requestAnimationFrame(() => {
      const rect = picker.getBoundingClientRect();
      if (rect.right > window.innerWidth - 10) picker.style.left = (window.innerWidth - rect.width - 10) + 'px';
      if (rect.bottom > window.innerHeight - 10) picker.style.top = (window.innerHeight - rect.height - 10) + 'px';
      picker.classList.add('show');
    });
    picker.querySelectorAll('span').forEach(span => {
      span.addEventListener('click', (e) => {
        e.stopPropagation();
        addReaction(msgId, span.dataset.reaction);
        picker.remove();
      });
    });
    setTimeout(() => {
      document.addEventListener('click', function closePicker(e) {
        if (!picker.contains(e.target)) { picker.remove(); document.removeEventListener('click', closePicker); }
      });
    }, 100);
  }

  async function editMessage(msgId) {
    if (!window.currentChat) return;
    try {
      const snap = await get(ref(db, `messages/${window.currentChat}/${msgId}`));
      const message = snap.val();
      if (!message || message.uid !== window.currentUser.uid) return toast('Нельзя редактировать', 'error');

          text: newText.trim(), edited: true, editedAt: Date.now()
        });

  async function forwardToNotes(msgId) {
    if (!window.currentUser) return;
    const snap = await get(ref(db, `messages/${window.currentChat}/${msgId}`));
    const msg = snap.val();
    if (!msg) return toast('Сообщение не найдено', 'error');
    const noteObj = {
      createdAt: Date.now(),
      forwardedFrom: msg.name || 'Пользователь',
      text: msg.text || '',
    };
    if (msg.type === 'poll') {
      const optsList = Object.values(msg.options||{}).map((o,i)=>(i+1)+'. '+o).join('\n');
      noteObj.text = '📊 Опрос: ' + (msg.question||'') + '\n' + optsList;
      noteObj.mediaType = 'poll';
    } else if (msg.type === 'location') {
      noteObj.text = '📍 Геолокация: ' + msg.lat + ', ' + msg.lng + '\nhttps://maps.google.com/?q=' + msg.lat + ',' + msg.lng;
      noteObj.mediaType = 'location';
    } else if (msg.type === 'dice') {
      const gameMeta = GAMES[msg.game] || GAMES.dice;
      noteObj.text = msg.resultLabel ? `${gameMeta.icon} ${gameMeta.label}: ${msg.resultLabel}` : `🎲 Кубик выпал: ${msg.text}`;
    } else if (msg.imageBase64) {
      noteObj.mediaBase64 = msg.imageBase64; noteObj.mediaType = 'image';
    } else if (msg.audioBase64) {
      noteObj.mediaBase64 = msg.audioBase64; noteObj.mediaType = 'audio';
    }
    await push(ref(db, `notes/${window.currentUser.uid}`), noteObj);
    toast('Переслано в заметки 📝', 'success');
  }

  async function forwardToChat(msgId) {
    if (!window.currentChat || !window.currentUser) return;
    try {
      const snap = await get(ref(db, `messages/${window.currentChat}/${msgId}`));
      const originalMsg = snap.val();
      if (!originalMsg) return toast('Сообщение не найдено', 'error');
      const uChatsSnap = await get(ref(db, `user_chats/${window.currentUser.uid}`));
      const userChats = uChatsSnap.val() || {};
      const chatOptions = Object.entries(userChats)
        .filter(([id]) => id !== window.currentChat)
        .map(([id]) => ({ id, name: chatNames[id] || 'Чат' }));

      if (chatOptions.length === 0) return toast('Нет других чатов для пересылки', 'warning');

      showModal(`
        <h3>📨 Переслать сообщение</h3>
        <p style="font-size:0.85rem;color:var(--text-secondary);">Выберите чат:</p>
        ${chatOptions.map((o, i) => `<button class="btn secondary" id="fwdChat${i}">${escapeHtml(o.name)}</button>`).join('')}
        <div style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="hideForwardSource">
          <label for="hideForwardSource" style="font-size:0.85rem;">Скрыть от кого переслано</label>
        </div>
        <button class="btn danger" id="closeFwdBtn">Отмена</button>`);

      chatOptions.forEach((o, i) => {
        const btn = document.getElementById(`fwdChat${i}`);
        if (btn) {
          btn.addEventListener('click', () => {
            const hide = document.getElementById('hideForwardSource')?.checked || false;
            closeModal();
            forwardMessageToChat(o.id, originalMsg, hide);
          });
        }
      });
      document.getElementById('closeFwdBtn').addEventListener('click', closeModal);
    } catch (e) { toast('Ошибка пересылки', 'error'); }
  }

  async function forwardMessageToChat(targetChatId, originalMsg, hideSource = false) {
    if (!window.currentUser) return;
    try {
      const snap = await get(ref(db, `users/${window.currentUser.uid}`));
      const user = snap.val() || {};
      const forwardText = hideSource
        ? `↩️ Пересланное сообщение\n${originalMsg.text}`
        : `↩️ Переслано от ${originalMsg.name || 'Пользователь'}\n${originalMsg.text}`;
      const msgId = push(ref(db, 'messages')).key;
      const msg = {
        id: msgId, text: forwardText, imageBase64: originalMsg.imageBase64 || null,
        isSticker: false, uid: window.currentUser.uid, name: user.name || 'User',
        username: user.username || '', timestamp: Date.now(), read: false, reactions: {},
        forwarded: true,
        originalUid: hideSource ? null : originalMsg.uid,
        originalName: hideSource ? null : originalMsg.name
      };
      await set(ref(db, `messages/${targetChatId}/${msgId}`), msg);
      await updateChatMetadata(targetChatId, forwardText, msg.timestamp);
      toast('Сообщение переслано 📨');
    } catch (e) { toast('Ошибка пересылки', 'error'); }
  }

  // ── Pinned messages ───────────────────────────────────────────
  async function pinMessage(msgId) {
    if (!window.currentChat) return;
    const msg = currentMessages.find(m => m.id === msgId);
    if (!msg) return toast('Сообщение не найдено', 'error');
    const preview = msg.isSticker ? '🎨 Стикер'
      : msg.type === 'poll' ? `📊 ${msg.question || msg.text || 'Опрос'}`
      : msg.type === 'location' ? '📍 Геолокация'
      : msg.type === 'dice' ? `${(GAMES[msg.game]||GAMES.dice).icon} ${msg.resultLabel || msg.text}`
      : msg.imageBase64 ? '📷 Фото'

  function stickerThumbHtml(s) {

      return `<div class="lottie-sticker" data-lottie-src="${escapeHtml(s.mediaBase64||'')}">${escapeHtml(s.emoji||'✨')}</div>`;
    }
    return `<img src="${s.mediaBase64}" alt="${escapeHtml(s.emoji||'')}" draggable="false">`;
  }

  // Animated (.tgs) stickers are stored as raw gzip bytes (base64) so import
  // always succeeds regardless of the importing browser. Rendering them is
  // best-effort per-viewer: needs DecompressionStream + lottie-web (loaded
  // from CDN on demand). Any failure just leaves the emoji glyph in place.
  let _lottieLibPromise = null;
  function ensureLottieLib() {
    if (window.lottie) return Promise.resolve(window.lottie);
    if (_lottieLibPromise) return _lottieLibPromise;
    _lottieLibPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js';
      s.onload = () => resolve(window.lottie);
      s.onerror = () => reject(new Error('lottie load failed'));
      document.head.appendChild(s);
    });
    return _lottieLibPromise;
  }
  async function decompressTgsBase64(dataUrl) {
    const b64 = (dataUrl.split(',').pop() || '');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const buf = await new Response(stream).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  async function mountLottieStickers(root) {
    const nodes = (root || document).querySelectorAll('.lottie-sticker[data-lottie-src]:not([data-lottie-mounted])');
    for (const node of nodes) {
      const src = node.dataset.lottieSrc;
      if (!src) continue;
      node.dataset.lottieMounted = '1';
      try {
        if (typeof DecompressionStream === 'undefined') throw new Error('unsupported');
        const animData = await decompressTgsBase64(src);
        const lottie = await ensureLottieLib();
        node.textContent = '';
        lottie.loadAnimation({ container: node, renderer: 'svg', loop: true, autoplay: true, animationData: animData });
      } catch (e) { /* keep emoji fallback already in the node */ }
    }
  }

  function renderStickerBubble(m) {

  // Telegram's JSON methods (api.telegram.org/bot<token>/<method>) are
  // reachable directly from the browser, but the raw file endpoint
  // (api.telegram.org/file/bot<token>/<path>) does not appear to send
  // permissive CORS headers — a direct fetch() for the actual sticker bytes
  // fails even though getStickerSet/getFile succeed. These helpers try direct
  // first, then fall back through public CORS proxies so import keeps working.
  async function fetchJsonViaTelegram(url) {
    try {
      const r = await fetch(url);
      if (r.ok) return await r.json();
    } catch (e) { /* fall through to proxy */ }
    const r2 = await fetch('https://corsproxy.io/?url=' + encodeURIComponent(url));
    if (!r2.ok) throw new Error('HTTP ' + r2.status);
    return r2.json();
  }
  async function fetchBlobViaTelegram(url, isImage) {
    try {
      const r = await fetch(url);
      if (r.ok) return await r.blob();
    } catch (e) { /* fall through to proxies */ }
    const attempts = isImage
      ? [
          'https://images.weserv.nl/?url=' + encodeURIComponent(url.replace(/^https?:\/\//, '')),
          'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
          'https://corsproxy.io/?url=' + encodeURIComponent(url),
        ]
      : [
          'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
          'https://corsproxy.io/?url=' + encodeURIComponent(url),
        ];
    let lastErr = new Error('нет ответа');
    for (const proxyUrl of attempts) {
      try {
        const r = await fetch(proxyUrl);
        if (r.ok) return await r.blob();
        lastErr = new Error('прокси HTTP ' + r.status);
      } catch (e) { lastErr = e; }
    }
    throw new Error('CORS-прокси недоступны (' + (lastErr.message || lastErr) + ')');
  }
  // Proxies don't always forward the original Content-Type, so re-tag the
  // blob with the type we already know it should be before base64-encoding —
  // otherwise the resulting data URL can end up untyped/unusable.
  async function blobToTypedDataUrl(blob, expectedMime) {
    let finalBlob = blob;
    if (expectedMime && (!blob.type || blob.type === 'application/octet-stream' || blob.type.startsWith('text/'))) {
      finalBlob = new Blob([await blob.arrayBuffer()], { type: expectedMime });
    }
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(finalBlob);
    });
  }

  async function importTelegramStickerPack(token, rawInput) {
    const progressEl = document.getElementById('tgImportProgress');
    const importBtn = document.getElementById('tgImportBtn');
    const setProgress = (txt) => { if (progressEl) progressEl.textContent = txt; };
    const nameMatch = rawInput.match(/([A-Za-z0-9_]+)\/?$/);
    const shortName = nameMatch ? nameMatch[1] : '';
    if (!shortName) { toast('Не удалось распознать ссылку на стикерпак', 'error'); return; }

    if (importBtn) importBtn.disabled = true;
    setProgress('Получаем стикерпак…');
    try {
      const setRes = await fetchJsonViaTelegram(`https://api.telegram.org/bot${token}/getStickerSet?name=${encodeURIComponent(shortName)}`);
      if (!setRes.ok) throw new Error(setRes.description || 'Стикерпак не найден');
      const allStickers = setRes.result.stickers || [];
      const stickers = allStickers.slice(0, 60);
      if (!stickers.length) throw new Error('В этом стикерпаке нет стикеров');

      const results = new Array(stickers.length).fill(null);
      const failReasons = [];
      let done = 0;
      let nextIdx = 0;
      const worker = async () => {
        while (nextIdx < stickers.length) {
          const i = nextIdx++;
          const tg = stickers[i];
          try {
            const fileRes = await fetchJsonViaTelegram(`https://api.telegram.org/bot${token}/getFile?file_id=${tg.file_id}`);
            if (!fileRes.ok) throw new Error(fileRes.description || 'getFile отклонён');
            const filePath = fileRes.result.file_path || '';
            let mediaType = 'image';
            if (tg.is_video || filePath.endsWith('.webm')) mediaType = 'video';
            else if (tg.is_animated || filePath.endsWith('.tgs')) mediaType = 'tgs';
            const expectedMime = mediaType === 'video' ? 'video/webm' : mediaType === 'tgs' ? 'application/gzip' : 'image/webp';
            const blob = await fetchBlobViaTelegram(`https://api.telegram.org/file/bot${token}/${filePath}`, mediaType === 'image');
            const base64 = await blobToTypedDataUrl(blob, expectedMime);
            results[i] = { emoji: tg.emoji || '✨', mediaType, mediaBase64: base64 };
          } catch (e) { results[i] = null; failReasons.push(e.message || String(e)); }
          done++;
          setProgress(`Загружаем стикеры… ${done}/${stickers.length}`);
        }
      };
      await Promise.all(Array.from({ length: Math.min(6, stickers.length) }, worker));
      const finalStickers = results.filter(Boolean);
      if (!finalStickers.length) {
        throw new Error('не загрузился ни один стикер — ' + (failReasons[0] || 'неизвестная причина'));
      }

      setProgress('Сохраняем в P1XX…');
      const packId = shortName.replace(/[.#$/\[\]]/g, '_');
      await set(ref(db, `stickerPacks/${packId}`), {
        meta: {
          title: setRes.result.title || shortName,
          tgName: shortName,
          addedBy: window.userProfile?.username || window.currentUser?.uid || '',
          addedAt: Date.now(),
          count: finalStickers.length
        },
        stickers: finalStickers
      });
      closeModal();
      const failedCount = stickers.length - finalStickers.length;
      toast(`Стикерпак «${setRes.result.title || shortName}» импортирован ✨ (${finalStickers.length}/${stickers.length}${failedCount ? ', ' + failedCount + ' не удалось' : ''})`, 'success', 4500);
    } catch (e) {
      setProgress('');
      toast('Не удалось импортировать: ' + (e.message || 'ошибка сети') + '. Проверьте токен и ссылку.', 'error', 5500);
    } finally {
      if (importBtn) importBtn.disabled = false;
    }
  }

  function recordVoiceMessage() {
    if (!window.MediaRecorder) return toast('Голосовые сообщения не поддерживаются в этом браузере', 'error');
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      // Pick the best supported MIME type (iOS Safari needs mp4/aac)
      const mimeType = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4']
        .find(t => MediaRecorder.isTypeSupported(t)) || '';
      const recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        stream.getTracks().forEach(t => t.stop());
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const base64 = ev.target.result;
          if (!window.currentChat || !window.currentUser) return;
          try {
            const snap = await get(ref(db, `users/${window.currentUser.uid}`));
            const user = snap.val() || {};
            const msgId = push(ref(db, 'messages')).key;
            const msg = {
              id: msgId,
              text: '🎤 Голосовое сообщение',
              audioBase64: base64,
              audioMime: recorder.mimeType || 'audio/webm',
              audioDuration: Math.round((Date.now() - voiceStartTime) / 1000),
              uid: window.currentUser.uid,
              name: user.name || 'User',
              username: user.username || '',
              timestamp: Date.now(),
              read: false,
              reactions: {}
            };
            if (replyToMessage) {
              msg.replyToId = replyToMessage.id;
              msg.replyToText = replyToMessage.text;
              msg.replyToName = replyToMessage.name;
              replyToMessage = null;
              const rp = document.getElementById('replyPreview');
              if (rp) rp.remove();
            }
            await set(ref(db, `messages/${window.currentChat}/${msgId}`), msg);
            await updateChatMetadata(window.currentChat, '🎤 Голосовое сообщение', msg.timestamp);
            playMessageSound();
            toast('Голосовое сообщение отправлено 🎤');
          } catch (e) { toast('Ошибка отправки голосового', 'error'); }
        };
        reader.readAsDataURL(blob);
      };
      recorder.start(100); // collect in 100ms chunks for better reliability
      const voiceStartTime = Date.now();
      toast('🔴 Запись... Нажмите 🎤 снова для остановки');
      const voiceBtn = document.getElementById('voiceMsgBtn');
      const stopRecording = () => {
        if (recorder.state === 'recording') recorder.stop();
        voiceBtn.removeEventListener('click', stopRecording);
        voiceBtn.addEventListener('click', recordVoiceMessage, { once: true });
        toast('Запись завершена ✅');
      };
      voiceBtn.removeEventListener('click', recordVoiceMessage);
      voiceBtn.addEventListener('click', stopRecording, { once: true });
      setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 60000);
    }).catch(() => toast('Нет доступа к микрофону', 'error'));
  }

  function renderNotes() {
    if (!window.currentUser) return;
    if (notesUnsubscribe) { try { notesUnsubscribe(); } catch(e) {} notesUnsubscribe = null; }
    notesUnsubscribe = onValue(ref(db, `notes/${window.currentUser.uid}`), (snap) => {
      const data = snap.val() || {};
      const hash = JSON.stringify(data);
      if (hash === notesLastHash) return;
      notesLastHash = hash;

      const list = Object.entries(data).sort((a, b) => (b[1]?.createdAt || 0) - (a[1]?.createdAt || 0));

      const html = list.length > 0
        ? list.map(([id, note], i) => `
            <div class="chat-item new-item" data-id="${escapeHtml(id)}" style="animation-delay:${i * 0.035}s">
              <div style="flex:1;overflow:hidden;">
                <div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                  ${note.mediaType==='image'||note.imageBase64 ? '📷 ' : note.mediaType==='audio' ? '🎵 ' : note.mediaType==='poll' ? '📊 ' : note.mediaType==='location' ? '📍 ' : note.mediaType==='file' ? '📎 ' : ''}${escapeHtml((note.text || '').slice(0, 60))}
                </div>
                <small style="color:var(--text-secondary);">
                  ${note.createdAt ? formatTime(note.createdAt) : ''}
                  ${note.forwardedFrom ? ' • Переслано' : ''}
                </small>
              </div>
              <span style="color:var(--text-secondary);">›</span>
            </div>`).join('')
        : '<div class="empty-state"><div class="empty-icon">🗒️</div><div class="empty-title">Нет заметок</div></div>';

      document.getElementById('notesScreen').innerHTML = `
        <div class="header">
          <h2>📝 Заметки</h2>
          <span class="icon-btn" id="addNoteBtn">+</span>
          <span class="icon-btn" id="exportNotesBtn">📤</span>
        </div>
        <div class="list">${html}</div>`;

      document.getElementById('addNoteBtn').addEventListener('click', () => {
        showModal(`
          <h3>📝 Новая заметка</h3>
          <textarea id="noteText" placeholder="Текст заметки..." rows="4"
                    style="width:100%;padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);resize:vertical;"></textarea>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="file" id="noteMediaInput" accept="image/*,audio/*,video/*,.pdf" style="display:none;">
            <button class="btn secondary" id="noteAddMediaBtn" style="font-size:.82rem;">📎 Прикрепить файл</button>
            <span id="noteMediaName" style="font-size:.72rem;color:var(--text-secondary);"></span>
          </div>
          <button class="btn" id="saveNoteBtn">Сохранить</button>`);
        let noteMediaData = null; let noteMediaType = '';
        document.getElementById('noteAddMediaBtn').addEventListener('click', () => document.getElementById('noteMediaInput').click());
        document.getElementById('noteMediaInput').addEventListener('change', (e) => {
          const file = e.target.files[0]; if (!file) return;
          if (file.size > 8*1024*1024) return toast('Файл до 8MB','error');
          const reader = new FileReader();
          reader.onload = (ev) => {
            noteMediaData = ev.target.result;
            noteMediaType = file.type.startsWith('image') ? 'image' : file.type.startsWith('audio') ? 'audio' : 'file';
            document.getElementById('noteMediaName').textContent = file.name.slice(0,30);
          };
          reader.readAsDataURL(file);
        });
        document.getElementById('saveNoteBtn').addEventListener('click', async () => {
          const text = document.getElementById('noteText')?.value.trim() || '';
          if (!text && !noteMediaData) return toast('Введите текст или прикрепите файл', 'error');
          const noteObj = { text: text||'', createdAt: Date.now() };
          if (noteMediaData) { noteObj.mediaBase64 = noteMediaData; noteObj.mediaType = noteMediaType; }
          await push(ref(db, `notes/${window.currentUser.uid}`), noteObj);
          closeModal(); toast('Заметка сохранена!');
        });
      });

      document.getElementById('exportNotesBtn').addEventListener('click', () => {
        toast('Экспорт заметок (симуляция)', 'success');
      });

      document.querySelectorAll('#notesScreen .chat-item').forEach(el => {
        el.addEventListener('click', () => {
          const note = data[el.dataset.id];
          if (!note) return;
          const imageHTML = note.imageBase64
            ? `<img src="${note.imageBase64}" class="image-note-in-view" alt="изображение" data-image-base64="${note.imageBase64}">`
            : '';
          const mtype = note.mediaType || (note.imageBase64 ? 'image' : note.audioBase64 ? 'audio' : '');
          let mediaHTML = '';
          if (mtype === 'image' && (note.mediaBase64 || note.imageBase64)) {
            const src = note.mediaBase64 || note.imageBase64;
            mediaHTML = `<img src="${src}" class="note-media-thumb" data-img="${src}" style="cursor:pointer;">`;
          } else if (mtype === 'audio' || (note.audioBase64)) {
            mediaHTML = `<audio controls style="width:100%;margin-top:8px;"><source src="${note.mediaBase64||note.audioBase64}"></audio>`;
          } else if (mtype === 'video' && note.mediaBase64) {
            mediaHTML = `<video controls style="width:100%;border-radius:12px;margin-top:8px;max-height:200px;"><source src="${note.mediaBase64}"></video>`;
          }
          const fwdBadge = note.forwardedFrom ? `<div class="note-content-badge">↩️ Переслано от: ${escapeHtml(note.forwardedFrom)}</div>` : '';
          const typeBadge = mtype && mtype !== 'default'
            ? `<div class="note-content-badge">${{image:'📷 Фото',audio:'🎵 Голосовое',video:'🎬 Видео',poll:'📊 Опрос',location:'📍 Геолокация',dice:'🎲 Кубик',file:'📎 Файл'}[mtype]||''}</div>`
            : '';
          showModal(`
            <h3>📝 Заметка</h3>
            ${fwdBadge}${typeBadge}
            ${note.text ? `<div style="white-space:pre-wrap;word-break:break-word;max-height:220px;overflow-y:auto;padding:10px;background:var(--bg-primary);border-radius:12px;font-size:.88rem;">${escapeHtml(note.text)}</div>` : ''}
            ${mediaHTML}
            <small style="color:var(--text-secondary);">${note.createdAt ? new Date(note.createdAt).toLocaleString() : ''}</small>
            <div style="display:flex;gap:8px;margin-top:6px;">
              <button class="btn" id="editNoteBtn">✏️ Редактировать</button>
              <button class="btn danger" id="delNoteBtn">🗑 Удалить</button>
            </div>`);

          setTimeout(() => {
            const noteImg = document.querySelector('.note-media-thumb[data-img]');
            if (noteImg) noteImg.addEventListener('click', () => viewFullImage(noteImg.dataset.img));
          }, 100);

          document.getElementById('editNoteBtn').addEventListener('click', () => {
            closeModal();
            const newText = prompt('Редактировать заметку:', note.text);
            if (newText && newText.trim()) {
              update(ref(db, `notes/${window.currentUser.uid}/${el.dataset.id}`), { text: newText.trim(), editedAt: Date.now() });
              toast('Заметка обновлена');
            }
          });
          document.getElementById('delNoteBtn').addEventListener('click', async () => {
            await remove(ref(db, `notes/${window.currentUser.uid}/${el.dataset.id}`));
            closeModal();
            toast('Заметка удалена 🗑');
          });
        });
      });
    });
  }

  function handleAvatarUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) return toast('Файл слишком большой (макс 5MB)', 'error');
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.src = ev.target.result;
      img.onload = async () => {
        const canvas = document.createElement('canvas');
        canvas.width = 200; canvas.height = 200;
        canvas.getContext('2d').drawImage(img, 0, 0, 200, 200);
        const base64 = canvas.toDataURL('image/jpeg', 0.8);
        try {
          await update(ref(db, `users/${window.currentUser.uid}`), { avatarBase64: base64 });
          window.userProfile.avatarBase64 = base64;
          toast('Аватар обновлён!');
          renderSettings();
        } catch (err) { toast('Ошибка загрузки', 'error'); }
      };
    };
    reader.readAsDataURL(file);
  }

  // ── parseMarkdown ────────────────────────────────────────────
  function parseMarkdown(raw) {
    if (!raw) return '';
    const esc = String(raw)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    return esc
      .replace(/~~([\s\S]*?)~~/g,'<del>$1</del>')
      .replace(/\*\*([\s\S]*?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*([\s\S]*?)\*/g,'<em>$1</em>')
      .replace(/_([\s\S]*?)_/g,'<em>$1</em>')
      .replace(/`([^`]+)`/g,'<span class="md-code">$1</span>')
      .replace(/(https?:\/\/[^\s<>"]+)/g,'<a class="md-link" href="$1" target="_blank" rel="noopener">$1</a>');
  }

  // ── Smart link cards ─────────────────────────────────────────
  // Lightweight preview chip for URLs in chat text: favicon + hostname.
  // Deliberately avoids fetching the target page (no CORS/backend needed) —
  // the favicon loads as a plain <img>, which works cross-origin with no fetch.
  function extractFirstUrl(text) {
    if (!text) return null;
    const m = String(text).match(/https?:\/\/[^\s<>"']+/i);
    if (!m) return null;
    return m[0].replace(/[),.!?:;]+$/, '');
  }

  function renderLinkCard(url) {
    let hostname = url;
    try { hostname = new URL(url).hostname.replace(/^www\./, ''); } catch (e) {}
    const favicon = `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(hostname)}`;
    return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="link-card">
      <img src="${favicon}" class="link-card-icon" alt="">
      <div class="link-card-info">
        <span class="link-card-host">${escapeHtml(hostname)}</span>
        <span class="link-card-cta">Открыть ссылку ↗</span>
      </div>
    </a>`;
  }

  // ── renderPollBubble ─────────────────────────────────────────
  function renderPollBubble(m) {
    const options   = m.options || {};
    const votes     = m.votes   || {};
    const myVote    = votes[window.currentUser?.uid];
    const totalV    = Object.keys(votes).length;
    const isAnon    = !!m.anonymous;
    const isCreator = m.uid === window.currentUser?.uid;
    const canAddOpt = m.allowAddOptions;

    const optHtml = Object.entries(options).map(([key, txt]) => {
      const voterUids = Object.entries(votes).filter(([,v])=>v===key).map(([u])=>u);
      const cnt  = voterUids.length;
      const pct  = totalV > 0 ? Math.round((cnt / totalV) * 100) : 0;
      const mine = myVote === key;
      // Voters display (only for non-anonymous)
      const votersHtml = !isAnon && cnt > 0
        ? `<div class="poll-voters-list">${voterUids.slice(0,3).map(uid=>`<span>@${escapeHtml(uid.slice(0,6))}</span>`).join(' ')}</div>`
        : '';
      return `<div class="poll-option${mine ? ' my-vote' : ''}" data-poll-msg="${escapeHtml(m.id||'')}" data-poll-opt="${escapeHtml(key)}">
        <div class="poll-bar" style="width:${pct}%"></div>
        <span>${escapeHtml(txt)}</span>
        <span class="poll-percent">${pct}%</span>
        ${votersHtml}
      </div>`;
    }).join('');

    const word = totalV === 1 ? 'голос' : (totalV >= 2 && totalV <= 4) ? 'голоса' : 'голосов';
    const editBtn = isCreator
      ? `<span class="poll-edit-btn" data-poll-edit="${escapeHtml(m.id||'')}" style="font-size:.7rem;cursor:pointer;opacity:.7;margin-left:6px;">✎</span>`
      : '';
    const addOptBtn = (canAddOpt || isCreator)
      ? `<div class="poll-option" data-poll-add="${escapeHtml(m.id||'')}" style="opacity:.6;font-size:.78rem;">＋ Добавить вариант</div>`
      : '';

    return `<div class="poll-bubble">
      <div class="poll-question">📊 ${escapeHtml(m.question||'Опрос')}${editBtn}</div>
      ${optHtml}
      ${addOptBtn}
      <div class="poll-total">${totalV} ${word}${isAnon ? ' · 🔒 Анонимно' : ' · 👁 Открытое'}</div>
    </div>`;
  }

  // ── renderLocationBubble ─────────────────────────────────────
  function renderLocationBubble(m) {
    const lat = parseFloat(m.lat || 0).toFixed(6);
    const lng = parseFloat(m.lng || 0).toFixed(6);
    return `<div class="loc-card" data-lat="${lat}" data-lng="${lng}">
      <span class="loc-icon">📍</span>
      <div class="loc-info">
        <span class="loc-title">Моё местоположение</span>

  // ── openInMapsPicker: bottom-sheet choice of map provider ──────
  function openInMapsPicker(lat, lng) {
    document.querySelector('.msg-sheet-overlay')?.remove();
    const providers = [
      { icon: '🟡', label: 'Яндекс Карты', url: `https://yandex.ru/maps/?pt=${lng},${lat}&z=17&l=map` },
      { icon: '🔵', label: 'Google Maps', url: `https://www.google.com/maps/search/?api=1&query=${lat},${lng}` },
      { icon: '🟢', label: '2ГИС', url: `https://2gis.ru/geo/${lng},${lat}?m=${lng},${lat}/16` },
    ];
    const overlay = document.createElement('div');
    overlay.className = 'msg-sheet-overlay';
    overlay.innerHTML = `
      <div class="msg-sheet">
        ${providers.map((p, i) => `<div class="msg-sheet-item" data-map-idx="${i}"><span>${p.icon}</span><span>Открыть в «${escapeHtml(p.label)}»</span></div>`).join('')}
      </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('show'));
    const close = () => { overlay.classList.remove('show'); setTimeout(() => overlay.remove(), 200); };
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    overlay.querySelectorAll('[data-map-idx]').forEach(el => {
      el.addEventListener('click', () => {
        const p = providers[parseInt(el.dataset.mapIdx, 10)];
        if (p) window.open(p.url, '_blank', 'noopener');
        close();
      });
    });
  }

    if (!msg || msg.uid !== window.currentUser?.uid) return toast('Только создатель может редактировать опрос','error');
    const isAnon = !!msg.anonymous;
    const allowAdd = !!msg.allowAddOptions;
    showModal(`
      <h3>✏️ Редактировать опрос</h3>
      <input id="editPollQ" value="${escapeHtml(msg.question||'')}" maxlength="100"

  let _titleBlinkInt = null;
