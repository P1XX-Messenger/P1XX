  function updateNavUnreadBadge() {
    const mutedChats = JSON.parse(localStorage.getItem('p1xx_mutedChats') || '[]');
    let total = 0;
    if (window._allChatData) {
      Object.entries(window._allChatData).forEach(([id, c]) => {
        if (!mutedChats.includes(id)) total += (c.unreadCount || 0);
      });
    }
    _totalUnread = total;

    const chatsNav = document.querySelector('[data-screen="chats"]');
    if (chatsNav) {
      let badge = chatsNav.querySelector('.nav-unread-badge');
      if (total > 0) {
        if (!badge) {
          badge = document.createElement('div');
          badge.className = 'nav-unread-badge';
          chatsNav.appendChild(badge);
        }
        badge.textContent = total > 99 ? '99+' : total;
      } else {
        if (badge) badge.remove();
      }
    }

    if (total > 0 && document.hidden) startTitleBlink(total);
    else if (total === 0) stopTitleBlink();
  }

  function startTitleBlink(count) {
    if (_titleBlinkInt) return;
    const orig = 'P1XX';
    let show = true;
    _titleBlinkInt = setInterval(() => {
      document.title = show ? `(${count}) P1XX` : orig;
      show = !show;
    }, 1000);
  }

  function stopTitleBlink() {
    if (_titleBlinkInt) { clearInterval(_titleBlinkInt); _titleBlinkInt = null; }
    document.title = 'P1XX';
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) stopTitleBlink();
    else if (_totalUnread > 0) startTitleBlink(_totalUnread);

      const snap = await get(ref(db, `users/${window.currentUser.uid}`));
      const user = snap.val() || {};
      const msgId = push(ref(db,'messages')).key;
      await set(ref(db, `messages/${window.currentChat}/${msgId}`), {
        id: msgId, type: 'location', lat, lng,
        text: `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}`,
        uid: window.currentUser.uid, name: user.name||'User',
        username: user.username||'', timestamp: Date.now(), read: false, reactions: {}
      });
      await updateChatMetadata(window.currentChat, '📍 Геолокация', Date.now());

  let _searchMatches = [];

  function openMsgSearch() {
    const chatScreen = document.getElementById('chatScreen');
    if (!chatScreen) return;
    if (document.getElementById('msgSearchBar')) { closeMsgSearch(); return; }
    const bar = document.createElement('div');
    bar.id = 'msgSearchBar';
    bar.className = 'msg-search-bar';
    bar.innerHTML = `
      <input id="msgSearchInput" placeholder="Поиск в чате…" autocomplete="off">
      <span class="msg-search-count" id="msgSearchCount"></span>
      <button class="nav-btn" id="msPrev" title="Назад">↑</button>

      <button class="nav-btn" id="msClose">✕</button>`;
    const header = chatScreen.querySelector('.header');
    if (header) header.after(bar); else chatScreen.prepend(bar);
    const inp = bar.querySelector('#msgSearchInput');
    inp?.focus();
    inp?.addEventListener('input', () => performMsgSearch(inp.value));
    bar.querySelector('#msPrev')?.addEventListener('click', () => navigateMsgSearch(-1));

  function closeMsgSearch() {
    document.getElementById('msgSearchBar')?.remove();
    document.querySelectorAll('#msgContainer .text-content').forEach(el => {
      const raw = el.dataset.raw;
      if (raw !== undefined) el.innerHTML = raw;
    });
    _searchMatches = []; _searchCursor = 0;
  }

  function performMsgSearch(q) {
    // restore originals first
    document.querySelectorAll('#msgContainer .text-content').forEach(el => {
      if (el.dataset.raw !== undefined) el.innerHTML = el.dataset.raw;
    });
    _searchMatches = [];
    const cnt = document.getElementById('msgSearchCount');
    if (!q.trim()) { if (cnt) cnt.textContent = ''; return; }
    const ql = q.toLowerCase();
    document.querySelectorAll('#msgContainer .text-content').forEach(el => {
      const raw = el.dataset.raw !== undefined ? el.dataset.raw : el.textContent;
      el.dataset.raw = raw;
      if (raw.toLowerCase().includes(ql)) {
        _searchMatches.push(el);
        const re = new RegExp(ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
        el.innerHTML = raw.replace(re, m => `<mark class="sh">${escapeHtml(m)}</mark>`);
      }
    });
    _searchCursor = _searchMatches.length > 0 ? 0 : -1;
    highlightMsgSearch();
    if (cnt) cnt.textContent = _searchMatches.length > 0 ? `${_searchCursor+1}/${_searchMatches.length}` : '0';
  }

  function navigateMsgSearch(dir) {
    if (!_searchMatches.length) return;
    _searchCursor = (_searchCursor + dir + _searchMatches.length) % _searchMatches.length;
    highlightMsgSearch();
    const cnt = document.getElementById('msgSearchCount');
    if (cnt) cnt.textContent = `${_searchCursor+1}/${_searchMatches.length}`;
  }

  function highlightMsgSearch() {
    document.querySelectorAll('#msgContainer mark.cur').forEach(m => m.classList.remove('cur'));
    const el = _searchMatches[_searchCursor];
    if (!el) return;
    const m = el.querySelector('mark.sh');
    if (m) { m.classList.add('cur'); m.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }

  // ── Swipe-to-reply ────────────────────────────────────────────
  function setupSwipeToReply() {
    document.querySelectorAll('#chatScreen .message-container').forEach(container => {
      const bubble = container.querySelector('.bubble');
      if (!bubble) return;
      const msgId = bubble.dataset.msgId;
      if (!msgId) return;
      const isOut = container.classList.contains('outgoing');

      const hint = document.createElement('div');
      hint.className = 'swipe-reply-icon';
      hint.textContent = '↩️';
      container.appendChild(hint);

      let sx = 0, sy = 0, active = false, fired = false;
      const THRESH = 52;

      container.addEventListener('touchstart', e => {
        if (e.touches.length !== 1) return;
        sx = e.touches[0].clientX; sy = e.touches[0].clientY;
        active = true; fired = false;
      }, { passive: true });

      container.addEventListener('touchmove', e => {
        if (!active || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - sx;
        const dy = e.touches[0].clientY - sy;
        if (Math.abs(dy) > 18 && Math.abs(dy) > Math.abs(dx)) { active = false; return; }
        const valid = isOut ? dx < -8 : dx > 8;
        if (!valid) return;
        const prog = Math.min(Math.abs(dx) / THRESH, 1);
        hint.style.opacity = prog;
        const shift = isOut ? Math.max(dx, -THRESH * .6) : Math.min(dx, THRESH * .6);
        bubble.style.transform = `translateX(${shift}px)`;
        if (Math.abs(dx) >= THRESH && !fired) { fired = true; if (navigator.vibrate) navigator.vibrate(40); }
      }, { passive: true });

      const onEnd = () => {
        if (!active) return; active = false;
        bubble.style.transition = 'transform .22s ease';
        bubble.style.transform  = '';
        hint.style.opacity = '0';
        setTimeout(() => { bubble.style.transition = ''; }, 250);
        if (fired) { fired = false; replyToMessageById(msgId); }
      };
      container.addEventListener('touchend', onEnd);
      container.addEventListener('touchcancel', onEnd);
    });
  }

  // ── Double-tap ❤️ ─────────────────────────────────────────────
  function setupDoubleTapHeart() {
    const taps = new Map();
    document.querySelectorAll('#chatScreen .bubble').forEach(bubble => {
      const msgId = bubble.dataset.msgId;
      if (!msgId) return;
      bubble.addEventListener('touchend', e => {
        const now  = Date.now();
        const last = taps.get(msgId) || 0;
        if (now - last < 360) {
          addReaction(msgId, '❤️');
          const rect  = bubble.getBoundingClientRect();
          const touch = e.changedTouches[0];
          const heart = document.createElement('span');
          heart.className = 'heart-float';
          heart.textContent = '❤️';
          heart.style.left = (touch.clientX - rect.left) + 'px';
          heart.style.top  = (touch.clientY - rect.top)  + 'px';
          bubble.style.position = 'relative';
          bubble.appendChild(heart);
          setTimeout(() => heart.remove(), 700);
          taps.delete(msgId);
        } else {
          taps.set(msgId, now);
        }
      });
    });

  // ── Clipboard paste (iOS images from gallery) ─────────────────
  document.addEventListener('paste', async (e) => {
    if (window.activeScreen !== 'chat' || !window.currentChat) return;
    const items = (e.clipboardData || window.clipboardData)?.items;
    if (!items) return;
    for (const item of items) {
      if (!item.type.startsWith('image/')) continue;
      e.preventDefault();
      const file = item.getAsFile();
      if (!file) continue;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        // Compress before send
        const img = new Image();
        img.src = ev.target.result;
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h2 = img.height;
          const maxPx = 1200;
          if (w > maxPx || h2 > maxPx) {
            const r = Math.min(maxPx/w, maxPx/h2);
            w *= r; h2 *= r;
          }
          canvas.width = w; canvas.height = h2;
          const ctx = canvas.getContext('2d');
          // Fill white for transparent PNGs
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, w, h2);
          ctx.drawImage(img, 0, 0, w, h2);
          const base64 = canvas.toDataURL('image/jpeg', 0.82);
          const snap = await get(ref(db, `users/${window.currentUser.uid}`));
          const user = snap.val() || {};
          const msgId = push(ref(db,'messages')).key;
          await set(ref(db, `messages/${window.currentChat}/${msgId}`), {
            id: msgId, imageBase64: base64, text: '',
            uid: window.currentUser.uid, name: user.name||'User',
            username: user.username||'', timestamp: Date.now(),
            read: false, reactions: {}
          });
          await updateChatMetadata(window.currentChat, '📷 Фото', Date.now());
          playMessageSound();
          toast('Фото вставлено из буфера 📋', 'success');
        };
      };
      reader.readAsDataURL(file);
      break;
    }
  });


  // ══════════════════════════════════════════════════════════════
  // FRAMES (TG-style stories)
  // ══════════════════════════════════════════════════════════════
  let _framesCache = {};      // uid → [ {id, mediaBase64, mediaType, caption, timestamp, durationHours, visibility} ]
  let _framesUnsubs = [];
  const FRAME_MAX = 10;
  const FRAME_TTL = 24 * 3600 * 1000; // default duration for frames published before this feature existed

  function frameTtlMs(f) {
    const h = Number(f?.durationHours) || 24;
    return h * 3600 * 1000;
  }
  function frameIsActive(f, now) {
    now = now || Date.now();
    return now - (f.timestamp || 0) < frameTtlMs(f);
  }
  // Author always sees their own frame; everyone else respects the
  // "hide from" list chosen when the frame was published/edited.
  function frameIsVisibleToMe(f) {
    const myUid = window.currentUser?.uid;
    if (!f.authorUid || f.authorUid === myUid) return true;
    const vis = f.visibility || { mode: 'all' };
    if (vis.mode === 'except' && Array.isArray(vis.uids) && vis.uids.includes(myUid)) return false;
    return true;
  }

  function renderFramesStrip(contactUids) {
    const strip = document.getElementById('framesStrip');
    if (!strip) return;
    const now = Date.now();
    const myUid = window.currentUser?.uid;
    const viewed = JSON.parse(localStorage.getItem('p1xx_viewedFrames') || '{}');

    // My frames
    const myFrames = (_framesCache[myUid] || []).filter(f => frameIsActive(f, now));
    const myHasNew = myFrames.length > 0;
    const myViewed = viewed[myUid] === (myFrames[myFrames.length-1]?.id);

    let html = `<div class="frame-circle" id="myFrameAddBtn" title="Мои Фреймы">
      <div class="frame-ring ${myHasNew ? (myViewed ? 'viewed' : '') : 'add-btn'}">
        <div class="frame-av" style="background:${avatarColor(window.userProfile?.name||'?')};">
          ${window.userProfile?.avatarBase64
            ? `<img src="${window.userProfile.avatarBase64}" alt="">`
            : escapeHtml((window.userProfile?.name||'Я')[0]?.toUpperCase()||'?')}
        </div>
      </div>
      <span class="frame-lbl">${myHasNew ? 'Мой' : '+'} Фрейм</span>
      ${myFrames.length > 0 ? `<span class="frame-count-badge">${myFrames.length}</span>` : ''}
    </div>`;

    let anyNewFromOthers = false;
    for (const uid of (contactUids || [])) {
      if (uid === myUid) continue;
      const frames = (_framesCache[uid] || []).filter(f => frameIsActive(f, now) && frameIsVisibleToMe(f));
      if (!frames.length) continue;
      const name = frames[0]?.authorName || uid.slice(0,6);
      const av = frames[0]?.authorAv || '';
      const lastId = frames[frames.length-1]?.id;
      const isViewed = viewed[uid] === lastId;
      if (!isViewed) anyNewFromOthers = true;
      html += `<div class="frame-circle" data-frame-uid="${escapeHtml(uid)}" title="${escapeHtml(name)}">
        <div class="frame-ring ${isViewed ? 'viewed' : ''}">
          <div class="frame-av" style="background:${avatarColor(name)};">
            ${av ? `<img src="${escapeHtml(av)}" alt="">` : escapeHtml(name[0]?.toUpperCase()||'?')}
          </div>
        </div>
        <span class="frame-lbl">${escapeHtml(name.split(' ')[0])}</span>
      </div>`;
    }

    strip.innerHTML = html;

    // My frame button – open viewer or add
    strip.querySelector('#myFrameAddBtn')?.addEventListener('click', () => {
      if (myFrames.length > 0) openFrameViewer(myUid, contactUids);
      else showAddFrameModal(contactUids);
    });

    // Contact frames
    strip.querySelectorAll('[data-frame-uid]').forEach(el => {
      el.addEventListener('click', () => openFrameViewer(el.dataset.frameUid, contactUids));
    });

    // Reflect "new frames available" on the header toggle circle
    const toggleBtn = document.getElementById('framesToggleBtn');
    if (toggleBtn) toggleBtn.classList.toggle('has-new', (myHasNew && !myViewed) || anyNewFromOthers);
  }

  function loadFrames(contactUids) {
    _framesUnsubs.forEach(u => { try { u(); } catch(e) {} });
    _framesUnsubs = [];
    const allUids = [window.currentUser?.uid, ...(contactUids||[])].filter(Boolean);
    allUids.forEach(uid => {
      const unsub = onValue(ref(db, `frames/${uid}`), (snap) => {
        const data = snap.val() || {};
        const now  = Date.now();
        _framesCache[uid] = Object.entries(data)
          .map(([id, f]) => ({ id, ...f }))
          .filter(f => frameIsActive(f, now))
          .sort((a,b) => (a.timestamp||0) - (b.timestamp||0));
        if (window.activeScreen === 'chats') renderFramesStrip(contactUids);
      });
      _framesUnsubs.push(unsub);
    });
  }

  function openFrameViewer(uid, contactUids) {
    const now = Date.now();
    const frames = (_framesCache[uid] || []).filter(f => frameIsActive(f, now) && frameIsVisibleToMe(f));
    if (!frames.length) return toast('Нет активных Фреймов');

    // Mark viewed
    const viewed = JSON.parse(localStorage.getItem('p1xx_viewedFrames') || '{}');
    viewed[uid] = frames[frames.length-1]?.id;
    localStorage.setItem('p1xx_viewedFrames', JSON.stringify(viewed));

    let cur = 0;
    let timer = null;
    const DURATION = 5000;

    const overlay = document.createElement('div');
    overlay.className = 'frame-viewer';
    document.body.appendChild(overlay);

    const authorName = frames[0]?.authorName || uid.slice(0,6);
    const authorAv   = frames[0]?.authorAv   || '';
    const isMyFrame  = uid === window.currentUser?.uid;

    const render = (idx) => {
      cur = Math.max(0, Math.min(idx, frames.length - 1));
      const f = frames[cur];
      const ago = f.timestamp ? Math.round((now - f.timestamp) / 60000) : 0;
      const agoStr = ago < 60 ? `${ago} мин назад` : `${Math.round(ago/60)}ч назад`;
      const visLabel = f.visibility?.mode === 'except' && f.visibility.uids?.length
        ? ` · скрыт от ${f.visibility.uids.length}` : '';

      overlay.innerHTML = `
        <div class="frame-prog-bar">
          ${frames.map((_, i) => `<div class="frame-prog-seg">
            <div class="frame-prog-fill" id="fpf${i}" style="width:${i<cur?'100%':i===cur?'0%':'0%'}"></div>
          </div>`).join('')}
        </div>
        <div class="frame-viewer-hdr">
          <div class="frame-viewer-av">
            ${authorAv ? `<img src="${escapeHtml(authorAv)}" alt="">` : escapeHtml(authorName[0]?.toUpperCase()||'?')}
          </div>
          <div class="frame-viewer-meta">
            <div class="frame-viewer-name">${escapeHtml(authorName)}</div>
            <div class="frame-viewer-time">${agoStr}${isMyFrame ? visLabel : ''}</div>
          </div>
          ${isMyFrame ? `<button id="fvEditBtn" class="frame-viewer-close" title="Редактировать" style="margin-right:4px;">✏️</button>` : ''}
          ${isMyFrame ? `<button id="fvDeleteBtn" class="frame-viewer-close" title="Удалить" style="margin-right:4px;">🗑</button>` : ''}
          <button class="frame-viewer-close" id="fvClose">✕</button>
        </div>
        <div class="frame-media-area">
          ${f.mediaType === 'video'
            ? `<video autoplay playsinline muted loop style="max-width:100%;max-height:100%;object-fit:contain;"><source src="${escapeHtml(f.mediaBase64||'')}"></video>`
            : `<img src="${escapeHtml(f.mediaBase64||'')}" alt="" draggable="false">`}
          <div class="frame-tap-zone frame-tap-prev" id="fvPrev"></div>
          <div class="frame-tap-zone frame-tap-next" id="fvNext"></div>
        </div>
        ${f.caption ? `<div class="frame-viewer-caption">${escapeHtml(f.caption)}</div>` : ''}`;

      // Progress animation
      if (timer) clearTimeout(timer);
      const fill = overlay.querySelector(`#fpf${cur}`);
      if (fill) {
        fill.style.transition = `width ${DURATION}ms linear`;
        requestAnimationFrame(() => { fill.style.width = '100%'; });
      }
      timer = setTimeout(() => {
        if (cur < frames.length - 1) render(cur + 1);
        else { overlay.remove(); renderFramesStrip(contactUids); }
      }, DURATION);

      overlay.querySelector('#fvClose')?.addEventListener('click', () => {
        if (timer) clearTimeout(timer); overlay.remove(); renderFramesStrip(contactUids);
      });
      overlay.querySelector('#fvPrev')?.addEventListener('click', () => { if(cur>0) render(cur-1); });
      overlay.querySelector('#fvNext')?.addEventListener('click', () => {
        if (cur < frames.length-1) render(cur+1);
        else { if(timer) clearTimeout(timer); overlay.remove(); renderFramesStrip(contactUids); }
      });
      overlay.querySelector('#fvDeleteBtn')?.addEventListener('click', async () => {
        if (timer) clearTimeout(timer);
        await remove(ref(db, `frames/${uid}/${f.id}`));
        overlay.remove();
        toast('Фрейм удалён');
        renderFramesStrip(contactUids);
      });
      overlay.querySelector('#fvEditBtn')?.addEventListener('click', () => {
        if (timer) clearTimeout(timer);
        showEditFrameModal(f, uid, contactUids, () => overlay.remove());
      });
    };

    render(0);
  }

  // Duration + visibility fields shared by the "new frame" and "edit frame" modals
  function frameSettingsFieldsHtml(idPrefix, current, contactUids) {
    const dur = current?.durationHours || 24;
    const visMode = current?.visibility?.mode || 'all';
    const hiddenUids = current?.visibility?.uids || [];
    const durOptions = [1, 3, 6, 12, 24, 48].map(h =>
      `<option value="${h}" ${dur===h?'selected':''}>${h} ч</option>`).join('');
    const myUid = window.currentUser?.uid;
    const contactsList = (contactUids || []).map(uid => {
      const cid = [myUid, uid].filter(Boolean).sort().join('_');
      const nm = chatNames[cid] || uid.slice(0,6);
      return `<label class="frame-vis-row">
        <input type="checkbox" data-vis-uid="${escapeHtml(uid)}" ${hiddenUids.includes(uid)?'checked':''}>
        <span>${escapeHtml(nm)}</span>
      </label>`;
    }).join('') || '<p style="font-size:.75rem;color:var(--text-secondary);">Нет контактов</p>';

    return `
      <label style="font-size:.75rem;color:var(--text-secondary);display:block;margin-top:10px;">Время показа</label>
      <select id="${idPrefix}Duration" style="width:100%;padding:10px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);">
        ${durOptions}
      </select>
      <label style="font-size:.75rem;color:var(--text-secondary);display:block;margin-top:10px;">Кто видит Фрейм</label>
      <select id="${idPrefix}VisMode" style="width:100%;padding:10px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);">
        <option value="all" ${visMode==='all'?'selected':''}>Все</option>
        <option value="except" ${visMode==='except'?'selected':''}>Все, кроме...</option>
      </select>
      <div id="${idPrefix}VisList" style="display:${visMode==='except'?'flex':'none'};flex-direction:column;gap:2px;max-height:140px;overflow-y:auto;margin-top:6px;">
        ${contactsList}
      </div>`;
  }
  function wireFrameSettingsFields(idPrefix) {
    const modeSel = document.getElementById(idPrefix+'VisMode');
    const list = document.getElementById(idPrefix+'VisList');
    modeSel?.addEventListener('change', () => {
      if (list) list.style.display = modeSel.value === 'except' ? 'flex' : 'none';
    });
  }
  function readFrameSettingsFields(idPrefix) {
    const durationHours = parseInt(document.getElementById(idPrefix+'Duration')?.value || '24', 10);
    const mode = document.getElementById(idPrefix+'VisMode')?.value || 'all';
    const uids = mode === 'except'
      ? Array.from(document.querySelectorAll(`#${idPrefix}VisList [data-vis-uid]:checked`)).map(cb => cb.dataset.visUid)
      : [];
    return { durationHours, visibility: { mode, uids } };
  }

  function showEditFrameModal(frame, uid, contactUids, onDone) {
    showModal(`
      <h3>✏️ Редактировать Фрейм</h3>
      <input id="frameEditCaption" placeholder="Подпись (необязательно)" maxlength="120" value="${escapeHtml(frame.caption||'')}"
        style="width:100%;padding:10px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);">
      ${frameSettingsFieldsHtml('frameEdit', frame, contactUids)}
      <button class="btn" id="frameEditSaveBtn">Сохранить</button>
      <button class="btn secondary" id="frameEditCancelBtn">Отмена</button>`);
    wireFrameSettingsFields('frameEdit');
    document.getElementById('frameEditCancelBtn').addEventListener('click', () => { closeModal(); onDone?.(); });
    document.getElementById('frameEditSaveBtn').addEventListener('click', async () => {
      const caption = document.getElementById('frameEditCaption')?.value.trim() || '';
      const settings = readFrameSettingsFields('frameEdit');
      try {
        await update(ref(db, `frames/${uid}/${frame.id}`), { caption, ...settings });
        toast('Фрейм обновлён', 'success');
      } catch (e) {
        toast('Не удалось сохранить', 'error');
      }
      closeModal();
      onDone?.();
      renderFramesStrip(contactUids);
    });
  }

  function showAddFrameModal(contactUids) {
    const myUid = window.currentUser?.uid;
    const myFrames = _framesCache[myUid] || [];
    if (myFrames.length >= FRAME_MAX) {
      toast(`Максимум ${FRAME_MAX} Фреймов. Удалите старые.`, 'warning');
      return;
    }
    let mediaData = null; let mediaType = 'image';
    showModal(`
      <h3>✨ Новый Фрейм</h3>
      <p style="font-size:.8rem;color:var(--text-secondary);">Фото или видео · макс ${FRAME_MAX - myFrames.length} ещё</p>
      <input type="file" id="frameMediaInput" accept="image/*,video/*" style="display:none;">
      <button class="btn secondary" id="framePickBtn">📷 Выбрать фото / видео</button>
      <div id="framePreview" style="margin-top:6px;"></div>
      <input id="frameCaption" placeholder="Подпись (необязательно)" maxlength="120"
        style="width:100%;padding:10px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);">
      ${frameSettingsFieldsHtml('frameNew', null, contactUids)}
      <button class="btn" id="framePublishBtn">Опубликовать</button>
      <button class="btn secondary" id="frameCancelBtn">Отмена</button>`);
    wireFrameSettingsFields('frameNew');
    document.getElementById('framePickBtn').addEventListener('click', () => document.getElementById('frameMediaInput').click());
    document.getElementById('frameMediaInput').addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      if (file.size > 30*1024*1024) return toast('Файл до 30MB', 'error');
      mediaType = file.type.startsWith('video') ? 'video' : 'image';
      const reader = new FileReader();
      reader.onload = (ev) => {
        mediaData = ev.target.result;
        const prev = document.getElementById('framePreview');
        if (prev) prev.innerHTML = mediaType === 'video'
          ? `<video src="${mediaData}" class="frame-add-preview" controls muted playsinline></video>`
          : `<img src="${mediaData}" class="frame-add-preview">`;
      };
      reader.readAsDataURL(file);
    });
    document.getElementById('framePublishBtn').addEventListener('click', async () => {
      if (!mediaData) return toast('Выберите фото или видео', 'error');
      const caption = document.getElementById('frameCaption')?.value.trim() || '';
      const settings = readFrameSettingsFields('frameNew');
      const snap = await get(ref(db, `users/${myUid}`));
      const user = snap.val() || {};
      const frameId = push(ref(db, `frames/${myUid}`)).key;
      let finalMedia = mediaData;
      // Compress images
      if (mediaType === 'image') {
        try {
          const img = new Image(); img.src = mediaData;
          await new Promise(r => img.onload = r);
          const canvas = document.createElement('canvas');
          let w = img.width, h2 = img.height;
          const mx = 1080;
          if (w>mx||h2>mx){const r2=Math.min(mx/w,mx/h2);w*=r2;h2*=r2;}
          canvas.width=w; canvas.height=h2;
          canvas.getContext('2d').drawImage(img,0,0,w,h2);
          finalMedia = canvas.toDataURL('image/jpeg', 0.82);
        } catch(e){}
      }
      await set(ref(db, `frames/${myUid}/${frameId}`), {
        mediaBase64: finalMedia, mediaType, caption,
        timestamp: Date.now(),
        authorName: user.name || 'Пользователь',
        authorAv: user.avatarBase64 || '',
        authorUid: myUid,
        ...settings
      });
      closeModal();
      toast('Фрейм опубликован ✨', 'success');
    });
    document.getElementById('frameCancelBtn').addEventListener('click', closeModal);
  }

  // ── Frames strip collapse/expand (collapsed by default) ────
  function applyFramesCollapsedState() {
    const strip = document.getElementById('framesStrip');
    const collapsed = localStorage.getItem('p1xx_framesCollapsed') !== '0';
    strip?.classList.toggle('collapsed', collapsed);
  }
  function toggleFramesStrip() {
    const strip = document.getElementById('framesStrip');
    if (!strip) return;
    const nowCollapsed = !strip.classList.contains('collapsed');
    strip.classList.toggle('collapsed', nowCollapsed);
    localStorage.setItem('p1xx_framesCollapsed', nowCollapsed ? '1' : '0');
  }


  console.log('🚀 P1XX v3.5 Adaptive – Администратор @Pups');

  // Register SW — 3-layer notification system
  if ('serviceWorker' in navigator) {
    const swCode = `
self.addEventListener('install', () => self.skipWaiting());
self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
self.addEventListener('push', (e) => {
  let data = {};
  try { data = e.data ? e.data.json() : {}; } catch(err) {}
  e.waitUntil(self.registration.showNotification(data.title || 'P1XX', {
    body: data.body || 'Новое сообщение',
    icon: data.icon || '/favicon.ico',
    badge: '/favicon.ico',
    tag: data.chatId || 'p1xx-msg',
    data: { chatId: data.chatId }
  }));
});
self.addEventListener('notificationclick', (e) => {
  e.notification.close();
  e.waitUntil(clients.matchAll({ type: 'window' }).then(cs => {
    const c = cs.find(x => x.focus);
    if (c) return c.focus();
    return clients.openWindow('/');
  }));
});
self.addEventListener('message', (e) => {
  if (!e.data) return;
  if (e.data.type === 'SKIP_WAITING') self.skipWaiting();
  if (e.data.type === 'SHOW_NOTIFICATION') {
    self.registration.showNotification(e.data.title || 'P1XX', {
      body: e.data.body || '', icon: '/favicon.ico', tag: 'p1xx-msg'
    });
  }
});`;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).then(r => { _swReg = r; }).catch(() => {});
  }
</script>
