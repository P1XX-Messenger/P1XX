  // ══════════════════════════════════════════════════════════════
  // Secret chats — E2EE core (Web Crypto API + IndexedDB)
  //
  // Design, in plain terms:
  //  - Each device generates its own ECDH (P-256) key pair, once. The private
  //    key is imported back as *non-extractable* before it's stored, so no
  //    script on the page (not even this one) can ever read out its raw bytes
  //    again — it can only be *used* by the browser's crypto engine to derive
  //    a shared secret. It lives in IndexedDB (CryptoKey objects are storable
  //    there directly; this is the standard way to persist Web Crypto keys).
  //  - The public key is not sensitive — it's published to Firebase so the
  //    other side can find it.
  //  - When two people open a secret chat, both derive the SAME AES-256-GCM
  //    key from (my private key + their public key) via ECDH. That shared key
  //    is never transmitted anywhere; Firebase only ever sees ciphertext.
  //  - This is a trust-on-first-use (TOFU) model, same starting point Signal/
  //    WhatsApp/Telegram all use — that's what the safety-number check below
  //    is for: comparing it over a second channel (in person, a call) confirms
  //    neither side's key was swapped in transit.
  //  - Not implemented (honestly, on purpose, to avoid half-built crypto):
  //    key rotation / forward secrecy, group secret chats, verified device
  //    lists. This covers 1:1 text + photo.
  // ══════════════════════════════════════════════════════════════

  const SECRET_DB_NAME = 'p1xx_secure';
  const SECRET_DB_STORE = 'keys';
  let _secretKeyPair = null; // { privateKey: CryptoKey (non-extractable), publicJwk: Object }

  function openSecretKeyDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
      const req = indexedDB.open(SECRET_DB_NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(SECRET_DB_STORE)) {
          req.result.createObjectStore(SECRET_DB_STORE);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function idbGet(database, key) {
    return new Promise((resolve, reject) => {
      const tx = database.transaction(SECRET_DB_STORE, 'readonly');
      const req = tx.objectStore(SECRET_DB_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function idbSet(database, key, value) {
    return new Promise((resolve, reject) => {
      const tx = database.transaction(SECRET_DB_STORE, 'readwrite');
      const req = tx.objectStore(SECRET_DB_STORE).put(value, key);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  // Generates (once per device) or loads the local ECDH key pair, and makes
  // sure the public half is published so others can start secret chats with us.
  async function ensureSecretKeys() {
    if (_secretKeyPair) return _secretKeyPair;
    if (!window.crypto?.subtle) { console.warn('Web Crypto unavailable (needs HTTPS/localhost)'); return null; }
    try {
      const idb = await openSecretKeyDB();
      let privateKey = await idbGet(idb, 'ecdhPrivate').catch(() => null);
      let publicJwk = await idbGet(idb, 'ecdhPublicJwk').catch(() => null);
      if (!privateKey || !publicJwk) {
        const pair = await crypto.subtle.generateKey(
          { name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey', 'deriveBits']
        );
        publicJwk = await crypto.subtle.exportKey('jwk', pair.publicKey);
        const privateJwk = await crypto.subtle.exportKey('jwk', pair.privateKey);
        // Re-import as non-extractable — the extractable copy above goes out of
        // scope right after this and is never persisted anywhere.
        privateKey = await crypto.subtle.importKey(
          'jwk', privateJwk, { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveKey', 'deriveBits']
        );
        await idbSet(idb, 'ecdhPrivate', privateKey);
        await idbSet(idb, 'ecdhPublicJwk', publicJwk);
      }
      _secretKeyPair = { privateKey, publicJwk };
      if (window.currentUser) {
        set(ref(db, `users/${window.currentUser.uid}/publicKey`), publicJwk).catch(() => {});
      }
      return _secretKeyPair;
    } catch (e) {
      console.error('Secret key setup failed:', e);
      return null;
    }
  }

  function secretBufToB64(buf) {
    let binary = '';
    const bytes = new Uint8Array(buf);
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }
  function secretB64ToBuf(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  async function deriveSecretChatKey(privateKey, theirPublicJwk) {
    const theirPublicKey = await crypto.subtle.importKey(
      'jwk', theirPublicJwk, { name: 'ECDH', namedCurve: 'P-256' }, false, []
    );
    return crypto.subtle.deriveKey(
      { name: 'ECDH', public: theirPublicKey },
      privateKey,
      { name: 'AES-GCM', length: 256 },
      false, ['encrypt', 'decrypt']
    );
  }

  // Encrypts/decrypts plain UTF-8 strings — used for both message text and
  // image data-URLs (a data-URL is just ASCII, so the same path handles both).
  async function secretEncrypt(aesKey, plaintext) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const encoded = new TextEncoder().encode(plaintext);
    const ctBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, encoded);
    return { iv: secretBufToB64(iv), ciphertext: secretBufToB64(ctBuf) };
  }
  async function secretDecrypt(aesKey, ivB64, ciphertextB64) {
    const iv = new Uint8Array(secretB64ToBuf(ivB64));
    const ctBuf = secretB64ToBuf(ciphertextB64);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aesKey, ctBuf);
    return new TextDecoder().decode(plainBuf);
  }

  // Order-independent fingerprint of both public keys — both sides compute the
  // exact same value, so it can be read aloud/compared to catch a swapped key.
  async function computeSafetyNumber(myPublicJwk, theirPublicJwk) {
    const a = (myPublicJwk.x || '') + (myPublicJwk.y || '');
    const b = (theirPublicJwk.x || '') + (theirPublicJwk.y || '');
    const combined = [a, b].sort().join('|');
    const hashBuf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(combined));
    const hex = Array.from(new Uint8Array(hashBuf)).map(x => x.toString(16).padStart(2, '0')).join('');
    return (hex.slice(0, 40).match(/.{1,4}/g) || []).join('  ');
  }

  function secretChatOtherUid(secretChatId) {
    if (!secretChatId || !window.currentUser) return null;
    const raw = secretChatId.replace(/^secret_/, '');
    return raw.split('_').find(uid => uid !== window.currentUser.uid) || null;
  }

  let _swReg = null;

  function showInAppBanner(title, body, chatId) {
    const old = document.querySelector('.inapp-notif');
    if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'inapp-notif';
    el.innerHTML = `<div class="inapp-notif-icon">💬</div>
      <div class="inapp-notif-text">
        <div class="inapp-notif-title">${escapeHtml(title)}</div>
        <div class="inapp-notif-body">${escapeHtml(body)}</div>
      </div>`;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
    const hide = () => { el.classList.remove('show'); setTimeout(() => { if (el.parentNode) el.remove(); }, 420); };
    el.addEventListener('click', () => { hide(); if (chatId) openChat(chatId); });
    setTimeout(hide, 4000);
  }

  function sendNotification(title, body, chatId) {
    // Layer 3 — always: in-app banner
    showInAppBanner(title, body, chatId);
    // Layer 1 — SW postMessage
    if (_swReg && _swReg.active) {
      try { _swReg.active.postMessage({ type: 'SHOW_NOTIFICATION', title, body }); return; } catch(e) {}
    }
    // Layer 2 — Notification API
    if (Notification.permission === 'granted' && document.hidden) {
      try { new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💎</text></svg>' }); } catch(e) {}
    }
  }

  function playMessageSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.15);
    } catch (e) {}
  }

  // ══════════════════════════════════════════════════════════════════════
  // Voice / video calls — WebRTC with Firebase Realtime Database as the
  // signaling channel (offer/answer/ICE candidates all travel as plain
  // writes under calls/{callId}). No TURN server is configured — only
  // Google's public STUN — so calls connect reliably on most home/mobile
  // networks but can fail to establish across strict symmetric NATs or
  // some corporate firewalls. Adding real TURN would need a paid relay
  // or a self-hosted coturn instance with credentials; flagging this as
  // a known limitation rather than a bug.
  // ══════════════════════════════════════════════════════════════════════

  function initCallListener(myUid) {
    if (activeCallForUnsubscribe) { try { activeCallForUnsubscribe(); } catch (e) {} activeCallForUnsubscribe = null; }
    activeCallForUnsubscribe = onValue(ref(db, `activeCallFor/${myUid}`), async (snap) => {
      const callId = snap.val();
      if (!callId || currentCallId) return;
      try {
        const callSnap = await get(ref(db, `calls/${callId}`));
        const data = callSnap.val();
        if (!data || data.status !== 'ringing' || data.calleeUid !== myUid) return;
        handleIncomingCall(callId, data);
      } catch (e) {}
    });
  }

  function stopCallListener() {
    if (activeCallForUnsubscribe) { try { activeCallForUnsubscribe(); } catch (e) {} activeCallForUnsubscribe = null; }
  }

  function showCallTypeSheet(otherUid, otherName) {
    if (currentCallId) return toast('Уже есть активный звонок', 'error');
    hideCallTypeSheet();
    const el = document.createElement('div');
    el.className = 'call-type-sheet';
    el.id = 'callTypeSheet';
    el.innerHTML = `
      <div class="call-type-sheet-inner">
        <div class="call-type-option" id="callTypeAudio">
          <div class="cto-icon">📞</div>
          <div><div class="cto-title">Аудиозвонок</div><div class="cto-sub">${escapeHtml(otherName || 'Пользователь')}</div></div>
        </div>
        <div class="call-type-option" id="callTypeVideo">
          <div class="cto-icon">📹</div>
          <div><div class="cto-title">Видеозвонок</div><div class="cto-sub">${escapeHtml(otherName || 'Пользователь')}</div></div>
        </div>
      </div>`;
    el.addEventListener('click', (e) => { if (e.target === el) hideCallTypeSheet(); });
    document.getElementById('callContainer').appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    document.getElementById('callTypeAudio').addEventListener('click', () => { hideCallTypeSheet(); startCall(otherUid, otherName, 'audio'); });
    document.getElementById('callTypeVideo').addEventListener('click', () => { hideCallTypeSheet(); startCall(otherUid, otherName, 'video'); });
  }
  function hideCallTypeSheet() {
    const el = document.getElementById('callTypeSheet');
    if (!el) return;
    el.classList.remove('show');
    setTimeout(() => el.remove(), 220);
  }

  function createCallPeerConnection(callId, role) {
    const pc = new RTCPeerConnection(ICE_SERVERS);
    const candidateField = role === 'caller' ? 'callerCandidates' : 'calleeCandidates';
    pc.onicecandidate = (e) => {
      if (e.candidate) {
        push(ref(db, `calls/${callId}/${candidateField}`), e.candidate.toJSON()).catch(() => {});
      }
    };
    pc.ontrack = (e) => {
      if (currentCallType === 'video') {
        const remoteVideo = document.getElementById('callRemoteVideo');
        if (remoteVideo) { remoteVideo.srcObject = e.streams[0]; remoteVideo.classList.add('live'); }
      } else {
        const remoteAudio = document.getElementById('callRemoteAudio');
        if (remoteAudio) remoteAudio.srcObject = e.streams[0];
      }
    };
    pc.onconnectionstatechange = () => {
      if (currentCallId !== callId) return;
      if (pc.connectionState === 'connected' && !callConnectStartedAt) {
        onCallConnected();
      } else if ((pc.connectionState === 'failed' || pc.connectionState === 'closed') && callConnectStartedAt) {
        toast('Соединение прервано', 'error');
        endCall();
      }
    };
    return pc;
  }

  function listenForCallCandidates(callId, field) {
    const unsub = onChildAdded(ref(db, `calls/${callId}/${field}`), (snap) => {
      const cand = snap.val();
      if (cand && peerConnection) {
        peerConnection.addIceCandidate(new RTCIceCandidate(cand)).catch(() => {});
      }
    });
    callCandidateUnsubs.push(unsub);
  }

  function attachLocalCallPreview() {
    if (currentCallType !== 'video' || !localCallStream) return;
    const localVideo = document.getElementById('callLocalVideo');
    if (localVideo) localVideo.srcObject = localCallStream;
  }

  async function startCall(otherUid, otherName, type) {
    if (currentCallId) return toast('Уже есть активный звонок', 'error');
    if (!navigator.mediaDevices?.getUserMedia) return toast('Звонки не поддерживаются этим браузером', 'error');
    if (!window.currentUser) return;

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' ? { facingMode: 'user' } : false });
    } catch (e) {
      return toast('Нет доступа к ' + (type === 'video' ? 'камере/микрофону' : 'микрофону'), 'error');
    }

    const myUid = window.currentUser.uid;
    const myName = window.userProfile?.name || 'Пользователь';
    const callId = push(ref(db, 'calls')).key;

    localCallStream = stream;
    currentCallId = callId;
    currentCallRole = 'caller';
    currentCallOtherUid = otherUid;
    currentCallOtherName = otherName;
    currentCallType = type;
    currentCallChatId = [myUid, otherUid].sort().join('_');

    renderCallOverlay('outgoing');
    peerConnection = createCallPeerConnection(callId, 'caller');
    localCallStream.getTracks().forEach(t => peerConnection.addTrack(t, localCallStream));
    attachLocalCallPreview();

    try {
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      await set(ref(db, `calls/${callId}`), {
        callerUid: myUid, calleeUid: otherUid,
        callerName: myName, calleeName: otherName || '',
        type, status: 'ringing',
        offer: { sdp: offer.sdp, type: offer.type },
        createdAt: serverTimestamp()
      });
      await set(ref(db, `activeCallFor/${otherUid}`), callId);
    } catch (e) {
      toast('Не удалось начать звонок', 'error');
      cleanupCall();
      return;
    }

    callDocUnsubscribe = onValue(ref(db, `calls/${callId}`), async (snap) => {
      if (currentCallId !== callId) return;
      const data = snap.val();
      if (!data) return;
      if (data.status === 'active' && data.answer && peerConnection && !peerConnection.currentRemoteDescription) {
        try { await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer)); } catch (e) {}
      } else if (data.status === 'declined') {
        toast(`${otherName || 'Собеседник'} отклонил(а) звонок`, 'error');
        finishCall('declined', 0);
      } else if (data.status === 'ended') {
        finishCall(callConnectStartedAt ? 'ended' : 'missed', callDuration());
      }
    });
    listenForCallCandidates(callId, 'calleeCandidates');

    callTimeoutHandle = setTimeout(() => {
      if (currentCallId === callId && !callConnectStartedAt) {
        toast('Нет ответа', 'error');
        finishCall('missed', 0);
      }
    }, CALL_TIMEOUT_MS);
  }

  function handleIncomingCall(callId, data) {
    currentCallId = callId;
    currentCallRole = 'callee';
    currentCallOtherUid = data.callerUid;
    currentCallOtherName = data.callerName;
    currentCallType = data.type || 'audio';
    currentCallChatId = [window.currentUser.uid, data.callerUid].sort().join('_');

    renderCallOverlay('incoming');
    startRingtone();
    if (navigator.vibrate) { try { navigator.vibrate([400, 200, 400, 200, 400]); } catch (e) {} }
    try { sendNotification('📞 ' + (data.callerName || 'Входящий звонок'), currentCallType === 'video' ? 'Видеозвонок' : 'Звонок'); } catch (e) {}

    callDocUnsubscribe = onValue(ref(db, `calls/${callId}`), (snap) => {
      if (currentCallId !== callId) return;
      const d = snap.val();
      if (d && d.status === 'ended' && !callConnectStartedAt) {
        toast('Звонок отменён', 'error');
        finishCall('missed', 0);
      }
    });

    callTimeoutHandle = setTimeout(() => {
      if (currentCallId === callId && !callConnectStartedAt) finishCall('missed', 0);
    }, CALL_TIMEOUT_MS);
  }

  async function acceptCall() {
    stopRingtone();
    clearTimeout(callTimeoutHandle);
    const callId = currentCallId;
    if (!callId) return;
    if (callDocUnsubscribe) { try { callDocUnsubscribe(); } catch (e) {} callDocUnsubscribe = null; }

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: currentCallType === 'video' ? { facingMode: 'user' } : false });
    } catch (e) {
      toast('Нет доступа к ' + (currentCallType === 'video' ? 'камере/микрофону' : 'микрофону'), 'error');
      return declineCall();
    }
    localCallStream = stream;

    const callSnap = await get(ref(db, `calls/${callId}`));
    const data = callSnap.val();
    if (!data) return cleanupCall();

    renderCallOverlay('active');
    peerConnection = createCallPeerConnection(callId, 'callee');
    localCallStream.getTracks().forEach(t => peerConnection.addTrack(t, localCallStream));
    attachLocalCallPreview();

    try {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      await update(ref(db, `calls/${callId}`), {
        answer: { sdp: answer.sdp, type: answer.type },
        status: 'active', connectedAt: serverTimestamp()
      });
      await set(ref(db, `activeCallFor/${window.currentUser.uid}`), null);
      listenForCallCandidates(callId, 'callerCandidates');
    } catch (e) {
      toast('Не удалось принять звонок', 'error');
      finishCall('missed', 0);
      return;
    }

    callDocUnsubscribe = onValue(ref(db, `calls/${callId}`), (snap) => {
      if (currentCallId !== callId) return;
      const d = snap.val();
      if (d && d.status === 'ended') finishCall(callConnectStartedAt ? 'ended' : 'missed', callDuration());
    });
  }

  async function declineCall() {
    stopRingtone();
    clearTimeout(callTimeoutHandle);
    const callId = currentCallId;
    try {
      if (callId) await update(ref(db, `calls/${callId}`), { status: 'declined', endedAt: serverTimestamp() });
      if (window.currentUser) await set(ref(db, `activeCallFor/${window.currentUser.uid}`), null);
    } catch (e) {}
    finishCall('declined', 0);
  }

  async function cancelOutgoingCall() {
    clearTimeout(callTimeoutHandle);
    const callId = currentCallId;
    const otherUid = currentCallOtherUid;
    try {
      if (callId) await update(ref(db, `calls/${callId}`), { status: 'ended', endedAt: serverTimestamp() });
      if (otherUid) await set(ref(db, `activeCallFor/${otherUid}`), null);
    } catch (e) {}
    finishCall('missed', 0);
  }

  async function endCall() {
    const callId = currentCallId;
    const duration = callDuration();
    const wasConnected = !!callConnectStartedAt;
    try {
      if (callId) await update(ref(db, `calls/${callId}`), { status: 'ended', endedAt: serverTimestamp() });
      if (currentCallOtherUid) await set(ref(db, `activeCallFor/${currentCallOtherUid}`), null);
    } catch (e) {}
    finishCall(wasConnected ? 'ended' : 'missed', duration);
  }

  function onCallConnected() {
    if (callConnectStartedAt) return;
    callConnectStartedAt = Date.now();
    clearTimeout(callTimeoutHandle);
    updateCallActionsUI('active');
    const overlay = document.getElementById('callOverlayEl');
    if (overlay) overlay.classList.add('connected');
    startCallTimer();
  }

  function finishCall(status, duration) {
    if (currentCallRole === 'caller' && currentCallChatId) {
      logCallToChat(currentCallChatId, status, duration);
    }
    cleanupCall();
  }

  function cleanupCall() {
    clearTimeout(callTimeoutHandle);
    stopRingtone();
    stopCallTimer();
    if (callDocUnsubscribe) { try { callDocUnsubscribe(); } catch (e) {} callDocUnsubscribe = null; }
    callCandidateUnsubs.forEach(u => { try { u(); } catch (e) {} });
    callCandidateUnsubs = [];
    if (peerConnection) { try { peerConnection.close(); } catch (e) {} peerConnection = null; }
    if (localCallStream) { try { localCallStream.getTracks().forEach(t => t.stop()); } catch (e) {} localCallStream = null; }
    const overlay = document.getElementById('callOverlayEl');
    const container = document.getElementById('callContainer');
    if (overlay) {
      overlay.classList.add('closing');
      setTimeout(() => { if (container) container.innerHTML = ''; }, 260);
    } else if (container) {
      container.innerHTML = '';
    }
    currentCallId = null;
    currentCallRole = null;
    currentCallOtherUid = null;
    currentCallOtherName = null;
    currentCallChatId = null;
    currentCallType = 'audio';
    callConnectStartedAt = null;
    callMuted = false;
    callVideoOff = false;
    callSpeakerOn = false;
  }

  function callDuration() {
    return callConnectStartedAt ? Math.floor((Date.now() - callConnectStartedAt) / 1000) : 0;
  }
  function formatCallDuration(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  async function logCallToChat(chatId, status, duration) {
    try {
      const myUid = window.currentUser.uid;
      let text;
      if (status === 'missed') text = '📞 Нет ответа';
      else if (status === 'declined') text = '📞 Звонок отклонён';
      else text = `📞 ${currentCallType === 'video' ? 'Видеозвонок' : 'Звонок'} · ${formatCallDuration(duration)}`;
      const snap = await get(ref(db, `users/${myUid}`));
      const user = snap.val() || {};
      const msgId = push(ref(db, 'messages')).key;
      const msg = {
        id: msgId, text, encrypted: null, uid: myUid,
        name: user.name || 'User', username: user.username || '',
        timestamp: Date.now(), read: false, reactions: {}
      };
      await set(ref(db, `messages/${chatId}/${msgId}`), msg);
      await updateChatMetadata(chatId, text, msg.timestamp);
    } catch (e) {}
  }

  function startRingtone() {
    stopRingtone();
    try {
      callRingtoneCtx = new (window.AudioContext || window.webkitAudioContext)();
      const playPulse = () => {
        if (!callRingtoneCtx) return;
        const t = callRingtoneCtx.currentTime;
        [0, 0.4].forEach(offset => {
          const osc = callRingtoneCtx.createOscillator();
          const gain = callRingtoneCtx.createGain();
          osc.connect(gain); gain.connect(callRingtoneCtx.destination);
          osc.type = 'sine'; osc.frequency.value = 740;
          gain.gain.setValueAtTime(0.0001, t + offset);
          gain.gain.exponentialRampToValueAtTime(0.22, t + offset + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + offset + 0.35);
          osc.start(t + offset); osc.stop(t + offset + 0.36);
        });
      };
      playPulse();
      callRingtoneInterval = setInterval(playPulse, 1600);
    } catch (e) {}
  }
  function stopRingtone() {
    if (callRingtoneInterval) { clearInterval(callRingtoneInterval); callRingtoneInterval = null; }
    if (callRingtoneCtx) { try { callRingtoneCtx.close(); } catch (e) {} callRingtoneCtx = null; }
  }

  function startCallTimer() {
    stopCallTimer();
    const statusEl = document.getElementById('callStatusText');
    const timerEl = document.getElementById('callTimerText');
    if (statusEl) statusEl.style.display = 'none';
    if (timerEl) { timerEl.style.display = 'block'; timerEl.textContent = '0:00'; }
    callTimerInterval = setInterval(() => {
      const el = document.getElementById('callTimerText');
      if (el) el.textContent = formatCallDuration(callDuration());
    }, 1000);
  }
  function stopCallTimer() {
    if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
  }

  function toggleCallMute() {
    if (!localCallStream) return;
    callMuted = !callMuted;
    localCallStream.getAudioTracks().forEach(t => t.enabled = !callMuted);
    const btn = document.getElementById('callMuteBtn');
    if (btn) { btn.classList.toggle('active', callMuted); btn.textContent = callMuted ? '🔇' : '🎤'; }
  }
  function toggleCallVideo() {
    if (!localCallStream) return;
    callVideoOff = !callVideoOff;
    localCallStream.getVideoTracks().forEach(t => t.enabled = !callVideoOff);
    const btn = document.getElementById('callVideoBtn');
    if (btn) btn.classList.toggle('active', callVideoOff);
    const localVideo = document.getElementById('callLocalVideo');
    if (localVideo) localVideo.style.opacity = callVideoOff ? '0' : '1';
  }
  function toggleCallSpeaker() {
    callSpeakerOn = !callSpeakerOn;
    const btn = document.getElementById('callSpeakerBtn');
    if (btn) btn.classList.toggle('active', callSpeakerOn);
    const audioEl = document.getElementById('callRemoteAudio');
    if (audioEl && audioEl.setSinkId) {
      audioEl.setSinkId(callSpeakerOn ? 'default' : 'communications').catch(() => {});
    }
  }

  function buildCallActionsHtml(state, isVideo) {
    if (state === 'incoming') {
      return `
        <div class="call-btn-row">
          <div class="call-action-wrap"><button class="call-action-btn decline" id="callDeclineBtn">✕</button><span class="cab-label">Отклонить</span></div>
          <div class="call-action-wrap"><button class="call-action-btn accept" id="callAcceptBtn">✓</button><span class="cab-label">Принять</span></div>
        </div>`;
    } else if (state === 'outgoing') {
      return `
        <div class="call-btn-row">
          <div class="call-action-wrap"><button class="call-action-btn end" id="callEndBtn">✕</button><span class="cab-label">Отмена</span></div>
        </div>`;
    }
    return `
      <div class="call-btn-row">
        <div class="call-action-wrap"><button class="call-action-btn" id="callMuteBtn">🎤</button><span class="cab-label">Микрофон</span></div>
        ${isVideo
          ? `<div class="call-action-wrap"><button class="call-action-btn" id="callVideoBtn">📹</button><span class="cab-label">Камера</span></div>`
          : `<div class="call-action-wrap"><button class="call-action-btn" id="callSpeakerBtn">🔊</button><span class="cab-label">Динамик</span></div>`}
        <div class="call-action-wrap"><button class="call-action-btn end" id="callEndBtn">✕</button><span class="cab-label">Завершить</span></div>
      </div>`;
  }

  function wireCallActionButtons() {
    document.getElementById('callDeclineBtn')?.addEventListener('click', declineCall);
    document.getElementById('callAcceptBtn')?.addEventListener('click', acceptCall);
    document.getElementById('callEndBtn')?.addEventListener('click', () => {
      if (currentCallRole === 'caller' && !callConnectStartedAt) cancelOutgoingCall();
      else if (currentCallRole === 'callee' && !callConnectStartedAt) declineCall();
      else endCall();
    });
    document.getElementById('callMuteBtn')?.addEventListener('click', toggleCallMute);
    document.getElementById('callVideoBtn')?.addEventListener('click', toggleCallVideo);
    document.getElementById('callSpeakerBtn')?.addEventListener('click', toggleCallSpeaker);
  }

  // Swaps just the button row (e.g. outgoing "Cancel" → live "Mute/Speaker/End")
  // in place, without touching the video/audio elements underneath — replacing
  // the whole overlay mid-call would tear down an already-flowing <video> stream.
  function updateCallActionsUI(state) {
    const actionsEl = document.querySelector('#callOverlayEl .call-actions');
    if (!actionsEl) return;
    actionsEl.innerHTML = buildCallActionsHtml(state, currentCallType === 'video');
    wireCallActionButtons();
  }

  function renderCallOverlay(state) {
    const container = document.getElementById('callContainer');
    if (!container) return;
    const isVideo = currentCallType === 'video';
    const initial = (currentCallOtherName || '?')[0]?.toUpperCase() || '?';
    const statusText = state === 'incoming' ? (isVideo ? 'Входящий видеозвонок' : 'Входящий звонок')
      : state === 'outgoing' ? 'Вызов…' : 'Соединено';

    container.innerHTML = `
      <div class="call-overlay ${isVideo ? 'video-mode' : ''}" id="callOverlayEl">
        ${isVideo
          ? `<video class="call-video-remote" id="callRemoteVideo" autoplay playsinline></video>
             <video class="call-video-local" id="callLocalVideo" autoplay playsinline muted></video>`
          : `<audio id="callRemoteAudio" autoplay></audio>`}
        <div class="call-top">
          <div class="call-status" id="callStatusText">${escapeHtml(statusText)}</div>
          <div class="call-name">${escapeHtml(currentCallOtherName || 'Пользователь')}</div>
          <div class="call-timer" id="callTimerText" style="display:none;">0:00</div>
        </div>
        <div class="call-avatar-wrap">
          <div class="call-ring r1"></div><div class="call-ring r2"></div><div class="call-ring r3"></div>
          <div class="call-avatar-large" id="callAvatarLarge">${escapeHtml(initial)}</div>
        </div>
        <div class="call-actions">${buildCallActionsHtml(state, isVideo)}</div>
      </div>`;

    if (currentCallOtherUid) {
      get(ref(db, `users/${currentCallOtherUid}`)).then(snap => {
        const u = snap.val();
        const av = document.getElementById('callAvatarLarge');

  function switchScreen(id) {
    if (!id) return;
    hideContextMenu();

    const prevId = window.activeScreen;
    const currentActive = document.querySelector('.screen.active');
    const targetScreen = document.getElementById(id + 'Screen');
    if (!targetScreen || currentActive === targetScreen) return;

    // Clean up screen-specific listeners when leaving
    if (prevId === 'chats' && chatsUnsubscribe) { try { chatsUnsubscribe(); } catch(e) {} chatsUnsubscribe = null; }
    if (prevId === 'groups' && groupsUnsubscribe) { try { groupsUnsubscribe(); } catch(e) {} groupsUnsubscribe = null; }
    if (prevId === 'notes' && notesUnsubscribe) { try { notesUnsubscribe(); } catch(e) {} notesUnsubscribe = null; }
    if (prevId === 'channels' && channelsUnsubscribe) { try { channelsUnsubscribe(); } catch(e) {} channelsUnsubscribe = null; }
    if (prevId === 'channelView') {
      if (channelViewUnsubscribe) { try { channelViewUnsubscribe(); } catch(e) {} channelViewUnsubscribe = null; }
      if (channelPostsUnsubscribe) { try { channelPostsUnsubscribe(); } catch(e) {} channelPostsUnsubscribe = null; }
      window.currentChannelId = null;
    }
    if (prevId === 'chat') {
      if (chatTypingUnsubscribe) { try { chatTypingUnsubscribe(); } catch(e) {} chatTypingUnsubscribe = null; }
      if (chatOnlineUnsubscribe) { try { chatOnlineUnsubscribe(); } catch(e) {} chatOnlineUnsubscribe = null; }
      if (chatPinnedUnsubscribe) { try { chatPinnedUnsubscribe(); } catch(e) {} chatPinnedUnsubscribe = null; }
      if (secretMsgUnsubscribe) { try { secretMsgUnsubscribe(); } catch(e) {} secretMsgUnsubscribe = null; }
      if (secretTypingUnsubscribe) { try { secretTypingUnsubscribe(); } catch(e) {} secretTypingUnsubscribe = null; }
      if (secretOnlineUnsubscribe) { try { secretOnlineUnsubscribe(); } catch(e) {} secretOnlineUnsubscribe = null; }
      secretChatKey = null;
      window.currentSecretChat = null;
      window.currentSecretOtherUid = null;
    }

    // Activate target immediately (no delay) — prevents any blank-screen moment
    targetScreen.classList.remove('leaving');
    targetScreen.classList.add('active');

    // Fade out the previous screen simultaneously (crossfade)
    if (currentActive && currentActive !== targetScreen) {
      currentActive.classList.remove('active');
      currentActive.classList.add('leaving');
      // Clean up leaving class after transition ends
      const onEnd = () => {
        currentActive.classList.remove('leaving');
        currentActive.removeEventListener('transitionend', onEnd);
      };
      currentActive.addEventListener('transitionend', onEnd);
    }

    const searchDropdown = document.getElementById('searchDropdown');
    if (searchDropdown) searchDropdown.remove();

    window.activeScreen = id;

    const pill = document.getElementById('bottomNavPill');
    const shouldShowPill = !['auth', 'chat', 'channelView'].includes(id);
    pill.style.display = shouldShowPill ? 'flex' : 'none';
    if (shouldShowPill) { applyNavCustomization(); applyNavSize(); }

    document.querySelectorAll('#bottomNavPill .nav-item').forEach(item => {
      item.classList.toggle('active', item.dataset.screen === id);
    });

    document.querySelectorAll('.input-area').forEach(area => {
      area.classList.toggle('no-nav', id === 'chat');
    });

    if (id === 'notes') renderNotes();
    if (id === 'settings') loadProfileAndRenderSettings();
    if (id === 'chats') renderChats();
    if (id === 'groups') renderGroups();
    if (id === 'channels') renderChannels();
  }

  // ─── Dynamic "Эффектные" wallpaper — chat heat effect ──────────────────────
  let heatInterval = null;

  function startHeatWallpaper(chatId) {
    stopHeatWallpaper();
    const container = document.querySelector('#chatScreen .messages-container');
    if (!container) return;

    const updateHeat = async () => {
      if (!chatId || !db) return;
      try {
        const snap = await get(ref(db, `messages/${chatId}`));
        const msgs = snap.val() || {};
        const now = Date.now();
        const oneMinAgo = now - 60 * 1000;
        const oneMonthAgo = now - 30 * 24 * 3600 * 1000;
        const allMsgs = Object.values(msgs);
        const lastMsgTime = allMsgs.length > 0 ? Math.max(...allMsgs.map(m => m.timestamp || 0)) : 0;
        const recentCount = allMsgs.filter(m => (m.timestamp || 0) > oneMinAgo).length;

        let heat = 0; // 0=ice, 0.5=warm, 1=hot
        if (lastMsgTime === 0 || lastMsgTime < oneMonthAgo) {
          heat = 0; // ice — no messages or month+ silent
        } else {
          const daysSinceLastMsg = (now - lastMsgTime) / (24 * 3600 * 1000);
          if (daysSinceLastMsg > 7) heat = 0.1;
          else if (daysSinceLastMsg > 1) heat = 0.3;
          else heat = 0.5;
          // Boost by recent messages
          if (recentCount >= 10) heat = 1;
          else if (recentCount >= 5) heat = Math.min(1, heat + 0.4);
          else if (recentCount >= 2) heat = Math.min(1, heat + 0.2);
        }

        applyHeatVisual(container, heat, lastMsgTime, recentCount);
      } catch(e) {}
    };

    updateHeat();
    heatInterval = setInterval(updateHeat, 15000);
  }

  function stopHeatWallpaper() {
    if (heatInterval) { clearInterval(heatInterval); heatInterval = null; }
    const container = document.querySelector('#chatScreen .messages-container');
    if (container) {
      container.style.background = '';
      container.style.transition = '';
      const overlay = container.querySelector('.heat-overlay');
      if (overlay) overlay.remove();
    }
  }

  function applyHeatVisual(container, heat, lastMsgTime, recentCount) {
    // Heat: 0 = icy blue, 0.5 = neutral, 1 = hot orange/red
    const isDark = document.body.classList.contains('dark');
    let bg, particle = '';

    if (heat <= 0.05) {
      // ICE — покрыт льдом
      bg = isDark
        ? 'linear-gradient(160deg, #0a1628 0%, #0d2040 40%, #0a2535 100%)'
        : 'linear-gradient(160deg, #c8e6f5 0%, #e0f0ff 40%, #d0eaf8 100%)';
      particle = '❄️';
    } else if (heat < 0.35) {
      // Cold
      bg = isDark
        ? 'linear-gradient(160deg, #0d1a2e 0%, #122035 100%)'
        : 'linear-gradient(160deg, #daeef8 0%, #eef6fc 100%)';
      particle = '';
    } else if (heat < 0.65) {
      // Neutral/warm
      bg = isDark
        ? 'linear-gradient(160deg, #1a1a2e 0%, #16213e 100%)'
        : 'linear-gradient(160deg, #f5f5f5 0%, #f0f2f5 100%)';
      particle = '';
    } else if (heat < 0.85) {
      // Warm
      bg = isDark
        ? 'linear-gradient(160deg, #2d1200 0%, #3d1a00 100%)'
        : 'linear-gradient(160deg, #fff0e0 0%, #ffe4c0 100%)';
      particle = '🔥';
    } else {
      // HOT — on fire
      bg = isDark
        ? 'linear-gradient(160deg, #3d0d00 0%, #5c1500 40%, #3d0d00 100%)'
        : 'linear-gradient(160deg, #ffe0c0 0%, #ffcc99 40%, #ffb380 100%)';
      particle = '🔥';
    }

    container.style.transition = 'background 2s ease';
    container.style.background = bg;

    // Floating particle indicator
    let overlay = container.querySelector('.heat-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'heat-overlay';
      overlay.style.cssText = 'position:absolute;top:8px;right:8px;font-size:1.2rem;pointer-events:none;opacity:0.6;z-index:1;transition:opacity 1s;';
      container.style.position = 'relative';
      container.appendChild(overlay);
    }
    overlay.textContent = particle;
    overlay.style.opacity = particle ? '0.7' : '0';
  }

  function openWallpaperCrop(base64, onClose) {
    const overlay = document.createElement('div');
    overlay.className = 'crop-overlay';
    // Use CSS viewport (logical pixels) for aspect ratio
    const deviceW = window.innerWidth;
    const deviceH = window.innerHeight;
    const aspect = deviceW / deviceH;

    const maxCW = Math.min(deviceW - 40, 360);
    const maxCH = Math.min(deviceH - 220, 480);

    const img = new Image();
    img.onload = () => {
      const scale = Math.min(maxCW / img.width, maxCH / img.height);
      const cw = Math.floor(img.width * scale);
      const ch = Math.floor(img.height * scale);

      let cropH = Math.min(ch, Math.floor(cw / aspect));
      let cropW = Math.floor(cropH * aspect);
      if (cropW > cw) { cropW = cw; cropH = Math.floor(cropW / aspect); }
      let cropX = Math.floor((cw - cropW) / 2);
      let cropY = Math.floor((ch - cropH) / 2);

      overlay.innerHTML = `
        <h3>✂️ Обрезать под экран</h3>
        <p style="color:rgba(255,255,255,0.6);font-size:0.75rem;margin:-8px 0 0;text-align:center;">Перетащи рамку на нужное место</p>
        <div class="crop-canvas-wrap" id="cropWrap" style="width:${cw}px;height:${ch}px;">
          <canvas id="cropCanvas" width="${cw}" height="${ch}" style="display:block;border-radius:8px;"></canvas>
          <div class="crop-selection" id="cropSel"></div>
        </div>
        <div class="crop-buttons">
          <button class="crop-btn confirm" id="cropConfirm">✓ Применить</button>
          <button class="crop-btn cancel" id="cropCancel">✕ Отмена</button>
        </div>`;
      document.body.appendChild(overlay);

      const canvas = document.getElementById('cropCanvas');
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, cw, ch);

      const sel = document.getElementById('cropSel');

      const updateSel = () => {
        sel.style.left = cropX + 'px';
        sel.style.top = cropY + 'px';
        sel.style.width = cropW + 'px';
        sel.style.height = cropH + 'px';
      };
      updateSel();

      let dragging = false, startX, startY, startCX, startCY;
      const getPoint = (e) => e.touches ? e.touches[0] : e;

      sel.addEventListener('mousedown', (e) => { dragging = true; const p = getPoint(e); startX = p.clientX; startY = p.clientY; startCX = cropX; startCY = cropY; e.preventDefault(); });
      sel.addEventListener('touchstart', (e) => { dragging = true; const p = getPoint(e); startX = p.clientX; startY = p.clientY; startCX = cropX; startCY = cropY; }, { passive: true });

      const onMove = (e) => {
        if (!dragging) return;
        const p = getPoint(e);
        cropX = Math.max(0, Math.min(cw - cropW, startCX + (p.clientX - startX)));
        cropY = Math.max(0, Math.min(ch - cropH, startCY + (p.clientY - startY)));
        updateSel();
      };
      const onUp = () => { dragging = false; };

      document.addEventListener('mousemove', onMove);
      document.addEventListener('touchmove', onMove, { passive: true });
      document.addEventListener('mouseup', onUp);
      document.addEventListener('touchend', onUp);

      const cleanup = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('mouseup', onUp);
        document.removeEventListener('touchend', onUp);
      };

      document.getElementById('cropConfirm').addEventListener('click', () => {
        const scaleBack = img.width / cw;
        const srcX = cropX * scaleBack, srcY = cropY * scaleBack;
        const srcW = cropW * scaleBack, srcH = cropH * scaleBack;
        const outC = document.createElement('canvas');
        outC.width = deviceW * (window.devicePixelRatio || 1);
        outC.height = deviceH * (window.devicePixelRatio || 1);
        outC.getContext('2d').drawImage(img, srcX, srcY, srcW, srcH, 0, 0, outC.width, outC.height);
        const result = outC.toDataURL('image/jpeg', 0.85);
        applyWallpaper(result);
        toast('Обои применены ✅');
        document.body.removeChild(overlay);
        cleanup();
        onClose && onClose();
      });

      document.getElementById('cropCancel').addEventListener('click', () => {
        document.body.removeChild(overlay);
        cleanup();
      });
    };
    img.src = base64;
  }

  function deriveContactUidsFromChatData(data) {
    const contactUids = [];
    for (const id of Object.keys(data || {})) {
      if (id.includes('_')) {
        const other = id.split('_').find(u => u !== window.currentUser?.uid);
        if (other && !contactUids.includes(other)) contactUids.push(other);
      }
    }
    return contactUids;
  }

  // Instant paint from the last cached snapshot so returning users see their
  // chats immediately, even while Firebase is still connecting (e.g. a slow
  // VPN). Skipped if a live render has already happened. The real onValue
  // callback in renderChats() fully replaces this the moment data arrives.
  function paintChatsFromCache() {
    if (document.getElementById('chatsList')) return;
    let data;
    try { data = JSON.parse(localStorage.getItem('p1xx_chatsCache') || 'null'); } catch (e) { data = null; }
    if (!data) return;
    const entries = Object.entries(data);
    if (!entries.length) return;
    const pinned = JSON.parse(localStorage.getItem('p1xx_pinnedChats') || '[]');
    const muted = JSON.parse(localStorage.getItem('p1xx_mutedChats') || '[]');
    entries.sort((a, b) => {
      const ap = pinned.includes(a[0]), bp = pinned.includes(b[0]);
      if (ap && !bp) return -1;
      if (!ap && bp) return 1;
      return (b[1]?.lastMessageTime || 0) - (a[1]?.lastMessageTime || 0);
    });
    const cards = entries.map(([id]) => {
      const name = chatNames[id] || data[id]?.name || 'Чат';
      const isPinned = pinned.includes(id);
      const isMuted = muted.includes(id);
      const isSecret = !!data[id]?.isSecret;
      const lastMsg = data[id]?.lastMessage || '';
      const unread = data[id]?.unreadCount || 0;
      const time = data[id]?.lastMessageTime ? formatTime(data[id].lastMessageTime) : '';
      const avatarChar = escapeHtml(name[0]?.toUpperCase() || '?');
      return `
        <div class="chat-item ${isPinned ? 'pinned' : ''} ${isSecret ? 'is-secret' : ''}" data-id="${escapeHtml(id)}" ${isSecret ? 'data-secret="1"' : ''}>
          ${unread > 0 ? `<div class="unread-badge" style="${isMuted ? 'background:var(--text-secondary);' : ''}">${unread > 99 ? '99+' : unread}</div>` : ''}
          <div class="avatar" style="background:${avatarColor(name)};">${avatarChar}</div>
          <div class="chat-info">
            <div class="chat-name">${isSecret ? '<span class="secret-lock-badge">🔒</span> ' : ''}${escapeHtml(name)}${isMuted ? ' 🔕' : ''}</div>
            <div class="chat-last">${time ? escapeHtml(time) : (lastMsg ? escapeHtml(lastMsg.slice(0,22)) : 'Нет сообщений')}</div>
          </div>
        </div>`;
    }).join('');

    document.getElementById('chatsScreen').innerHTML = buildChatsHeaderHtml() + `
      <div class="list">
        <div class="chat-grid" id="chatsList">${cards}</div>
      </div>`;

    applyFramesCollapsedState();
    document.getElementById('framesToggleBtn')?.addEventListener('click', toggleFramesStrip);
    document.getElementById('quickAddFrameBtn')?.addEventListener('click', () => showAddFrameModal(deriveContactUidsFromChatData(data)));
    document.querySelectorAll('#chatsList .chat-item').forEach(el => {
      el.addEventListener('click', () => {
        if (el.dataset.secret) openSecretChat(el.dataset.id, secretChatOtherUid(el.dataset.id));
        else openChat(el.dataset.id);
      });
    });
  }

  async function renderChats() {
    if (!window.currentUser || !db) return;
    if (chatsUnsubscribe) { try { chatsUnsubscribe(); } catch(e) {} chatsUnsubscribe = null; }

    paintChatsFromCache();

    const userChatsRef = ref(db, `user_chats/${window.currentUser.uid}`);
    chatsUnsubscribe = onValue(userChatsRef, async (snap) => {
      const data = snap.val() || {};
      try { localStorage.setItem('p1xx_chatsCache', JSON.stringify(data)); } catch(e) {}
      const entries = Object.entries(data);
      pinnedChats = JSON.parse(localStorage.getItem('p1xx_pinnedChats') || '[]');

      for (const [id] of entries) {
        if (!chatNames[id]) {
          try {
            const s = await get(ref(db, `chats/${id}/name`));
            chatNames[id] = s.val() || data[id]?.name || 'Чат';
          } catch (e) { chatNames[id] = data[id]?.name || 'Чат'; }
        }
      }
      localStorage.setItem('p1xx_chatNames', JSON.stringify(chatNames));

      entries.sort((a, b) => {
        const ap = pinnedChats.includes(a[0]), bp = pinnedChats.includes(b[0]);
        if (ap && !bp) return -1;
        if (!ap && bp) return 1;
        return (b[1]?.lastMessageTime || 0) - (a[1]?.lastMessageTime || 0);
      });

      const mutedChats = JSON.parse(localStorage.getItem('p1xx_mutedChats') || '[]');

      const cards = entries.length > 0
        ? entries.map(([id], i) => {
            const name = chatNames[id] || 'Чат';
            const isPinned = pinnedChats.includes(id);
            const isMuted = mutedChats.includes(id);
            const isSecret = !!data[id]?.isSecret;
            const lastMsg = data[id]?.lastMessage || '';
            const unread = data[id]?.unreadCount || 0;
            const time = data[id]?.lastMessageTime ? formatTime(data[id].lastMessageTime) : '';
            const avatarChar = escapeHtml(name[0]?.toUpperCase() || '?');
            return `
              <div class="chat-item new-item ${isPinned ? 'pinned' : ''} ${isSecret ? 'is-secret' : ''}"
                   data-id="${escapeHtml(id)}" ${isSecret ? 'data-secret="1"' : ''} style="animation-delay:${i * 0.035}s">
                ${unread > 0 ? `<div class="unread-badge" style="${isMuted ? 'background:var(--text-secondary);' : ''}">${unread > 99 ? '99+' : unread}</div>` : ''}
                <div class="avatar" style="background:${avatarColor(name)};">${avatarChar}</div>
                <div class="chat-info">
                  <div class="chat-name">${isSecret ? '<span class="secret-lock-badge">🔒</span> ' : ''}${escapeHtml(name)}${isMuted ? ' 🔕' : ''}</div>
                  <div class="chat-last">${time ? escapeHtml(time) : (lastMsg ? escapeHtml(lastMsg.slice(0,22)) : 'Нет сообщений')}</div>
                </div>
              </div>`;
          }).join('')
        : '<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">💬</div><div class="empty-title">Нет чатов. Нажмите + чтобы начать!</div></div>';

      // Collect contact UIDs for stories
      const contactUids = deriveContactUidsFromChatData(data);

      // Store for badge
      window._allChatData = data;
      updateNavUnreadBadge();

      document.getElementById('chatsScreen').innerHTML = buildChatsHeaderHtml() + `
        <div class="list">
          <div class="chat-grid" id="chatsList">${cards}</div>
        </div>`;

      // Render Frames strip
      renderFramesStrip(contactUids);
      loadFrames(contactUids);
      applyFramesCollapsedState();
      document.getElementById('framesToggleBtn')?.addEventListener('click', toggleFramesStrip);
      document.getElementById('quickAddFrameBtn')?.addEventListener('click', () => showAddFrameModal(contactUids));

      // Click to open
      document.querySelectorAll('#chatsList .chat-item').forEach(el => {
        let pressTimer;
        el.addEventListener('pointerdown', () => {
          pressTimer = setTimeout(() => {
            const id = el.dataset.id;
            const isMuted = mutedChats.includes(id);
            const isPinned = pinnedChats.includes(id);
            const rect = el.getBoundingClientRect();
            showContextMenu(
              Math.min(rect.left + rect.width / 2 - 100, window.innerWidth - 220),
              rect.top + rect.height / 2,
              [
                { icon: isPinned ? '📌' : '📍', label: isPinned ? 'Открепить' : 'Закрепить',
                  action: () => { togglePin(id); renderChats(); } },
                { icon: isMuted ? '🔔' : '🔕', label: isMuted ? 'Включить уведомления' : 'Отключить уведомления',
                  action: () => muteChat(id) },
                { icon: '🗑', label: 'Удалить чат', danger: true, action: () => deleteChatForMe(id) },
              ]
            );
          }, 480);
        });
        el.addEventListener('pointerup', () => clearTimeout(pressTimer));
        el.addEventListener('pointercancel', () => clearTimeout(pressTimer));
        el.addEventListener('pointermove', () => clearTimeout(pressTimer));
        el.addEventListener('click', () => {
          clearTimeout(pressTimer);
          if (el.dataset.secret) openSecretChat(el.dataset.id, secretChatOtherUid(el.dataset.id));
          else openChat(el.dataset.id);
        });
        el.addEventListener('contextmenu', (e) => { e.preventDefault(); clearTimeout(pressTimer); });
      });

      document.getElementById('newChatBtn').addEventListener('click', showCreateChatModal);
      document.getElementById('globalSearchBtn').addEventListener('click', () => toast('Поиск по всем чатам'));
      setupSearch();
    });
  }

  function togglePin(chatId) {
    if (pinnedChats.includes(chatId)) {
      pinnedChats = pinnedChats.filter(id => id !== chatId);

      pinnedChats.push(chatId);
      toast('Закреплено 📌');

    localStorage.setItem('p1xx_pinnedChats', JSON.stringify(pinnedChats));

  function muteChat(chatId) {
    const muted = JSON.parse(localStorage.getItem('p1xx_mutedChats') || '[]');

      localStorage.setItem('p1xx_mutedChats', JSON.stringify(muted.filter(id => id !== chatId)));

      muted.push(chatId);
      localStorage.setItem('p1xx_mutedChats', JSON.stringify(muted));

  }

  function setupSearch() {
    const input = document.getElementById('userSearch');
    if (!input) return;
    let timer;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        const q = input.value.trim().toLowerCase().replace('@', '');
        let dropdown = document.getElementById('searchDropdown');
        if (q.length < 1) {
          if (dropdown) { dropdown.classList.remove('show'); setTimeout(() => { if (dropdown?.parentNode) dropdown.remove(); }, 250); }
          return;
        }
        try {
          const snap = await get(ref(db, 'users'));
          const users = snap.val() || {};
          const filtered = Object.entries(users).filter(([uid, u]) =>
            uid !== window.currentUser?.uid &&
            u.username &&          // must have a username (active/completed profile)
            !u.deleted &&          // not soft-deleted
            ((u.username || '').toLowerCase().includes(q) || (u.name || '').toLowerCase().includes(q))
          );
          if (filtered.length === 0) { if (dropdown) dropdown.remove(); return; }
          if (!dropdown) {
            dropdown = document.createElement('div');
            dropdown.id = 'searchDropdown';
            dropdown.className = 'search-dropdown';
            input.parentElement.appendChild(dropdown);
          }
          dropdown.innerHTML = filtered.map(([uid, u]) => `
            <div class="chat-item" data-uid="${escapeHtml(uid)}" style="margin:0;border-radius:0;animation:none;">
              <div class="avatar" style="width:38px;height:38px;font-size:0.9rem;background:${avatarColor(u.name || '?')};">
                ${escapeHtml((u.name || '?')[0]?.toUpperCase() || '?')}
              </div>
              <div style="flex:1;">
                <div style="font-weight:600;">${escapeHtml(u.name || 'User')}</div>
                <small style="color:var(--text-secondary);">@${escapeHtml(u.username || 'user')}</small>
              </div>
              <div class="secret-start-btn" data-secret-uid="${escapeHtml(uid)}" title="Начать секретный чат">🔒</div>
            </div>`).join('');
          requestAnimationFrame(() => dropdown.classList.add('show'));
          dropdown.querySelectorAll('.chat-item').forEach(el => {
            el.addEventListener('click', () => {
              dropdown.remove();
              input.value = '';
              createPrivateChat(el.dataset.uid);
            });
          });
          dropdown.querySelectorAll('.secret-start-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              dropdown.remove();
              input.value = '';
              createSecretChat(btn.dataset.secretUid);
            });
          });
        } catch (e) {}
      }, 300);
    });

    input.addEventListener('blur', () => {
      setTimeout(() => {
        const d = document.getElementById('searchDropdown');
        if (d) { d.classList.remove('show'); setTimeout(() => { if (d?.parentNode) d.remove(); }, 250); }
      }, 200);
    });
  }

  async function createPrivateChat(uid) {
    if (!window.currentUser || uid === window.currentUser.uid) return;
    try {
      const chatId = [window.currentUser.uid, uid].sort().join('_');
      const existing = await get(ref(db, `chats/${chatId}`));
      if (existing.exists()) {
        await set(ref(db, `user_chats/${window.currentUser.uid}/${chatId}`), {
          chatId, name: chatNames[chatId] || 'Чат', type: 'private'
        });
        openChat(chatId);
        return;
      }
      const otherSnap = await get(ref(db, `users/${uid}`));
      const otherUser = otherSnap.val() || {};
      const chatName = otherUser.name || 'Пользователь';
      chatNames[chatId] = chatName;
      localStorage.setItem('p1xx_chatNames', JSON.stringify(chatNames));
      await set(ref(db, `chats/${chatId}`), {
        id: chatId, type: 'private',
        participants: [window.currentUser.uid, uid],
        name: chatName, createdAt: Date.now(), createdBy: window.currentUser.uid
      });
      await set(ref(db, `user_chats/${window.currentUser.uid}/${chatId}`), {
        chatId, name: chatName, type: 'private', lastMessage: '', lastMessageTime: 0, unreadCount: 0
      });
      await set(ref(db, `user_chats/${uid}/${chatId}`), {
        chatId, name: window.userProfile?.name || 'Пользователь', type: 'private',
        lastMessage: '', lastMessageTime: 0, unreadCount: 0
      });
      openChat(chatId);
      toast(`Чат с ${chatName} создан!`);
    } catch (e) {
      toast('Ошибка создания чата: ' + e.message, 'error');
    }
  }

  async function createSecretChat(uid) {
    if (!window.currentUser || uid === window.currentUser.uid) return;
    const myKeys = await ensureSecretKeys();
    if (!myKeys) { toast('Шифрование недоступно в этом браузере', 'error'); return; }
    try {
      const otherSnap = await get(ref(db, `users/${uid}`));
      const otherUser = otherSnap.val() || {};
      if (!otherUser.publicKey) {
        toast(`${otherUser.name || 'Пользователь'} ещё не открывал(а) новую версию — секретные чаты пока недоступны`, 'warning');
        return;
      }
      const chatId = 'secret_' + [window.currentUser.uid, uid].sort().join('_');
      const existing = await get(ref(db, `chats/${chatId}`));
      if (existing.exists()) {
        await set(ref(db, `user_chats/${window.currentUser.uid}/${chatId}`), {
          chatId, name: otherUser.name || 'Секретный чат', type: 'secret', isSecret: true
        });
        openSecretChat(chatId, uid);
        return;
      }
      const chatName = otherUser.name || 'Пользователь';
      await set(ref(db, `chats/${chatId}`), {
        id: chatId, type: 'secret',
        participants: [window.currentUser.uid, uid],
        name: chatName, createdAt: Date.now(), createdBy: window.currentUser.uid
      });
      await set(ref(db, `user_chats/${window.currentUser.uid}/${chatId}`), {
        chatId, name: chatName, type: 'secret', isSecret: true, lastMessage: '', lastMessageTime: 0, unreadCount: 0
      });
      await set(ref(db, `user_chats/${uid}/${chatId}`), {
        chatId, name: window.userProfile?.name || 'Пользователь', type: 'secret', isSecret: true,
        lastMessage: '', lastMessageTime: 0, unreadCount: 0
      });
      openSecretChat(chatId, uid);
      toast(`🔒 Секретный чат с ${chatName} создан`);
    } catch (e) {
      toast('Ошибка создания секретного чата: ' + e.message, 'error');
    }
  }

  function renderGroups() {
    if (!window.currentUser) return;
    if (groupsUnsubscribe) { try { groupsUnsubscribe(); } catch(e) {} groupsUnsubscribe = null; }
    groupsUnsubscribe = onValue(ref(db, 'groups'), (snap) => {
      const groups = snap.val() || {};
      const userGroups = Object.entries(groups).filter(([_, g]) => g.members && g.members[window.currentUser?.uid]);

      const html = userGroups.length > 0
        ? userGroups.map(([id, g], i) => `
            <div class="chat-item new-item" data-id="${escapeHtml(id)}" style="animation-delay:${i * 0.035}s">
              <div class="avatar" style="background:${avatarColor(g.name || 'G')};">${escapeHtml((g.name || 'G')[0]?.toUpperCase())}</div>
              <div class="chat-info">
                <div class="chat-name">${escapeHtml(g.name || 'Группа')}</div>
                <div class="chat-last">${Object.keys(g.members || {}).length} участников</div>
              </div>
              <button class="more-btn" data-id="${escapeHtml(id)}">⋯</button>
            </div>`).join('')
        : '<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-title">Нет групп. Создайте первую!</div></div>';

      document.getElementById('groupsScreen').innerHTML = `
        <div class="header">
          <h2>👥 Группы</h2>
          <span class="icon-btn" id="createGroupBtn">➕</span>
          <span class="icon-btn" id="refreshGroupsBtn">🔄</span>
        </div>
        <div class="list">${html}</div>`;

      document.querySelectorAll('#groupsScreen .chat-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.more-btn')) return;
          openGroupChat(el.dataset.id);
        });
      });

      document.querySelectorAll('#groupsScreen .more-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const groupId = btn.dataset.id;
          const group = groups[groupId];
          if (!group) return;
          const rect = btn.getBoundingClientRect();
          showContextMenu(rect.left, rect.bottom, [
            { icon: 'ℹ️', label: 'Информация', action: () => showGroupInfo(groupId, group) },
            { icon: '🚪', label: 'Покинуть группу', danger: true, action: () => leaveGroup(groupId) },
            { icon: '🔔', label: 'Уведомления группы', action: () => toast('Настройки уведомлений (симуляция)', 'success') }
          ]);
        });
      });

      const createBtn = document.getElementById('createGroupBtn');
      if (createBtn) createBtn.addEventListener('click', createGroup);
      const refreshBtn = document.getElementById('refreshGroupsBtn');
      if (refreshBtn) refreshBtn.addEventListener('click', () => { renderGroups(); toast('Группы обновлены', 'success'); });
    });

  async function showGroupInfo(groupId, group) {
    const memberIds = Object.keys(group.members || {});
    const membersData = [];
    for (const uid of memberIds) {
      const s = await get(ref(db, `users/${uid}`));
      membersData.push(s.val() || { name: 'Пользователь', uid });
    }
    showModal(`
      <h3>ℹ️ ${escapeHtml(group.name || 'Группа')}</h3>
      <p><b>Участники (${memberIds.length}):</b></p>
      ${membersData.map(m => `<p>• ${escapeHtml(m.name || 'Пользователь')} @${escapeHtml(m.username || '—')}</p>`).join('')}
      <p style="font-size:0.7rem;color:var(--text-secondary);">Создана: ${group.createdAt ? new Date(group.createdAt).toLocaleString() : 'Неизвестно'}</p>
      <p style="font-size:0.7rem;color:var(--text-secondary);">ID: ${escapeHtml(groupId)}</p>
      <button class="btn secondary" id="closeGroupInfoBtn">Закрыть</button>`);
    document.getElementById('closeGroupInfoBtn').addEventListener('click', closeModal);
  }

  async function leaveGroup(groupId) {
    if (!window.currentUser || !groupId) return;
    if (!confirm('Вы уверены, что хотите покинуть группу?')) return;
    try {
      const snap = await get(ref(db, `groups/${groupId}/members`));
      const members = snap.val() || {};
      delete members[window.currentUser.uid];
      if (Object.keys(members).length === 0) {
        await remove(ref(db, `groups/${groupId}`));
      } else {
        await update(ref(db, `groups/${groupId}`), { members });
      }
      await remove(ref(db, `user_chats/${window.currentUser.uid}/${groupId}`));
      toast('Вы покинули группу');
      renderGroups();
    } catch (e) {
      toast('Ошибка', 'error');
    }
  }

  function createGroup() {
    showModal(`
      <h3>Новая группа</h3>
      <input placeholder="Название группы" id="groupName" maxlength="50"
             style="width:100%;padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);">
      <input placeholder="@username участника" id="groupMember" autocomplete="off"
             style="width:100%;padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);">
      <div id="groupMembersList" style="display:flex;flex-wrap:wrap;gap:4px;"></div>
      <button class="btn" id="addMemberBtn">Добавить участника</button>
      <button class="btn" id="createGroupFinalBtn">Создать группу</button>
      <button class="btn secondary" id="closeGroupModalBtn">Закрыть</button>`);

    let members = [window.currentUser.uid];
    let usersCache = {};

    const loadUsers = async () => {
      const s = await get(ref(db, 'users'));
      usersCache = s.val() || {};
    };
    loadUsers();

    const renderMembersList = () => {
      const list = document.getElementById('groupMembersList');
      if (!list) return;
      list.innerHTML = members.slice(1).map(uid => {
        const u = usersCache[uid] || {};
        return `<span style="background:var(--accent);color:white;padding:4px 10px;border-radius:14px;font-size:0.8rem;">
          @${escapeHtml(u.username || '?')} <span style="cursor:pointer;margin-left:4px;" data-remove="${uid}">✕</span>
        </span>`;
      }).join('');
      list.querySelectorAll('[data-remove]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          members = members.filter(m => m !== el.dataset.remove);
          renderMembersList();
        });
      });
    };

    document.getElementById('addMemberBtn').addEventListener('click', async () => {
      const uname = document.getElementById('groupMember')?.value.trim().replace('@', '').toLowerCase();
      if (!uname) return toast('Введите @username', 'error');
      if (Object.keys(usersCache).length === 0) await loadUsers();
      const found = Object.entries(usersCache).find(([uid, u]) =>
        (u.username || '').toLowerCase() === uname && uid !== window.currentUser.uid
      );
      if (!found) return toast('Пользователь не найден', 'error');
      if (members.includes(found[0])) return toast('Уже добавлен', 'warning');
      members.push(found[0]);
      renderMembersList();
      const inp = document.getElementById('groupMember');
      if (inp) inp.value = '';
    });

    document.getElementById('createGroupFinalBtn').addEventListener('click', async () => {
      const name = document.getElementById('groupName')?.value.trim() || 'Новая группа';
      if (members.length < 2) return toast('Минимум 2 участника', 'error');
      try {
        const groupRef = push(ref(db, 'groups'));
        const memberObj = {};
        members.forEach(uid => { memberObj[uid] = true; });
        await set(groupRef, { name, members: memberObj, createdBy: window.currentUser.uid, createdAt: Date.now() });
        for (const uid of members) {
          await set(ref(db, `user_chats/${uid}/${groupRef.key}`), {
            chatId: groupRef.key, name, type: 'group',
            lastMessage: 'Группа создана', lastMessageTime: Date.now(), unreadCount: 0
          });
        }
        closeModal();
        toast(`Группа "${name}" создана!`);
        switchScreen('groups');
      } catch (e) {
        toast('Ошибка создания группы: ' + e.message, 'error');
      }
    });

    document.getElementById('closeGroupModalBtn').addEventListener('click', closeModal);
  }

  function openGroupChat(groupId) {
    if (!groupId || !window.currentUser) return;
    // Clean up previous chat listeners
    if (chatTypingUnsubscribe) { try { chatTypingUnsubscribe(); } catch(e) {} chatTypingUnsubscribe = null; }
    if (chatOnlineUnsubscribe) { try { chatOnlineUnsubscribe(); } catch(e) {} chatOnlineUnsubscribe = null; }
    if (chatPinnedUnsubscribe) { try { chatPinnedUnsubscribe(); } catch(e) {} chatPinnedUnsubscribe = null; }
    currentPinnedMessage = null;
    window.currentChat = groupId;
    switchScreen('chat');
    if (chatListeners[groupId]) { try { chatListeners[groupId](); } catch (e) {} }
    get(ref(db, `groups/${groupId}`)).then(snap => {
      const group = snap.val() || {};
      loadChatMessages(groupId, group.name || 'Группа', true);
    });

    // Typing indicator listener for group
    chatTypingUnsubscribe = onValue(ref(db, `typing/${groupId}`), (snap) => {
      const typing = snap.val() || {};
      const others = Object.keys(typing).filter(uid => uid !== window.currentUser?.uid);
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.style.display = others.length > 0 ? 'flex' : 'none';
    });

    // Pinned message listener for group
    chatPinnedUnsubscribe = onValue(ref(db, `pinned/${groupId}`), (snap) => {
      currentPinnedMessage = snap.val();
      renderPinnedBanner();
    });
  }

  // ══════════════════════════════════════════════════════════════
  // CHANNELS — broadcast posts (owner/admins write, everyone reads)
  // plus a per-post comments thread any subscriber can write in.
  // ══════════════════════════════════════════════════════════════

  function myChannelRole(channel) {
    const uid = window.currentUser?.uid;
    if (!uid || !channel) return null;
    if (channel.ownerUid === uid) return 'owner';
    if (channel.admins && channel.admins[uid]) return 'admin';
    if (channel.subscribers && channel.subscribers[uid]) return 'subscriber';
    return null;
  }
  function canManageChannel(channel) {
    const role = myChannelRole(channel);
    return !!window.isAdmin || role === 'owner' || role === 'admin';
  }

  function renderChannels() {
    if (!window.currentUser) return;
    if (channelsUnsubscribe) { try { channelsUnsubscribe(); } catch(e) {} channelsUnsubscribe = null; }
    channelsUnsubscribe = onValue(ref(db, 'channels'), (snap) => {
      const channels = snap.val() || {};
      const myUid = window.currentUser?.uid;
      const myChannels = Object.entries(channels).filter(([_, c]) => !!myChannelRole(c));

      const html = myChannels.length > 0
        ? myChannels.map(([id, c], i) => `
            <div class="chat-item new-item" data-id="${escapeHtml(id)}" style="animation-delay:${i * 0.035}s">
              <div class="avatar" style="background:${avatarColor(c.name || 'K')};overflow:hidden;">
                ${c.avatarBase64 ? `<img src="${c.avatarBase64}" style="width:100%;height:100%;object-fit:cover;">` : escapeHtml((c.name || 'K')[0]?.toUpperCase() || 'K')}
              </div>
              <div class="chat-info">
                <div class="chat-name">📢 ${escapeHtml(c.name || 'Канал')}</div>
                <div class="chat-last">${Object.keys(c.subscribers || {}).length} подписчиков</div>
              </div>
              <button class="more-btn" data-id="${escapeHtml(id)}">⋯</button>
            </div>`).join('')
        : '<div class="empty-state"><div class="empty-icon">📢</div><div class="empty-title">Нет каналов. Создайте свой или найдите по @username!</div></div>';

      document.getElementById('channelsScreen').innerHTML = `
        <div class="header">
          <h2>📢 Каналы</h2>
          <span class="icon-btn" id="findChannelBtn" title="Найти по @username">🔍</span>
          <span class="icon-btn" id="createChannelBtn" title="Создать канал">➕</span>
        </div>
        <div class="list">${html}</div>`;

      document.querySelectorAll('#channelsScreen .chat-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.more-btn')) return;
          openChannel(el.dataset.id);
        });
      });
      document.querySelectorAll('#channelsScreen .more-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const channelId = btn.dataset.id;
          const channel = channels[channelId];
          if (!channel) return;
          const role = myChannelRole(channel);
          const rect = btn.getBoundingClientRect();
          const items = [{ icon: 'ℹ️', label: 'Открыть', action: () => openChannel(channelId) }];
          if (role === 'owner' || window.isAdmin) {
            items.push({ icon: '🗑', label: 'Удалить канал', danger: true, action: () => deleteChannel(channelId) });
          } else {
            items.push({ icon: '🚪', label: 'Отписаться', danger: true, action: () => toggleChannelSubscription(channelId) });
          }
          showContextMenu(rect.left, rect.bottom, items);
        });
      });

      document.getElementById('createChannelBtn').addEventListener('click', createChannel);
      document.getElementById('findChannelBtn').addEventListener('click', findChannelByUsername);
    });
  }

  function findChannelByUsername() {
    showModal(`
      <h3>🔍 Найти канал</h3>
      <input id="findChannelInput" placeholder="@username канала" autocomplete="off"
        style="width:100%;padding:10px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);">
      <button class="btn" id="findChannelGoBtn">Найти</button>
      <button class="btn secondary" id="findChannelCancelBtn">Отмена</button>`);
    document.getElementById('findChannelCancelBtn').addEventListener('click', closeModal);
    document.getElementById('findChannelGoBtn').addEventListener('click', async () => {
      const uname = document.getElementById('findChannelInput')?.value.trim().replace('@', '').toLowerCase();
      if (!uname) return toast('Введите @username канала', 'error');
      try {
        const snap = await get(ref(db, 'channels'));
        const channels = snap.val() || {};
        const found = Object.entries(channels).find(([_, c]) => (c.username || '').toLowerCase() === uname);
        if (!found) return toast('Канал не найден', 'error');
        closeModal();
        openChannel(found[0]);
      } catch (e) { toast('Ошибка поиска', 'error'); }
    });
  }

  function createChannel() {
    let avatarData = '';
    showModal(`
      <h3>📢 Новый канал</h3>
      <input type="file" id="channelAvatarInput" accept="image/*" style="display:none;">
      <button class="btn secondary" id="channelAvatarPickBtn">🖼 Фото канала (необязательно)</button>
      <div id="channelAvatarPreview" style="margin:6px 0;"></div>
      <input id="channelNameInput" placeholder="Название канала" maxlength="60"
        style="width:100%;padding:10px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);margin-bottom:8px;">
      <input id="channelUsernameInput" placeholder="@username (для поиска, необязательно)" autocomplete="off"
        style="width:100%;padding:10px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);margin-bottom:8px;">
      <textarea id="channelDescInput" placeholder="Описание (необязательно)" maxlength="300" rows="3"
        style="width:100%;padding:10px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);resize:vertical;"></textarea>
      <button class="btn" id="channelCreateFinalBtn">Создать</button>
      <button class="btn secondary" id="channelCreateCancelBtn">Отмена</button>`);

    document.getElementById('channelAvatarPickBtn').addEventListener('click', () => document.getElementById('channelAvatarInput').click());
    document.getElementById('channelAvatarInput').addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        avatarData = ev.target.result;
        const prev = document.getElementById('channelAvatarPreview');
        if (prev) prev.innerHTML = `<img src="${avatarData}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;">`;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('channelCreateCancelBtn').addEventListener('click', closeModal);
    document.getElementById('channelCreateFinalBtn').addEventListener('click', async () => {
      const name = document.getElementById('channelNameInput')?.value.trim();
      if (!name) return toast('Введите название канала', 'error');
      const username = document.getElementById('channelUsernameInput')?.value.trim().replace('@', '').toLowerCase();
      const description = document.getElementById('channelDescInput')?.value.trim() || '';
      try {
        if (username) {
          const snap = await get(ref(db, 'channels'));
          const channels = snap.val() || {};
          if (Object.values(channels).some(c => (c.username || '').toLowerCase() === username)) {
            return toast('Этот @username уже занят', 'error');
          }
        }
        let finalAvatar = avatarData;
        if (finalAvatar) {
          try {
            const img = new Image(); img.src = finalAvatar;
            await new Promise(r => img.onload = r);
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height; const mx = 400;
            if (w > mx || h > mx) { const r2 = Math.min(mx / w, mx / h); w *= r2; h *= r2; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            finalAvatar = canvas.toDataURL('image/jpeg', 0.85);
          } catch (e) {}
        }
        const channelRef = push(ref(db, 'channels'));
        const myUid = window.currentUser.uid;
        await set(channelRef, {
          name, description, username: username || '', avatarBase64: finalAvatar || '',
          ownerUid: myUid, admins: { [myUid]: true }, subscribers: { [myUid]: true },
          createdAt: Date.now()
        });
        closeModal();
        toast(`Канал «${name}» создан ✨`, 'success');
        openChannel(channelRef.key);
      } catch (e) {
        toast('Ошибка создания канала: ' + e.message, 'error');
      }
    });
  }

  function openChannel(channelId) {
    if (!channelId || !window.currentUser) return;
    window.currentChannelId = channelId;
    switchScreen('channelView');
    if (channelViewUnsubscribe) { try { channelViewUnsubscribe(); } catch(e) {} }

    channelViewUnsubscribe = onValue(ref(db, `channels/${channelId}`), (snap) => {
      const channel = snap.val();
      if (!channel) { toast('Канал не найден', 'error'); switchScreen('channels'); return; }
      renderChannelView(channelId, channel);
    });
  }

  function loadChannelPosts(channelId, canManage) {
    if (channelPostsUnsubscribe) { try { channelPostsUnsubscribe(); } catch(e) {} channelPostsUnsubscribe = null; }
    channelPostsUnsubscribe = onValue(ref(db, `channelPosts/${channelId}`), (snap) => {
      // Only paint if still viewing this channel — avoids a stray late
      // callback overwriting a screen the user has since navigated away from.
      if (window.currentChannelId !== channelId) return;
      const posts = snap.val() || {};
      const entries = Object.entries(posts).sort((a, b) => (a[1].timestamp || 0) - (b[1].timestamp || 0));

      container.innerHTML = entries.length ? entries.map(([postId, p]) => `
        <div class="channel-post-card" data-post-id="${escapeHtml(postId)}">

            ? `<video src="${p.mediaBase64}" class="channel-post-media" controls playsinline></video>`
            : `<img src="${p.mediaBase64}" class="channel-post-media" alt="">`) : ''}
          ${p.text ? `<div class="channel-post-text">${parseMarkdown(p.text)}</div>` : ''}
