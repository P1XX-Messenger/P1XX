  async function createBluetoothServer() {
    if (!bluetoothSupported) {
      return toast('Bluetooth не поддерживается', 'error');
    }
    
    try {
      toast('Запуск Bluetooth сервера...');
      
      btServer = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [BLE_SERVICE_UUID]
      });

      const gattServer = await btServer.gatt.connect();
      
      const service = await gattServer.getPrimaryService(BLE_SERVICE_UUID);
      btCharRead = await service.getCharacteristic(BLE_CHAR_READ_UUID);
      btCharWrite = await service.getCharacteristic(BLE_CHAR_WRITE_UUID);
      
      btDevice = btServer;
      
      btCharRead.addEventListener('characteristicvaluechanged', (event) => {
        const decoder = new TextDecoder('utf-8');
        const text = decoder.decode(event.target.value);
        p2pMessages.push({
          text: text,
          sent: false,
          time: Date.now(),
          via: 'bluetooth'
        });
        if (window.activeScreen === 'p2p') {
          renderP2P();
        }
        sendNotification('Bluetooth сообщение', text.slice(0, 100));
      });
      
      await btCharRead.startNotifications();
      toast('Bluetooth сервер активен 📶');
      renderSettings();
      
    } catch (error) {
      toast('Ошибка создания Bluetooth сервера: ' + error.message, 'error');
      console.error('BT Server Error:', error);
    }
  }

  async function connectBluetooth() {
    if (!bluetoothSupported) {
      return toast('Bluetooth не поддерживается', 'error');
    }
    
    try {
      toast('Поиск Bluetooth устройств...');
      
      btDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [BLE_SERVICE_UUID]
      });

      const gattServer = await btDevice.gatt.connect();
      
      const service = await gattServer.getPrimaryService(BLE_SERVICE_UUID);
      btCharWrite = await service.getCharacteristic(BLE_CHAR_WRITE_UUID);
      btCharRead = await service.getCharacteristic(BLE_CHAR_READ_UUID);
      
      btCharRead.addEventListener('characteristicvaluechanged', (event) => {
        const decoder = new TextDecoder('utf-8');
        const text = decoder.decode(event.target.value);
        p2pMessages.push({
          text: text,
          sent: false,
          time: Date.now(),
          via: 'bluetooth'
        });
        if (window.activeScreen === 'p2p') {
          renderP2P();
        }
        sendNotification('Bluetooth сообщение', text.slice(0, 100));
      });
      
      await btCharRead.startNotifications();
      toast('Подключено по Bluetooth 📶');
      renderSettings();
      
    } catch (error) {
      toast('Ошибка подключения Bluetooth: ' + error.message, 'error');
      console.error('BT Connect Error:', error);
    }
  }

  async function sendBluetoothMessage(text) {
    if (!btCharWrite) {
      return toast('Нет Bluetooth соединения', 'error');
    }
    
    try {
      const encoder = new TextEncoder();
      await btCharWrite.writeValue(encoder.encode(text));
      return true;
    } catch (error) {
      toast('Ошибка отправки по Bluetooth: ' + error.message, 'error');
      return false;
    }
  }

  // ==================== P2P ====================
  function renderP2P() {
    const isConnected = (p2pChannel && p2pChannel.readyState === 'open') || (btDevice && btDevice.gatt && btDevice.gatt.connected);
    
    document.getElementById('p2pScreen').innerHTML = `
      <div class="header">
        <h2>🔗 P2P чат</h2>
        <span class="icon-btn" id="p2pCreateBtn" title="Создать сессию">📤</span>
        <span class="icon-btn" id="p2pScanBtn" title="Сканировать QR">📷</span>
        <span class="icon-btn" id="p2pBtBtn" title="Bluetooth">📶</span>
        <span class="icon-btn" id="p2pDisconnectBtn" style="display:${isConnected ? 'flex' : 'none'}" title="Отключиться">❌</span>
      </div>
      
      <div style="padding:10px 14px;background:var(--bg-secondary);margin:8px 12px;border-radius:12px;display:flex;align-items:center;gap:8px;">
        <div style="width:10px;height:10px;border-radius:50%;background:${isConnected ? '#34c759' : 'var(--text-secondary)'};${isConnected ? 'box-shadow:0 0 10px rgba(52,199,89,0.5);' : ''}"></div>
        <span style="font-size:0.85rem;">
          ${btDevice?.gatt?.connected ? '📶 Bluetooth активно' : p2pChannel?.readyState === 'open' ? '🔗 WebRTC активно' : 'Нет активного соединения'}
        </span>
      </div>
      
      <div class="list" style="flex:1;padding:8px;">
        ${p2pMessages.length > 0 
          ? p2pMessages.map(message => `
              <div class="message-container ${message.sent ? 'outgoing' : 'incoming'}">
                <div class="bubble">
                  ${escapeHtml(message.text)} 
                  ${message.via ? `<small style="opacity:0.6;display:block;font-size:0.65rem;">(через ${message.via})</small>` : ''}
                  <span class="meta">${message.sent ? 'Вы' : 'Собеседник'} • ${formatTime(message.time)}</span>
                </div>
              </div>
            `).join('')
          : '<div style="padding:40px;text-align:center;color:var(--text-secondary);">Создайте QR-код, отсканируйте его или подключитесь по Bluetooth для P2P соединения</div>'
        }
      </div>
      
      <div class="input-area no-nav">
        <input id="p2pInput" placeholder="Сообщение..." ${!isConnected ? 'disabled' : ''} autocomplete="off">
        <span class="icon-btn" id="sendP2PBtn" style="opacity:${isConnected ? '1' : '0.4'}">➤</span>
      </div>
    `;
    
    const p2pCreateBtn = document.getElementById('p2pCreateBtn');
    if (p2pCreateBtn) {
      p2pCreateBtn.addEventListener('click', createP2POffer);
    }
    
    const p2pScanBtn = document.getElementById('p2pScanBtn');
    if (p2pScanBtn) {
      p2pScanBtn.addEventListener('click', startQRScanner);
    }
    
    const p2pBtBtn = document.getElementById('p2pBtBtn');
    if (p2pBtBtn) {
      p2pBtBtn.addEventListener('click', handleBluetoothConnection);
    }
    
    const p2pDisconnectBtn = document.getElementById('p2pDisconnectBtn');
    if (p2pDisconnectBtn) {
      p2pDisconnectBtn.addEventListener('click', disconnectP2P);
    }
    
    const sendP2PBtn = document.getElementById('sendP2PBtn');
    if (sendP2PBtn) {
      sendP2PBtn.addEventListener('click', sendP2PMessage);
    }
    
    const p2pInput = document.getElementById('p2pInput');
    if (p2pInput) {
      p2pInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          sendP2PMessage();
        }
      });
    }
  }

  async function createP2POffer() {
    try {
      if (p2pConnection) {
        p2pConnection.close();
      }
      if (p2pChannel) {
        p2pChannel.close();
      }
      
      p2pConnection = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      });
      
      p2pChannel = p2pConnection.createDataChannel('chat', { ordered: true });
      setupP2PChannel();
      
      const offer = await p2pConnection.createOffer();
      await p2pConnection.setLocalDescription(offer);
      
      setTimeout(() => {
        const sdp = JSON.stringify({
          type: 'offer',
          sdp: p2pConnection.localDescription?.sdp || ''
        });
        showQRWithLink(sdp);
      }, 1500);
      
      toast('QR-код готов!');
    } catch (error) {
      toast('Ошибка создания P2P: ' + error.message, 'error');
    }
  }

  function showQRWithLink(sdpData) {
    const base64 = btoa(unescape(encodeURIComponent(sdpData)));
    const link = `${location.origin}${location.pathname}#p2p=${base64}`;
    
    showModal(`
      <h3>📷 Поделитесь QR-кодом</h3>
      <div class="qr-container" id="modalQR"></div>
      <input value="${escapeHtml(link)}" readonly 
             style="width:100%;padding:8px;border-radius:10px;border:1px solid var(--border);font-size:0.65rem;word-break:break-all;background:var(--bg-primary);color:var(--text-primary);">
      <div style="display:flex;gap:8px;">
        <button class="btn" id="copyLinkBtn" style="flex:1;">📋 Копировать</button>
        <button class="btn secondary" id="closeQRBtn" style="flex:1;">Закрыть</button>
      </div>
    `);
    
    requestAnimationFrame(() => {
      const qrElement = document.getElementById('modalQR');
      if (qrElement && typeof QRCode !== 'undefined') {
        qrElement.innerHTML = '';
        try {
          new QRCode(qrElement, {
            text: link,
            width: 200,
            height: 200,
            colorDark: '#000000',
            colorLight: '#ffffff'
          });
        } catch (error) {
          qrElement.innerHTML = '<p style="color:red;">Ошибка генерации QR</p>';
        }
      } else if (qrElement) {
        qrElement.innerHTML = '<p>QR-библиотека не загружена</p>';
      }
    });
    
    const copyLinkBtn = document.getElementById('copyLinkBtn');
    if (copyLinkBtn) {
      copyLinkBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(link).then(
          () => toast('Ссылка скопирована!'),
          () => toast('Не удалось скопировать', 'error')
        );
      });
    }
    
    const closeQRBtn = document.getElementById('closeQRBtn');
    if (closeQRBtn) {
      closeQRBtn.addEventListener('click', closeModal);
    }
  }

  function startQRScanner() {
    showModal(`
      <h3>📷 Сканировать QR-код</h3>
      <div id="qrScanner" style="width:100%;max-width:280px;margin:0 auto;border-radius:12px;overflow:hidden;"></div>
      <input id="manualLink" placeholder="Или вставьте ссылку вручную" 
             style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--border);font-size:0.8rem;background:var(--bg-primary);color:var(--text-primary);">
      <div style="display:flex;gap:8px;">
        <button class="btn" id="manualConnectBtn" style="flex:1;">Подключиться</button>
        <button class="btn secondary" id="stopScanBtn" style="flex:1;">Отмена</button>
      </div>
    `);
    
    setTimeout(() => {
      const qrScannerElement = document.getElementById('qrScanner');
      if (qrScannerElement && typeof Html5Qrcode !== 'undefined') {
        try {
          qrScanner = new Html5Qrcode('qrScanner');
          qrScanner.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: 220 },
            (decodedText) => {
              closeModal();
              handleScannedQR(decodedText);
            },
            () => {}
          ).catch(() => {
            qrScannerElement.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary);">Камера недоступна</div>';
          });
        } catch (error) {
          qrScannerElement.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary);">Ошибка сканера</div>';
        }
      } else if (qrScannerElement) {
        qrScannerElement.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary);">Сканер не загружен</div>';
      }
    }, 300);
    
    const manualConnectBtn = document.getElementById('manualConnectBtn');
    if (manualConnectBtn) {
      manualConnectBtn.addEventListener('click', () => {
        const link = document.getElementById('manualLink')?.value.trim();
        if (link) {
          closeModal();
          handleScannedQR(link);
        }
      });
    }
    
    const stopScanBtn = document.getElementById('stopScanBtn');
    if (stopScanBtn) {
      stopScanBtn.addEventListener('click', closeModal);
    }
  }

  function handleScannedQR(text) {
    try {
      if (text.includes('#p2p=')) {
        const base64 = text.split('#p2p=')[1].split('&')[0].split('#')[0];
        const sdp = decodeURIComponent(escape(atob(base64)));
        connectWithSDP(sdp);
      } else if (text.startsWith('{') && text.includes('"sdp"')) {
        connectWithSDP(text);
      } else {
        toast('Неверный формат QR-кода', 'error');
      }
    } catch (error) {
      toast('Ошибка чтения QR-кода: ' + error.message, 'error');
    }
  }

  async function connectWithSDP(remoteSDP) {
    try {
      if (p2pConnection) {
        p2pConnection.close();
      }
      if (p2pChannel) {
        p2pChannel.close();
      }
      
      const data = JSON.parse(remoteSDP);
      
      p2pConnection = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      });
      
      p2pConnection.ondatachannel = (event) => {
        p2pChannel = event.channel;
        setupP2PChannel();
      };
      
      await p2pConnection.setRemoteDescription(new RTCSessionDescription(data));
      
      if (data.type === 'offer') {
        const answer = await p2pConnection.createAnswer();
        await p2pConnection.setLocalDescription(answer);
      }
      
      toast('Подключение... Ожидайте');
    } catch (error) {
      toast('Ошибка подключения: ' + error.message, 'error');
    }
  }

  function setupP2PChannel() {
    if (!p2pChannel) {
      return;
    }
    
    p2pChannel.onopen = () => {
      toast('P2P канал открыт! ✅');
      renderP2P();
    };
    
    p2pChannel.onmessage = (event) => {
      p2pMessages.push({
        text: event.data,
        sent: false,
        time: Date.now(),
        via: 'webrtc'
      });
      if (window.activeScreen === 'p2p') {
        renderP2P();
      }
      sendNotification('P2P сообщение', event.data.slice(0, 100));
    };
    
    p2pChannel.onclose = () => {
      toast('P2P канал закрыт', 'warning');
      p2pMessages = [];
      renderP2P();
    };
    
    p2pChannel.onerror = (error) => {
      console.error('P2P channel error:', error);
      toast('Ошибка P2P канала', 'error');
    };
  }

  async function sendP2PMessage() {
    const input = document.getElementById('p2pInput');
    if (!input || !input.value.trim()) {
      return;
    }
    
    const text = input.value.trim();
    
    if (btDevice && btDevice.gatt && btDevice.gatt.connected && btCharWrite) {
      const sent = await sendBluetoothMessage(text);
      if (sent) {
        p2pMessages.push({ text: text, sent: true, time: Date.now(), via: 'bluetooth' });
        input.value = '';
        renderP2P();
        return;
      }
    }
    
    if (p2pChannel && p2pChannel.readyState === 'open') {
      try {
        p2pChannel.send(text);
        p2pMessages.push({ text: text, sent: true, time: Date.now(), via: 'webrtc' });
        input.value = '';
        renderP2P();
      } catch (error) {
        toast('Ошибка отправки P2P', 'error');
      }
      return;
    }
    
    toast('Нет активного P2P соединения', 'error');
  }

  function disconnectP2P() {
    if (p2pChannel) {
      p2pChannel.close();
    }
    if (p2pConnection) {
      p2pConnection.close();
    }
    if (btDevice) {
      try {
        btDevice.gatt.disconnect();
      } catch (error) {
        // Игнорируем
      }
      btDevice = null;
      btCharWrite = null;
      btCharRead = null;
    }
    p2pChannel = null;
    p2pConnection = null;
    p2pMessages = [];
    renderP2P();
    toast('P2P отключен');
  }

  // ==================== NEARBY ====================
  function startNearbyBroadcast() {
    if (!window.currentUser || !db) {
      return;
    }
    
    const peerRef = ref(db, `rooms/${ROOM_ID}/${window.currentUser.uid}`);
    const peerData = {
      name: window.userProfile?.name || 'User',
      uid: window.currentUser.uid,
      username: window.userProfile?.username || '',
      timestamp: serverTimestamp()
    };
    
    set(peerRef, peerData);
    onDisconnect(peerRef).remove();
    
    stopNearbyBroadcast();
    nearbyBroadcastInterval = setInterval(() => {
      set(peerRef, { ...peerData, timestamp: serverTimestamp() });
    }, 8000);
  }

  function stopNearbyBroadcast() {
    if (nearbyBroadcastInterval) {
      clearInterval(nearbyBroadcastInterval);
      nearbyBroadcastInterval = null;
    }
    if (window.currentUser && db) {
      remove(ref(db, `rooms/${ROOM_ID}/${window.currentUser.uid}`)).catch(() => {});
    }
  }

  // ==================== DEEP LINK ====================
  function checkDeepLink() {
    const hash = window.location.hash;
    if (hash.includes('#p2p=')) {
      const base64 = hash.split('#p2p=')[1].split('&')[0].split('#')[0];
      try {
        const sdp = decodeURIComponent(escape(atob(base64)));
        history.replaceState(null, '', window.location.pathname);
        setTimeout(() => {
          if (window.currentUser) {
            connectWithSDP(sdp);
            switchScreen('p2p');
          }
        }, 1500);
      } catch (error) {
        console.error('Deep link error:', error);
      }
    }
  }

  checkDeepLink();

  // ==================== О ПРИЛОЖЕНИИ ====================
  function showAbout() {
    showModal(`
      <h3>ℹ️ P1XX v3.5</h3>
      <p><b>Исправления и новые функции:</b></p>

        <li>✅ Аватарка собеседника в хедере ЛС</li>
        <li>✅ Просмотр информации о пользователе по клику на аватар</li>
        <li>✅ Просмотр фото в заметках и чатах</li>

        <li>✅ Меню по долгому нажатию</li>
        <li>✅ Bluetooth чат для совместимых браузеров</li>
      </ul>
      <p><b>Лицензия:</b> GPL-3.0</p>
      <button class="btn secondary" id="closeAboutBtn">Закрыть</button>
    `);
    
    const closeAboutBtn = document.getElementById('closeAboutBtn');
    if (closeAboutBtn) {
      closeAboutBtn.addEventListener('click', closeModal);
    }
  }

  // ==================== НАВИГАЦИЯ ПО ПИЛЮЛЕ ====================
  document.querySelectorAll('#bottomNavPill .nav-item').forEach((navItem) => {
    navItem.addEventListener('click', () => switchScreen(navItem.dataset.screen));
  });

  // ==================== ОЧИСТКА ПРИ ВЫХОДЕ ====================
  window.addEventListener('beforeunload', () => {
    stopNearbyBroadcast();
    disconnectP2P();
    if (localStream) {
      localStream.getTracks().forEach((track) => track.stop());
      localStream = null;
    }
  });

  console.log('🚀 P1XX v3.5 – Полный код без белой полосы, с аватарками и всей функциональностью');
</script>
