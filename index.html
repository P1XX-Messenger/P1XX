        <p style="color:var(--text-secondary);text-align:center;font-size:0.85rem;">Чаты • Группы • Заметки • PWA</p>
        <input id="authEmail" type="email" placeholder="Email" autocomplete="email"
          style="width:100%;padding:14px;border-radius:22px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);font-size:0.95rem;">
        <input id="authPass" type="password" placeholder="Пароль" autocomplete="current-password"
          style="width:100%;padding:14px;border-radius:22px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);">
        <button class="btn" id="loginBtn" style="width:100%;">Войти</button>
        <button class="btn secondary" id="regBtn" style="width:100%;">Создать аккаунт</button>
        <a href="#" id="resetPasswordLink" style="font-size:0.8rem;color:var(--accent);text-decoration:none;">Забыли пароль?</a>
      </div>
      <style>
        @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
        }
      </style>`;

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value;
      if (!email || !password) return toast('Заполните все поля', 'error');
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      showLoader();
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        const msgs = {
          'auth/user-not-found': 'Пользователь не найден',
          'auth/wrong-password': 'Неверный пароль',
          'auth/invalid-email': 'Неверный email',
          'auth/invalid-credential': 'Неверный email или пароль'
        };
        toast(msgs[e.code] || e.message, 'error');
      } finally {
        btn.disabled = false;
        hideLoader();
      }
    });

    document.getElementById('regBtn').addEventListener('click', async () => {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value;
      if (!email || !password) return toast('Заполните все поля', 'error');
      if (password.length < 6) return toast('Пароль минимум 6 символов', 'error');
      const btn = document.getElementById('regBtn');
      btn.disabled = true;
      showLoader();
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        toast('Аккаунт создан!');
      } catch (e) {
        const msgs = {
          'auth/email-already-in-use': 'Email уже используется',
          'auth/weak-password': 'Пароль слишком слабый'
        };
        toast(msgs[e.code] || e.message, 'error');
      } finally {
        btn.disabled = false;
        hideLoader();
      }
    });

    document.getElementById('resetPasswordLink').addEventListener('click', () => {
      const email = document.getElementById('authEmail').value.trim();
      if (!email) return toast('Введите email для сброса пароля', 'error');
      toast('Ссылка для сброса отправлена (симуляция)', 'success');
    });

    // Enter key navigation in auth form
    document.getElementById('authEmail').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('authPass').focus(); }
    });
    document.getElementById('authPass').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('loginBtn').click(); }
    });
  }

  function setTypingIndicator(chatId) {
    if (!window.currentUser || !chatId) return;
    const typingRef = ref(db, `typing/${chatId}/${window.currentUser.uid}`);
    set(typingRef, true);
    onDisconnect(typingRef).remove();
    clearTimeout(typingTimers[chatId]);
    typingTimers[chatId] = setTimeout(() => remove(typingRef), 3000);
  }

  async function renderChats() {
    if (!window.currentUser || !db) return;
    if (chatsUnsubscribe) { try { chatsUnsubscribe(); } catch(e) {} chatsUnsubscribe = null; }
    const userChatsRef = ref(db, `user_chats/${window.currentUser.uid}`);
    chatsUnsubscribe = onValue(userChatsRef, async (snap) => {
      const data = snap.val() || {};
      const entries = Object.entries(data);
      pinnedChats = JSON.parse(localStorage.getItem('p1xx_pinnedChats') || '[]');

      for (const [id] of entries) {
        if (!chatNames[id]) {
          try {
            const s = await get(ref(db, `chats/${id}/name`));
            chatNames[id] = s.val() || data[id]?.name || 'Чат';
          } catch (e) { chatNames[id] = data[id]?.name || 'Чат'; }
        }
      }
      localStorage.setItem('p1xx_chatNames', JSON.stringify(chatNames));

      entries.sort((a, b) => {
        const ap = pinnedChats.includes(a[0]), bp = pinnedChats.includes(b[0]);
        if (ap && !bp) return -1;
        if (!ap && bp) return 1;
        return (b[1]?.lastMessageTime || 0) - (a[1]?.lastMessageTime || 0);
      });

      const mutedChats = JSON.parse(localStorage.getItem('p1xx_mutedChats') || '[]');

      const cards = entries.length > 0
        ? entries.map(([id], i) => {
            const name = chatNames[id] || 'Чат';
            const isPinned = pinnedChats.includes(id);
            const isFav = favouriteChats.includes(id);
            const isMuted = mutedChats.includes(id);
            const lastMsg = data[id]?.lastMessage || '';
            const unread = data[id]?.unreadCount || 0;
            const time = data[id]?.lastMessageTime ? formatTime(data[id].lastMessageTime) : '';
            const avatarChar = escapeHtml(name[0]?.toUpperCase() || '?');
            return `
              <div class="chat-item new-item ${isPinned ? 'pinned' : ''}"
                   data-id="${escapeHtml(id)}" style="animation-delay:${i * 0.035}s">
                ${unread > 0 ? `<div class="unread-badge" style="${isMuted ? 'background:var(--text-secondary);' : ''}">${unread > 99 ? '99+' : unread}</div>` : ''}
                <div class="avatar" style="background:${avatarColor(name)};">${avatarChar}</div>
                <div class="chat-info">
                  <div class="chat-name">${escapeHtml(name)}${isFav ? ' ⭐' : ''}${isMuted ? ' 🔕' : ''}</div>
                  <div class="chat-last">${time ? escapeHtml(time) : (lastMsg ? escapeHtml(lastMsg.slice(0,22)) : 'Нет сообщений')}</div>
                </div>
              </div>`;
          }).join('')
        : '<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--text-secondary);">Нет чатов. Нажмите + чтобы начать!</div>';

      document.getElementById('chatsScreen').innerHTML = `
        <div class="chats-header">
          <div class="chats-header-top">
            <span class="chats-title">Чаты</span>
            <div class="chats-header-actions">
              <span class="icon-btn" id="globalSearchBtn" style="background:var(--bg-secondary);">🔍</span>
              <span class="icon-btn" id="newChatBtn" style="background:var(--bg-secondary);">＋</span>
            </div>
          </div>
          <div class="search-bar-wrap">
            <span class="search-icon">🔍</span>
            <input placeholder="Поиск" id="userSearch" autocomplete="off">
            <span class="username-hint">@username</span>
          </div>
        </div>
        <div id="storyStripContainer"></div>
        <div class="list">
          <div class="chat-grid" id="chatsList">${cards}</div>
        </div>`;

      // Click to open
      document.querySelectorAll('#chatsList .chat-item').forEach(el => {
        let pressTimer;
        el.addEventListener('pointerdown', () => {
          pressTimer = setTimeout(() => {
            const id = el.dataset.id;
            const isMuted = mutedChats.includes(id);
            const isFav = favouriteChats.includes(id);
            const isPinned = pinnedChats.includes(id);
            const rect = el.getBoundingClientRect();
            showContextMenu(
              Math.min(rect.left + rect.width / 2 - 100, window.innerWidth - 220),
              rect.top + rect.height / 2,
              [
                { icon: isPinned ? '📌' : '📍', label: isPinned ? 'Открепить' : 'Закрепить',
                  action: () => { togglePin(id); renderChats(); } },
                { icon: isFav ? '💛' : '⭐', label: isFav ? 'Убрать из избранного' : 'В избранное',
                  action: () => { toggleFavourite(id); } },
                { icon: isMuted ? '🔔' : '🔕', label: isMuted ? 'Включить уведомления' : 'Отключить уведомления',
                  action: () => muteChat(id) },
                { icon: '🗑', label: 'Удалить чат', danger: true, action: () => deleteChatForMe(id) },
              ]
            );
          }, 480);
        });
        el.addEventListener('pointerup', () => clearTimeout(pressTimer));
        el.addEventListener('pointercancel', () => clearTimeout(pressTimer));
        el.addEventListener('pointermove', () => clearTimeout(pressTimer));
        el.addEventListener('click', () => { clearTimeout(pressTimer); openChat(el.dataset.id); });
        el.addEventListener('contextmenu', (e) => { e.preventDefault(); clearTimeout(pressTimer); });
      });

      document.getElementById('newChatBtn').addEventListener('click', showCreateChatModal);
      document.getElementById('globalSearchBtn').addEventListener('click', () => toast('Поиск по всем чатам'));
      setupSearch();
      renderStoryStrip();
    });
  }

  function togglePin(chatId) {
    if (pinnedChats.includes(chatId)) {
      pinnedChats = pinnedChats.filter(id => id !== chatId);
      toast('Откреплено');
    } else {
      pinnedChats.push(chatId);
      toast('Закреплено 📌');
    }
    localStorage.setItem('p1xx_pinnedChats', JSON.stringify(pinnedChats));
  }

  function muteChat(chatId) {
    const muted = JSON.parse(localStorage.getItem('p1xx_mutedChats') || '[]');
    if (muted.includes(chatId)) {
      localStorage.setItem('p1xx_mutedChats', JSON.stringify(muted.filter(id => id !== chatId)));
      toast('Уведомления включены 🔔');
    } else {
      muted.push(chatId);
      localStorage.setItem('p1xx_mutedChats', JSON.stringify(muted));
      toast('Уведомления отключены 🔕');
    }
  }

  function toggleFavourite(chatId) {
    if (favouriteChats.includes(chatId)) {
      favouriteChats = favouriteChats.filter(id => id !== chatId);
      toast('Убрано из избранного', 'warning');
    } else {
      favouriteChats.push(chatId);
      toast('Добавлено в избранное ⭐', 'success');
    }
    localStorage.setItem('p1xx_favouriteChats', JSON.stringify(favouriteChats));
    renderChats();
  }

  async function deleteChatForMe(chatId) {
    if (!window.currentUser) return;
    if (!confirm('Удалить этот чат навсегда?')) return;
    try {
      await remove(ref(db, `user_chats/${window.currentUser.uid}/${chatId}`));
      if (window.currentChat === chatId) {
        window.currentChat = null;
        switchScreen('chats');
      }
      toast('Чат удалён 🗑');
    } catch (e) {
      toast('Ошибка удаления', 'error');
    }
  }

  function showCreateChatModal() {
    showModal(`
      <h3>Новый чат</h3>
      <input placeholder="@username пользователя" id="newChatUsername" autocomplete="off"
             style="width:100%;padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);">
      <button class="btn" id="findUserBtn">Найти и создать чат</button>
      <button class="btn secondary" id="createGroupBtn2">Создать группу</button>`);

    document.getElementById('findUserBtn').addEventListener('click', async () => {
      const username = document.getElementById('newChatUsername')?.value.trim().replace('@', '').toLowerCase();
      if (!username) return toast('Введите @username', 'error');
      try {
        const snap = await get(ref(db, 'users'));
        const users = snap.val() || {};
        const found = Object.entries(users).find(([uid, u]) =>
          (u.username || '').toLowerCase() === username &&
          uid !== window.currentUser.uid &&
          !u.deleted
        );
        if (!found) return toast('Пользователь не найден', 'error');
        closeModal();
        await createPrivateChat(found[0]);
      } catch (e) {
        toast('Ошибка поиска', 'error');
      }
    });

    document.getElementById('createGroupBtn2').addEventListener('click', () => { closeModal(); createGroup(); });
  }

  function setupSearch() {
    const input = document.getElementById('userSearch');
    if (!input) return;
    let timer;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        const q = input.value.trim().toLowerCase().replace('@', '');
        let dropdown = document.getElementById('searchDropdown');
        if (q.length < 1) {
          if (dropdown) { dropdown.classList.remove('show'); setTimeout(() => { if (dropdown?.parentNode) dropdown.remove(); }, 250); }
          return;
        }
        try {
          const snap = await get(ref(db, 'users'));
          const users = snap.val() || {};
          const filtered = Object.entries(users).filter(([uid, u]) =>
            uid !== window.currentUser?.uid &&
            u.username &&          // must have a username (active/completed profile)
            !u.deleted &&          // not soft-deleted
            ((u.username || '').toLowerCase().includes(q) || (u.name || '').toLowerCase().includes(q))
          );
          if (filtered.length === 0) { if (dropdown) dropdown.remove(); return; }
          if (!dropdown) {
            dropdown = document.createElement('div');
            dropdown.id = 'searchDropdown';
            dropdown.className = 'search-dropdown';
            input.parentElement.appendChild(dropdown);
          }
          dropdown.innerHTML = filtered.map(([uid, u]) => `
            <div class="chat-item" data-uid="${escapeHtml(uid)}" style="margin:0;border-radius:0;animation:none;">
              <div class="avatar" style="width:38px;height:38px;font-size:0.9rem;background:${avatarColor(u.name || '?')};">
                ${escapeHtml((u.name || '?')[0]?.toUpperCase() || '?')}
              </div>
              <div style="flex:1;">
                <div style="font-weight:600;">${escapeHtml(u.name || 'User')}</div>
                <small style="color:var(--text-secondary);">@${escapeHtml(u.username || 'user')}</small>
              </div>
            </div>`).join('');
          requestAnimationFrame(() => dropdown.classList.add('show'));
          dropdown.querySelectorAll('.chat-item').forEach(el => {
            el.addEventListener('click', () => {
              dropdown.remove();
              input.value = '';
              createPrivateChat(el.dataset.uid);
            });
          });
        } catch (e) {}
      }, 300);
    });

    input.addEventListener('blur', () => {
      setTimeout(() => {
        const d = document.getElementById('searchDropdown');
        if (d) { d.classList.remove('show'); setTimeout(() => { if (d?.parentNode) d.remove(); }, 250); }
      }, 200);
    });
  }

  async function createPrivateChat(uid) {
    if (!window.currentUser || uid === window.currentUser.uid) return;
    try {
      const chatId = [window.currentUser.uid, uid].sort().join('_');
      const existing = await get(ref(db, `chats/${chatId}`));
      if (existing.exists()) {
        await set(ref(db, `user_chats/${window.currentUser.uid}/${chatId}`), {
          chatId, name: chatNames[chatId] || 'Чат', type: 'private'
        });
        openChat(chatId);
        return;
      }
      const otherSnap = await get(ref(db, `users/${uid}`));
      const otherUser = otherSnap.val() || {};
      const chatName = otherUser.name || 'Пользователь';
      chatNames[chatId] = chatName;
      localStorage.setItem('p1xx_chatNames', JSON.stringify(chatNames));
      await set(ref(db, `chats/${chatId}`), {
        id: chatId, type: 'private',
        participants: [window.currentUser.uid, uid],
        name: chatName, createdAt: Date.now(), createdBy: window.currentUser.uid
      });
      await set(ref(db, `user_chats/${window.currentUser.uid}/${chatId}`), {
        chatId, name: chatName, type: 'private', lastMessage: '', lastMessageTime: 0, unreadCount: 0
      });
      await set(ref(db, `user_chats/${uid}/${chatId}`), {
        chatId, name: window.userProfile?.name || 'Пользователь', type: 'private',
        lastMessage: '', lastMessageTime: 0, unreadCount: 0
      });
      openChat(chatId);
      toast(`Чат с ${chatName} создан!`);
    } catch (e) {
      toast('Ошибка создания чата: ' + e.message, 'error');
    }
  }

  function renderGroups() {
    if (!window.currentUser) return;
    if (groupsUnsubscribe) { try { groupsUnsubscribe(); } catch(e) {} groupsUnsubscribe = null; }
    groupsUnsubscribe = onValue(ref(db, 'groups'), (snap) => {
      const groups = snap.val() || {};
      const userGroups = Object.entries(groups).filter(([_, g]) => g.members && g.members[window.currentUser?.uid]);

      const html = userGroups.length > 0
        ? userGroups.map(([id, g]) => `
            <div class="chat-item new-item" data-id="${escapeHtml(id)}">
              <div class="avatar" style="background:${avatarColor(g.name || 'G')};">${escapeHtml((g.name || 'G')[0]?.toUpperCase())}</div>
              <div class="chat-info">
                <div class="chat-name">${escapeHtml(g.name || 'Группа')}</div>
                <div class="chat-last">${Object.keys(g.members || {}).length} участников</div>
              </div>
              <button class="more-btn" data-id="${escapeHtml(id)}">⋯</button>
            </div>`).join('')
        : '<div style="padding:40px;text-align:center;color:var(--text-secondary);">Нет групп. Создайте первую!</div>';

      document.getElementById('groupsScreen').innerHTML = `
        <div class="header">
          <h2>👥 Группы</h2>
          <span class="icon-btn" id="createGroupBtn">➕</span>
          <span class="icon-btn" id="refreshGroupsBtn">🔄</span>
        </div>
        <div class="list">${html}</div>`;

      document.querySelectorAll('#groupsScreen .chat-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.more-btn')) return;
          openGroupChat(el.dataset.id);
        });
      });

      document.querySelectorAll('#groupsScreen .more-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const groupId = btn.dataset.id;
          const group = groups[groupId];
          if (!group) return;
          const rect = btn.getBoundingClientRect();
          showContextMenu(rect.left, rect.bottom, [
            { icon: 'ℹ️', label: 'Информация', action: () => showGroupInfo(groupId, group) },
            { icon: '🚪', label: 'Покинуть группу', danger: true, action: () => leaveGroup(groupId) },
            { icon: '🔔', label: 'Уведомления группы', action: () => toast('Настройки уведомлений (симуляция)', 'success') }
          ]);
        });
      });

      const createBtn = document.getElementById('createGroupBtn');
      if (createBtn) createBtn.addEventListener('click', createGroup);
      const refreshBtn = document.getElementById('refreshGroupsBtn');
      if (refreshBtn) refreshBtn.addEventListener('click', () => { renderGroups(); toast('Группы обновлены', 'success'); });
    });
  }

  async function renderFavourites() {
    if (!window.currentUser) return;
    const screen = document.getElementById('favouritesScreen');
    if (!screen) return;

    // favouriteChats stores chatIds; we need to resolve them to user profiles
    const favIds = JSON.parse(localStorage.getItem('p1xx_favouriteChats') || '[]');

    let html = '';
    if (favIds.length === 0) {
      html = '<div style="padding:40px;text-align:center;color:var(--text-secondary);">Нет избранных. Добавь людей через ⋯ в чате!</div>';
    } else {
      const rows = await Promise.all(favIds.map(async (chatId) => {
        const name = chatNames[chatId] || 'Чат';
        // Try to get other participant's profile
        let otherName = name, otherAvatar = '';
        try {
          const chatSnap = await get(ref(db, `chats/${chatId}`));
          const chatData = chatSnap.val() || {};
          const participants = chatData.participants || [];
          const otherUid = participants.find(uid => uid !== window.currentUser.uid);
          if (otherUid) {
            const uSnap = await get(ref(db, `users/${otherUid}`));
            const u = uSnap.val() || {};
            otherName = u.name || name;
            otherAvatar = u.avatarBase64 || '';
          }
        } catch(e) {}
        return `
          <div class="chat-item new-item" data-id="${escapeHtml(chatId)}">
            <div class="avatar" style="background:${avatarColor(otherName)};">
              ${otherAvatar ? `<img src="${otherAvatar}" alt="">` : escapeHtml(otherName[0]?.toUpperCase() || '?')}
            </div>
            <div class="chat-info">
              <div class="chat-name">⭐ ${escapeHtml(otherName)}</div>
              <div class="chat-last" style="color:var(--text-secondary);">Избранный контакт</div>
            </div>
            <button class="more-btn" data-rem="${escapeHtml(chatId)}" title="Убрать из избранного">★</button>
          </div>`;
      }));
      html = rows.join('');
    }

    screen.innerHTML = `
      <div class="header"><h2>⭐ Избранные</h2></div>
      <div class="list" id="favList">${html}</div>`;

    screen.querySelectorAll('.chat-item').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.more-btn')) return;
        openChat(el.dataset.id);
      });
    });
    screen.querySelectorAll('[data-rem]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFavourite(btn.dataset.rem);
        renderFavourites();
      });
    });
  }

  async function showGroupInfo(groupId, group) {
    const memberIds = Object.keys(group.members || {});
    const membersData = [];
    for (const uid of memberIds) {
      const s = await get(ref(db, `users/${uid}`));
      membersData.push(s.val() || { name: 'Пользователь', uid });
    }
    showModal(`
      <h3>ℹ️ ${escapeHtml(group.name || 'Группа')}</h3>
      <p><b>Участники (${memberIds.length}):</b></p>
      ${membersData.map(m => `<p>• ${escapeHtml(m.name || 'Пользователь')} @${escapeHtml(m.username || '—')}</p>`).join('')}
      <p style="font-size:0.7rem;color:var(--text-secondary);">Создана: ${group.createdAt ? new Date(group.createdAt).toLocaleString() : 'Неизвестно'}</p>
      <p style="font-size:0.7rem;color:var(--text-secondary);">ID: ${escapeHtml(groupId)}</p>
      <button class="btn secondary" id="closeGroupInfoBtn">Закрыть</button>`);
    document.getElementById('closeGroupInfoBtn').addEventListener('click', closeModal);
  }

  async function leaveGroup(groupId) {
    if (!window.currentUser || !groupId) return;
    if (!confirm('Вы уверены, что хотите покинуть группу?')) return;
    try {
      const snap = await get(ref(db, `groups/${groupId}/members`));
      const members = snap.val() || {};
      delete members[window.currentUser.uid];
      if (Object.keys(members).length === 0) {
        await remove(ref(db, `groups/${groupId}`));
      } else {
        await update(ref(db, `groups/${groupId}`), { members });
      }
      await remove(ref(db, `user_chats/${window.currentUser.uid}/${groupId}`));
      toast('Вы покинули группу');
      renderGroups();
    } catch (e) {
      toast('Ошибка', 'error');
    }
  }

  function createGroup() {
    showModal(`
      <h3>Новая группа</h3>
      <input placeholder="Название группы" id="groupName" maxlength="50"
             style="width:100%;padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);">
      <input placeholder="@username участника" id="groupMember" autocomplete="off"
             style="width:100%;padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);">
      <div id="groupMembersList" style="display:flex;flex-wrap:wrap;gap:4px;"></div>
      <button class="btn" id="addMemberBtn">Добавить участника</button>
      <button class="btn" id="createGroupFinalBtn">Создать группу</button>
      <button class="btn secondary" id="closeGroupModalBtn">Закрыть</button>`);

    let members = [window.currentUser.uid];
    let usersCache = {};

    const loadUsers = async () => {
      const s = await get(ref(db, 'users'));
      usersCache = s.val() || {};
    };
    loadUsers();

    const renderMembersList = () => {
      const list = document.getElementById('groupMembersList');
      if (!list) return;
      list.innerHTML = members.slice(1).map(uid => {
        const u = usersCache[uid] || {};
        return `<span style="background:var(--accent);color:white;padding:4px 10px;border-radius:14px;font-size:0.8rem;">
          @${escapeHtml(u.username || '?')} <span style="cursor:pointer;margin-left:4px;" data-remove="${uid}">✕</span>
        </span>`;
      }).join('');
      list.querySelectorAll('[data-remove]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          members = members.filter(m => m !== el.dataset.remove);
          renderMembersList();
        });
      });
    };

    document.getElementById('addMemberBtn').addEventListener('click', async () => {
      const uname = document.getElementById('groupMember')?.value.trim().replace('@', '').toLowerCase();
      if (!uname) return toast('Введите @username', 'error');
      if (Object.keys(usersCache).length === 0) await loadUsers();
      const found = Object.entries(usersCache).find(([uid, u]) =>
        (u.username || '').toLowerCase() === uname && uid !== window.currentUser.uid
      );
      if (!found) return toast('Пользователь не найден', 'error');
      if (members.includes(found[0])) return toast('Уже добавлен', 'warning');
      members.push(found[0]);
      renderMembersList();
      const inp = document.getElementById('groupMember');
      if (inp) inp.value = '';
    });

    document.getElementById('createGroupFinalBtn').addEventListener('click', async () => {
      const name = document.getElementById('groupName')?.value.trim() || 'Новая группа';
      if (members.length < 2) return toast('Минимум 2 участника', 'error');
      try {
        const groupRef = push(ref(db, 'groups'));
        const memberObj = {};
        members.forEach(uid => { memberObj[uid] = true; });
        await set(groupRef, { name, members: memberObj, createdBy: window.currentUser.uid, createdAt: Date.now() });
        for (const uid of members) {
          await set(ref(db, `user_chats/${uid}/${groupRef.key}`), {
            chatId: groupRef.key, name, type: 'group',
            lastMessage: 'Группа создана', lastMessageTime: Date.now(), unreadCount: 0
          });
        }
        closeModal();
        toast(`Группа "${name}" создана!`);
        switchScreen('groups');
      } catch (e) {
        toast('Ошибка создания группы: ' + e.message, 'error');
      }
    });

    document.getElementById('closeGroupModalBtn').addEventListener('click', closeModal);
  }

  function openGroupChat(groupId) {
    if (!groupId || !window.currentUser) return;
    // Clean up previous chat listeners
    if (chatTypingUnsubscribe) { try { chatTypingUnsubscribe(); } catch(e) {} chatTypingUnsubscribe = null; }
    if (chatOnlineUnsubscribe) { try { chatOnlineUnsubscribe(); } catch(e) {} chatOnlineUnsubscribe = null; }
    window.currentChat = groupId;
    switchScreen('chat');
    if (chatListeners[groupId]) { try { chatListeners[groupId](); } catch (e) {} }
    get(ref(db, `groups/${groupId}`)).then(snap => {
      const group = snap.val() || {};
      loadChatMessages(groupId, group.name || 'Группа', true);
    });

    // Typing indicator listener for group
    chatTypingUnsubscribe = onValue(ref(db, `typing/${groupId}`), (snap) => {
      const typing = snap.val() || {};
      const others = Object.keys(typing).filter(uid => uid !== window.currentUser?.uid);
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.style.display = others.length > 0 ? 'flex' : 'none';
    });
  }

  async function showUserInfo(uid) {
    if (!uid) return;
    try {
      const snap = await get(ref(db, `users/${uid}`));
      const u = snap.val() || {};
      showModal(`
        <h3>Информация о пользователе</h3>
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
          <div class="profile-avatar">
            ${u.avatarBase64 ? `<img src="${u.avatarBase64}" alt="avatar">` : `<span>${escapeHtml((u.name || '?')[0]?.toUpperCase() || '?')}</span>`}
          </div>
          <div class="profile-name">${escapeHtml(u.name || 'Пользователь')}</div>
          <div class="profile-username">@${escapeHtml(u.username || '—')}</div>
          <div style="font-size:0.85rem;color:var(--text-secondary);">${escapeHtml(u.email || 'Email не указан')}</div>
          <div style="font-size:0.85rem;color:var(--text-secondary);">Статус: ${u.online ? '🟢 В сети' : '⚫ Не в сети'}</div>
        </div>
        <button class="btn" id="blockUserBtn">🚫 Заблокировать</button>
        ${window.isAdmin ? `<button class="btn danger" id="adminBanBtn">👑 Забанить</button>` : ''}
        <button class="btn secondary" id="closeUserInfoBtn">Закрыть</button>`);
      document.getElementById('closeUserInfoBtn').addEventListener('click', closeModal);
      document.getElementById('blockUserBtn').addEventListener('click', () => {
        if (!blockedUsers.includes(uid)) {
          blockedUsers.push(uid);
          localStorage.setItem('p1xx_blockedUsers', JSON.stringify(blockedUsers));
          toast('Пользователь заблокирован', 'error');
        } else {
          toast('Уже заблокирован', 'warning');
        }
        closeModal();
      });
      if (window.isAdmin) {
        const adminBanBtn = document.getElementById('adminBanBtn');
        if (adminBanBtn) adminBanBtn.addEventListener('click', () => {
          banUser(uid);
          closeModal();
        });
      }
    } catch (e) {
      toast('Ошибка загрузки информации', 'error');
    }
  }

  function openChat(chatId) {
    if (!chatId || !window.currentUser) return;
    // Clean up previous chat listeners
    if (chatTypingUnsubscribe) { try { chatTypingUnsubscribe(); } catch(e) {} chatTypingUnsubscribe = null; }
    if (chatOnlineUnsubscribe) { try { chatOnlineUnsubscribe(); } catch(e) {} chatOnlineUnsubscribe = null; }
    window.currentChat = chatId;
    switchScreen('chat');
    if (chatListeners[chatId]) { try { chatListeners[chatId](); } catch (e) {} }
    const chatName = chatNames[chatId] || 'Чат';
    const otherUid = chatId.includes('_') ? chatId.split('_').find(uid => uid !== window.currentUser?.uid) : null;
    loadChatMessages(chatId, chatName, false, otherUid);
    loadDraftForChat(chatId);
    // Start heat wallpaper if it was selected
    if (currentWallpaper === '__heat__') startHeatWallpaper(chatId);

    // Typing indicator listener (set up once per chat session)
    chatTypingUnsubscribe = onValue(ref(db, `typing/${chatId}`), (snap) => {
      const typing = snap.val() || {};
      const others = Object.keys(typing).filter(uid => uid !== window.currentUser?.uid);
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.style.display = others.length > 0 ? 'flex' : 'none';
    });

    // Online status listener (set up once per chat session)
    if (otherUid) {
      chatOnlineUnsubscribe = onValue(ref(db, `users/${otherUid}/online`), (snap) => {
        const dot = document.getElementById('onlineDot');
        if (dot) dot.className = 'online-dot ' + (snap.val() ? '' : 'offline');
      });
    }
  }

  function loadChatMessages(chatId, chatName, isGroup = false, otherUid = null) {
    const msgsRef = ref(db, `messages/${chatId}`);
    const chatQuery = query(msgsRef, orderByChild('timestamp'), limitToLast(isGroup ? 100 : 50));

    if (chatListeners[chatId]) { try { chatListeners[chatId](); } catch (e) {} }

    chatListeners[chatId] = onValue(chatQuery, async (snap) => {
      const msgs = snap.val() || {};
      const sorted = Object.values(msgs)
        .filter(m => !(m.deletedFor && m.deletedFor[window.currentUser?.uid]))
        .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

      for (const m of sorted) {
        if (m.uid !== window.currentUser?.uid && !m.read) {
          await update(ref(db, `messages/${chatId}/${m.id}`), { read: true }).catch(() => {});
        }
        if (isGroup && m.uid !== window.currentUser?.uid) {
          const rbSnap = await get(ref(db, `messages/${chatId}/${m.id}/readBy`));
          const readBy = rbSnap.val() || {};
          if (!readBy[window.currentUser.uid]) {
            await update(ref(db, `messages/${chatId}/${m.id}`), {
              [`readBy/${window.currentUser.uid}`]: Date.now()
            }).catch(() => {});
            m.readBy = { ...readBy, [window.currentUser.uid]: Date.now() };
          } else {
            m.readBy = readBy;
          }
        }
      }

      if (sorted.length > 0) {
        const last = sorted[sorted.length - 1];
        const isNew = last.timestamp && last.timestamp > (window._lastSeenTimestamp || 0);
        if (last.uid !== window.currentUser?.uid && isNew) {
          window._lastSeenTimestamp = last.timestamp;
          sendNotification(last.name || 'P1XX', last.audioBase64 ? '🎤 Голосовое сообщение' : (last.text || '').slice(0, 80), chatId);
        }
      }

      // Pre-cache profiles for reactions avatars
      const allUids = [...new Set(sorted.flatMap(m => Object.keys(m.reactions || {})))];
      if (!window._reactionProfiles) window._reactionProfiles = {};
      for (const uid of allUids) {
        if (!window._reactionProfiles[uid]) {
          try {
            const ps = await get(ref(db, `users/${uid}`));
            window._reactionProfiles[uid] = ps.val() || {};
          } catch(e) { window._reactionProfiles[uid] = {}; }
        }
      }

      // Сохраняем позицию скролла до перерисовки
      const container = document.getElementById('msgContainer');
      const prevScrollTop = container ? container.scrollTop : 0;
      const prevScrollHeight = container ? container.scrollHeight : 0;
      const wasNearBottom = container ? (container.scrollTop + container.clientHeight >= container.scrollHeight - 50) : false;
      const isInitialLoad = currentMessages.length === 0;
      
      // СОХРАНЯЕМ ТЕКУЩЕЕ КОЛИЧЕСТВО СООБЩЕНИЙ
      const prevMsgCount = currentMessages.length; 

      currentMessages = sorted;
      oldestTimestamp = sorted.length > 0 ? sorted[0].timestamp : null;
      renderChatMessages(sorted, chatName, otherUid, false, isGroup);

      // Восстанавливаем скролл после перерисовки
      const newContainer = document.getElementById('msgContainer');
      if (newContainer) {
        newContainer.style.scrollBehavior = 'auto';
        if (isInitialLoad) {
          newContainer.scrollTop = newContainer.scrollHeight;
        } else if (sorted.length === prevMsgCount) {
          newContainer.scrollTop = prevScrollTop;
        } else {
          const newScrollHeight = newContainer.scrollHeight;
          if (wasNearBottom) {
            newContainer.scrollTop = newContainer.scrollHeight;
          } else {
            const heightDiff = newScrollHeight - prevScrollHeight;
            newContainer.scrollTop = prevScrollTop + heightDiff;
          }
        }
        requestAnimationFrame(() => { newContainer.style.scrollBehavior = ''; });
      }

      await update(ref(db, `user_chats/${window.currentUser.uid}/${chatId}`), { unreadCount: 0 }).catch(() => {});
    });
  }

  async function loadOlderMessages() {
    if (!window.currentChat || loadingMore || !oldestTimestamp) return;
    loadingMore = true;
    const chatId = window.currentChat;
    const msgsRef = ref(db, `messages/${chatId}`);
    const container = document.getElementById('msgContainer');
    const prevScrollHeight = container ? container.scrollHeight : 0;
    const olderQuery = query(msgsRef, orderByChild('timestamp'), endAt(oldestTimestamp - 1), limitToLast(50));
    try {
      const snap = await get(olderQuery);
      const msgs = snap.val() || {};
      const older = Object.values(msgs)
        .filter(m => !(m.deletedFor && m.deletedFor[window.currentUser?.uid]))
        .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
      if (older.length === 0) {
        toast('Загружены все сообщения', 'success');
        loadingMore = false;
        return;
      }
      const merged = [...older, ...currentMessages].reduce((acc, m) => {
        if (!acc.find(x => x.id === m.id)) acc.push(m);
        return acc;
      }, []).sort((a, b) => a.timestamp - b.timestamp);
      currentMessages = merged;
      oldestTimestamp = merged.length > 0 ? merged[0].timestamp : null;
      const otherUid = chatId.includes('_') ? chatId.split('_').find(uid => uid !== window.currentUser?.uid) : null;
      renderChatMessages(merged, chatNames[chatId] || 'Чат', otherUid, false);
      const newContainer = document.getElementById('msgContainer');
      if (newContainer) {
        newContainer.style.scrollBehavior = 'auto';
        newContainer.scrollTop = newContainer.scrollHeight - prevScrollHeight;
        requestAnimationFrame(() => { newContainer.style.scrollBehavior = ''; });
      }
    } catch (e) {
      toast('Ошибка загрузки старых сообщений', 'error');
    }
    loadingMore = false;
  }

  function renderChatMessages(sorted, chatName, otherUid, scrollToBottom, isGroup = false) {
    let messagesHTML = '';

    if (sorted.length > 0) {
      if (oldestTimestamp && sorted.length >= (isGroup ? 100 : 50)) {
        messagesHTML += `<div style="text-align:center;padding:6px;"><button class="btn secondary" id="loadMoreBtn" style="font-size:0.75rem;">Загрузить ещё</button></div>`;
      }
      messagesHTML += sorted.map(m => {
        const isMine = m.uid === window.currentUser?.uid;
        const time = formatTime(m.timestamp);
        const fwd = m.forwarded ? '↩️ ' : '';
        const edited = m.edited ? ' (изм.)' : '';

        const pollHTML = m.isPoll && m.poll ? (() => {
          const poll = m.poll;
          const totalVotes = Object.keys(poll.votes || {}).length;
          const myVote = (poll.votes || {})[window.currentUser?.uid];
          return `<div class="poll-bubble">
            <div class="poll-title">📊 ${escapeHtml(poll.question || '')}</div>
            ${(poll.options || []).map((opt, i) => {
              const vCount = Object.values(poll.votes || {}).filter(v => v === i).length;
              const pct = totalVotes ? Math.round(vCount / totalVotes * 100) : 0;
              return `<div class="poll-option ${myVote === i ? 'voted' : ''}" data-poll-vote="${m.id}" data-poll-opt="${i}">
                <div class="poll-option-fill" style="width:${myVote !== undefined ? pct : 0}%"></div>
                <div class="poll-option-text"><span>${escapeHtml(opt)}</span>${myVote !== undefined ? `<span>${pct}%</span>` : ''}</div>
              </div>`;
            }).join('')}
            <div class="poll-votes">${totalVotes} ${totalVotes === 1 ? 'голос' : 'голосов'}</div>
          </div>`;
        })() : '';

        const replyHTML = m.replyToId
          ? `<div class="reply-preview-in-msg" data-reply-to="${escapeHtml(m.replyToId)}"><small style="color:var(--accent);">↩️ ${escapeHtml(m.replyToName || '')}</small><div>${escapeHtml((m.replyToText || '').slice(0, 60))}</div></div>`
          : '';

        const imageHTML = m.imageBase64
          ? `<img src="${m.imageBase64}" class="image-in-msg" alt="фото" data-image-base64="${m.imageBase64}">`
          : '';

        const audioHTML = m.audioBase64
          ? `<div class="audio-msg"><span>🎤</span><audio controls preload="none"><source src="${m.audioBase64}" type="${m.audioMime || 'audio/webm'}"></audio>${m.audioDuration ? `<span style="font-size:0.7rem;opacity:0.7;">${m.audioDuration}с</span>` : ''}</div>`
          : '';

        // Build reactions HTML with per-emoji groups showing avatars
        let reactionsHTML = '';
        if (m.reactions && Object.keys(m.reactions).length > 0) {
          // Group by emoji: { emoji: [{uid, avatar, name}] }
          const groups = {};
          Object.entries(m.reactions).forEach(([uid, emoji]) => {
            if (!groups[emoji]) groups[emoji] = [];
            groups[emoji].push(uid);
          });
          const myUid = window.currentUser?.uid;
          const groupsHTML = Object.entries(groups).map(([emoji, uids]) => {
            const isMine = uids.includes(myUid);
            const avatarsHTML = uids.slice(0, 3).map(uid => {
              const prof = window._reactionProfiles?.[uid];
              return `<div class="reaction-mini-av" style="background:${avatarColor(uid)};" data-uid="${uid}">${prof?.avatarBase64 ? `<img src="${prof.avatarBase64}">` : escapeHtml((prof?.name || uid)[0]?.toUpperCase() || '?')}</div>`;
            }).join('');
            return `<span class="reaction-group ${isMine ? 'mine' : ''}" data-emoji="${escapeHtml(emoji)}" data-msg-id="${escapeHtml(m.id || '')}"><span class="reaction-emoji">${emoji}</span><span class="reaction-avatars">${avatarsHTML}</span></span>`;
          }).join('');
          reactionsHTML = `<div class="reactions">${groupsHTML}</div>`;
        }
        let readByHTML = '';
        if (isGroup && m.readBy) {
          const readers = Object.keys(m.readBy).filter(uid => uid !== m.uid);
          if (readers.length > 0) {
            readByHTML = `<div class="read-avatars">${readers.slice(0, 5).map(uid =>
              `<div class="mini-avatar" style="background:${avatarColor(uid)};">${escapeHtml((uid || '?')[0]?.toUpperCase() || '?')}</div>`
            ).join('')}</div>`;
          }
        }

        return `
          <div class="message-container ${isMine ? 'outgoing' : 'incoming'}">
            <div class="bubble" data-msg-id="${escapeHtml(m.id || '')}">
              ${replyHTML}
              ${imageHTML}
              ${audioHTML}
              ${pollHTML}
              <span class="text-content">
                ${m.audioBase64 || m.isPoll
                  ? ''
                  : m.isSticker
                    ? `<span class="sticker-in-msg">${escapeHtml(m.text)}</span>`
                    : `${fwd}${escapeHtml(m.text || '')}${edited}`}
              </span>
              <span class="meta">
                ${time}
                ${isMine ? `<span class="msg-status${m.read ? ' read' : ''}">${m.read ? '✓✓' : '✓'}</span>` : ''}
              </span>
              ${reactionsHTML}
            </div>
            ${readByHTML}
          </div>`;
      }).join('');
    } else {
      messagesHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);">Нет сообщений. Напишите первое!</div>';
    }

    document.getElementById('chatScreen').innerHTML = `
      <div class="header">
        <span class="icon-btn" id="backChatBtn">←</span>
        ${otherUid ? `<span class="header-avatar" id="headerChatAvatar"></span>` : ''}
        <h2 id="headerChatName"><span id="headerNameSpan">${escapeHtml(chatName)}</span>${otherUid ? ' <span id="onlineDot" class="online-dot offline"></span>' : ''}</h2>
        <span class="icon-btn" id="stickerBtn" title="Стикеры">😀</span>
        <span class="icon-btn" id="imageUploadBtn" title="Фото">📷</span>
        <span class="icon-btn" id="wallpaperChatBtn" title="Обои">🖼️</span>
        <span class="icon-btn" id="chatInfoBtn" title="Инфо">ⓘ</span>
        <span class="icon-btn" id="searchMsgBtn" title="Поиск в чате">🔍</span>
      </div>
      <div class="messages-container" id="msgContainer">
        ${messagesHTML}
        <div id="typingIndicator" class="typing-indicator" style="display:none;">
          <span style="font-size:0.75rem;color:var(--text-secondary);">печатает</span>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
      <div class="input-area no-nav">
        <input id="msgInput" placeholder="Сообщение..." maxlength="5000" autocomplete="off">
        <span class="icon-btn" id="sendMsgBtn">➤</span>
        <span class="icon-btn" id="voiceMsgBtn">🎤</span>
        <span class="icon-btn" id="attachFileBtn">📎</span>
      </div>`;

    applyWallpaper(currentWallpaper);

    const msgContainer = document.getElementById('msgContainer');

    if (otherUid) {
      get(ref(db, `users/${otherUid}`)).then(snap => {
        const u = snap.val() || {};
        // Fix: update only the name span, NOT the entire h2 (which would destroy the onlineDot span)
        const nameSpan = document.getElementById('headerNameSpan');
        const hAvatar = document.getElementById('headerChatAvatar');
        if (nameSpan) nameSpan.textContent = u.name || 'Пользователь';
        if (hAvatar) {
          if (u.avatarBase64) {
            hAvatar.innerHTML = `<img src="${u.avatarBase64}" alt="avatar">`;
          } else {
            hAvatar.style.background = avatarColor(u.name || '?');
            hAvatar.textContent = (u.name || '?')[0]?.toUpperCase() || '?';
          }
          hAvatar.onclick = () => showUserInfo(otherUid);
        }
      });
    }

    document.getElementById('backChatBtn').addEventListener('click', () => {
      window.currentChat = null;
      switchScreen('chats');
    });
    document.getElementById('sendMsgBtn').addEventListener('click', sendMessage);

    const msgInput = document.getElementById('msgInput');
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    msgInput.addEventListener('input', () => {
      if (window.currentChat) {
        setTypingIndicator(window.currentChat);
        saveDraft(window.currentChat, msgInput.value);
      }
    });

    document.getElementById('stickerBtn').addEventListener('click', showStickerPanel);
    document.getElementById('imageUploadBtn').addEventListener('click', triggerImageUpload);
    document.getElementById('wallpaperChatBtn').addEventListener('click', showWallpaperModal);
    document.getElementById('chatInfoBtn').addEventListener('click', () => showChatInfo(window.currentChat, chatName, otherUid));
    document.getElementById('voiceMsgBtn').addEventListener('click', recordVoiceMessage);
    document.getElementById('attachFileBtn').addEventListener('click', triggerFileUpload);
    document.getElementById('searchMsgBtn').addEventListener('click', toggleMessageSearch);

    const loadMoreBtn = document.getElementById('loadMoreBtn');
    if (loadMoreBtn) loadMoreBtn.addEventListener('click', loadOlderMessages);

    document.querySelectorAll('.image-in-msg').forEach(img => {
      img.addEventListener('click', (e) => {
        e.stopPropagation();
        if (img.dataset.imageBase64) viewFullImage(img.dataset.imageBase64);
      });
    });

    document.querySelectorAll('.bubble').forEach(bubble => {
      let longPressTimer;
      bubble.addEventListener('touchstart', () => {
        longPressTimer = setTimeout(() => {
          const msgId = bubble.dataset.msgId;
          if (msgId) showMessageActions(msgId);
        }, 500);
      });
      bubble.addEventListener('touchend', () => clearTimeout(longPressTimer));
      bubble.addEventListener('touchmove', () => clearTimeout(longPressTimer));
      bubble.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const msgId = bubble.dataset.msgId;
        if (msgId) showMessageActions(msgId);
      });
    });

    // Poll vote handlers
    document.querySelectorAll('[data-poll-vote]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        votePoll(el.dataset.pollVote, parseInt(el.dataset.pollOpt));
      });
    });

    // Reply preview click → scroll to original message
    document.querySelectorAll('.reply-preview-in-msg[data-reply-to]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const targetId = el.dataset.replyTo;
        const targetBubble = document.querySelector(`.bubble[data-msg-id="${targetId}"]`);
        if (targetBubble) {
          targetBubble.scrollIntoView({ behavior: 'smooth', block: 'center' });
          targetBubble.style.transition = 'background 0.3s';
          const origBg = targetBubble.style.background;
          targetBubble.style.background = 'rgba(0,122,255,0.25)';
          setTimeout(() => { targetBubble.style.background = origBg; }, 1200);
        }
      });
    });

    // Reaction groups click handler — new logic with avatars
    document.querySelectorAll('.bubble .reactions .reaction-group').forEach(el => {
      el.addEventListener('click', async (e) => {
        e.stopPropagation();
        const emoji = el.dataset.emoji;
        const msgId = el.dataset.msgId;
        if (!emoji || !msgId) return;
        const snap = await get(ref(db, `messages/${window.currentChat}/${msgId}/reactions`));
        const reactions = snap.val() || {};
        const myUid = window.currentUser?.uid;
        if (reactions[myUid] === emoji) {
          // Own reaction — remove it
          delete reactions[myUid];
        } else {
          // Someone else's reaction — copy it
          reactions[myUid] = emoji;
        }
        await update(ref(db, `messages/${window.currentChat}/${msgId}`), { reactions });
      });
    });
  }

  async function updateChatMetadata(chatId, lastMessage, timestamp) {
    if (!chatId || !db) return;
    try {
      await update(ref(db, `chats/${chatId}`), { lastMessage, lastMessageTime: timestamp });
      const chatSnap = await get(ref(db, `chats/${chatId}`));
      const chatData = chatSnap.val() || {};
      const participants = chatData.participants || [];
      for (const uid of participants) {
        if (!uid) continue;
        const uSnap = await get(ref(db, `user_chats/${uid}/${chatId}`));
        const curr = uSnap.val() || {};
        const currUnread = curr.unreadCount || 0;
        await update(ref(db, `user_chats/${uid}/${chatId}`), {
          lastMessage,
          lastMessageTime: timestamp,
          unreadCount: uid === window.currentUser?.uid ? 0 : currUnread + 1
        });
      }
    } catch (e) {
      console.error('Metadata update error:', e);
    }
  }

  function triggerImageUpload() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) return toast('Изображение слишком большое (макс 5MB)', 'error');
      const reader = new FileReader();
      reader.addEventListener('load', (ev) => {
        const img = new Image();
        img.src = ev.target.result;
        img.addEventListener('load', async () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          const maxW = 800, maxH = 800;
          if (w > maxW || h > maxH) {
            const ratio = Math.min(maxW / w, maxH / h);
            w *= ratio; h *= ratio;
          }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          await sendImageMessage(canvas.toDataURL('image/jpeg', 0.7));
        });
      });
      reader.readAsDataURL(file);
    });
    input.click();
  }

  function triggerFileUpload() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '*/*';
    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) return toast('Файл слишком большой (макс 10MB)', 'error');
      const reader = new FileReader();
      reader.addEventListener('load', (ev) => sendFileMessage(ev.target.result, file.name));
      reader.readAsDataURL(file);
    });
    input.click();
  }

  function recordVoiceMessage() {
    if (!window.MediaRecorder) return toast('Голосовые сообщения не поддерживаются в этом браузере', 'error');
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      // Pick the best supported MIME type (iOS Safari needs mp4/aac)
      const mimeType = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4']
        .find(t => MediaRecorder.isTypeSupported(t)) || '';
      const recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        stream.getTracks().forEach(t => t.stop());
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const base64 = ev.target.result;
          if (!window.currentChat || !window.currentUser) return;
          try {
            const snap = await get(ref(db, `users/${window.currentUser.uid}`));
            const user = snap.val() || {};
            const msgId = push(ref(db, 'messages')).key;
            const msg = {
              id: msgId,
              text: '🎤 Голосовое сообщение',
              audioBase64: base64,
              audioMime: recorder.mimeType || 'audio/webm',
              audioDuration: Math.round((Date.now() - voiceStartTime) / 1000),
              uid: window.currentUser.uid,
              name: user.name || 'User',
              username: user.username || '',
              timestamp: Date.now(),
              read: false,
              reactions: {}
            };
            if (replyToMessage) {
              msg.replyToId = replyToMessage.id;
              msg.replyToText = replyToMessage.text;
              msg.replyToName = replyToMessage.name;
              replyToMessage = null;
              const rp = document.getElementById('replyPreview');
              if (rp) rp.remove();
            }
            await set(ref(db, `messages/${window.currentChat}/${msgId}`), msg);
            await updateChatMetadata(window.currentChat, '🎤 Голосовое сообщение', msg.timestamp);
            playMessageSound();
            toast('Голосовое сообщение отправлено 🎤');
          } catch (e) { toast('Ошибка отправки голосового', 'error'); }
        };
        reader.readAsDataURL(blob);
      };
      recorder.start(100); // collect in 100ms chunks for better reliability
      const voiceStartTime = Date.now();
      toast('🔴 Запись... Нажмите 🎤 снова для остановки');
      const voiceBtn = document.getElementById('voiceMsgBtn');
      const stopRecording = () => {
        if (recorder.state === 'recording') recorder.stop();
        voiceBtn.removeEventListener('click', stopRecording);
        voiceBtn.addEventListener('click', recordVoiceMessage, { once: true });
        toast('Запись завершена ✅');
      };
      voiceBtn.removeEventListener('click', recordVoiceMessage);
      voiceBtn.addEventListener('click', stopRecording, { once: true });
      setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 60000);
    }).catch(() => toast('Нет доступа к микрофону', 'error'));
  }

  function handleAvatarUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) return toast('Файл слишком большой (макс 5MB)', 'error');
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.src = ev.target.result;
      img.onload = async () => {
        const canvas = document.createElement('canvas');
        canvas.width = 200; canvas.height = 200;
        canvas.getContext('2d').drawImage(img, 0, 0, 200, 200);
        const base64 = canvas.toDataURL('image/jpeg', 0.8);
        try {
          await update(ref(db, `users/${window.currentUser.uid}`), { avatarBase64: base64 });
          window.userProfile.avatarBase64 = base64;
          toast('Аватар обновлён!');
          renderSettings();
        } catch (err) { toast('Ошибка загрузки', 'error'); }
      };
    };
    reader.readAsDataURL(file);
  }

      const users = snap.val() || {};
      const exists = Object.entries(users).some(([uid, u]) => u.username === username && uid !== window.currentUser.uid);

      try {
        await update(ref(db, `users/${window.currentUser.uid}`), { username });

        toast('Юзернейм обновлён!');

    });

    const h = parseInt(localStorage.getItem('p1xx_navHeight') || '62');
    const w = parseInt(localStorage.getItem('p1xx_navWidth') || '0');
    pill.style.height = h + 'px';
    if (w > 0) {
      pill.style.left = w + 'px';
      pill.style.right = w + 'px';
    } else {
      pill.style.left = '12px';
      pill.style.right = '12px';

  // ── Service Worker for background notifications ──────────────────────────
  let swRegistration = null;
  (async () => {
    if (!('serviceWorker' in navigator)) return;
    const swCode = `
self.addEventListener('install', () => self.skipWaiting());
self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
self.addEventListener('push', e => {
  let d = {};
  try { d = e.data ? e.data.json() : {}; } catch(_) {}
  e.waitUntil(self.registration.showNotification(d.title || 'P1XX', {
    body: d.body || 'Новое сообщение',
    icon: d.icon || '',
    badge: d.icon || '',
    tag: d.tag || 'p1xx',
    data: d
  }));
});
self.addEventListener('notificationclick', e => {
  e.notification.close();
  e.waitUntil(clients.matchAll({type:'window',includeUncontrolled:true}).then(cs => {
    if (cs.length) return cs[0].focus();
    return clients.openWindow('/');
  }));
});
self.addEventListener('message', e => {
  if (e.data?.type === 'SHOW_NOTIFICATION') {
    self.registration.showNotification(e.data.title || 'P1XX', {
      body: e.data.body || '',
      icon: e.data.icon || '',
      tag: e.data.tag || 'p1xx-msg',
      vibrate: [100, 50, 100],
      data: e.data
    });
  }
});`;
    try {
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      swRegistration = await navigator.serviceWorker.register(swUrl, { scope: '/' });
      await navigator.serviceWorker.ready;
    } catch(e) { console.warn('SW registration failed:', e); }
  })();

  async function renderStoryStrip() {
    const container = document.getElementById('storyStripContainer');
    if (!container || !window.currentUser) return;

    // Load statuses of contacts from Firebase
    let storyItems = [];
    try {
      const userChatsSnap = await get(ref(db, `user_chats/${window.currentUser.uid}`));
      const userChats = userChatsSnap.val() || {};
      const uids = new Set();
      Object.keys(userChats).forEach(chatId => {
        if (chatId.includes('_')) chatId.split('_').forEach(u => uids.add(u));
      });
      uids.delete(window.currentUser.uid);

      const statusSnap = await get(ref(db, 'statuses'));
      const statuses = statusSnap.val() || {};
      const now = Date.now();
      const DAY = 24 * 3600 * 1000;

      for (const uid of uids) {
        const st = statuses[uid];
        if (st && (now - (st.updatedAt || 0)) < DAY) {
          const uSnap = await get(ref(db, `users/${uid}`));
          const u = uSnap.val() || {};
          const seen = (st.seenBy || {})[window.currentUser.uid];
          storyItems.push({ uid, name: u.name || 'User', avatar: u.avatarBase64 || '', emoji: st.emoji || '✨', text: st.text || '', seen: !!seen, updatedAt: st.updatedAt });
        }
      }
      storyItems.sort((a, b) => (a.seen ? 1 : 0) - (b.seen ? 1 : 0));
    } catch(e) {}

    // My status
    const myStatusSnap = await get(ref(db, `statuses/${window.currentUser.uid}`)).catch(() => ({ val: () => null }));
    const myStatus = myStatusSnap.val();

    const myAvatarHtml = window.userProfile?.avatarBase64
      ? `<img src="${window.userProfile.avatarBase64}" alt="">`
      : `<span style="font-size:1.3rem;">${(window.userProfile?.name || '?')[0]}</span>`;

    const strip = `<div class="story-strip">
      <div class="story-item" id="myStoryBtn">
        <div class="story-ring ${myStatus ? '' : 'seen'}" style="${myStatus ? '' : 'background:var(--bg-tertiary)'}">
          <div class="story-ring-inner">${myAvatarHtml}</div>
        </div>
        <span class="story-name">Мой статус</span>
      </div>
      ${storyItems.map(s => `
        <div class="story-item" data-story-uid="${escapeHtml(s.uid)}">
          <div class="story-ring ${s.seen ? 'seen' : ''}">
            <div class="story-ring-inner">
              ${s.avatar ? `<img src="${s.avatar}" alt="">` : `<span style="font-size:1.3rem;">${s.emoji}</span>`}
            </div>
          </div>
          <span class="story-name">${escapeHtml(s.name)}</span>
        </div>`).join('')}
    </div>`;

    container.innerHTML = strip;

    document.getElementById('myStoryBtn')?.addEventListener('click', () => showSetStatusModal());
    container.querySelectorAll('[data-story-uid]').forEach(el => {
      el.addEventListener('click', () => viewStory(el.dataset.storyUid));
    });
  }

  function toggleMessageSearch() {
    const existing = document.getElementById('msgSearchBar');
    if (existing) { existing.remove(); return; }
    const header = document.querySelector('#chatScreen .header');
    if (!header) return;
    const bar = document.createElement('div');
    bar.id = 'msgSearchBar';
    bar.className = 'msg-search-bar';
    bar.innerHTML = `
      <input id="msgSearchInput" placeholder="🔍 Поиск в чате..." autocomplete="off">
      <div class="msg-search-nav">
        <button id="msgSearchPrev">↑</button>
        <span id="msgSearchCount" style="font-size:0.75rem;color:var(--text-secondary);min-width:36px;text-align:center;">0/0</span>
        <button id="msgSearchNext">↓</button>
        <button id="msgSearchClose" style="background:var(--danger);color:white;">✕</button>
      </div>`;
    header.insertAdjacentElement('afterend', bar);

    let matches = [], cur = 0;
    const doSearch = () => {
      // Clear previous highlights
      document.querySelectorAll('.bubble .text-content').forEach(el => {
        el.innerHTML = el.textContent;
      });
      const q = document.getElementById('msgSearchInput').value.trim().toLowerCase();
      matches = [];
      if (!q) { document.getElementById('msgSearchCount').textContent = '0/0'; return; }
      document.querySelectorAll('.bubble .text-content').forEach(el => {
        const text = el.textContent;
        if (text.toLowerCase().includes(q)) {
          const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
          el.innerHTML = text.replace(re, m => `<mark class="msg-highlight">${m}</mark>`);
          matches.push(el.closest('.bubble'));
        }
      });
      cur = 0;
      document.getElementById('msgSearchCount').textContent = `${matches.length ? 1 : 0}/${matches.length}`;
      if (matches[0]) matches[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
    document.getElementById('msgSearchInput').addEventListener('input', doSearch);
    document.getElementById('msgSearchNext').addEventListener('click', () => {
      if (!matches.length) return;
      cur = (cur + 1) % matches.length;
      matches[cur].scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.getElementById('msgSearchCount').textContent = `${cur + 1}/${matches.length}`;
    });
    document.getElementById('msgSearchPrev').addEventListener('click', () => {
      if (!matches.length) return;
      cur = (cur - 1 + matches.length) % matches.length;
      matches[cur].scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.getElementById('msgSearchCount').textContent = `${cur + 1}/${matches.length}`;
    });
    document.getElementById('msgSearchClose').addEventListener('click', () => {
      bar.remove();
      document.querySelectorAll('.bubble .text-content').forEach(el => { el.innerHTML = el.textContent; });
    });
    document.getElementById('msgSearchInput').focus();
  }

  async function votePoll(msgId, optionIndex) {

    const snap = await get(ref(db, `${path}/poll/votes`));

  // ── 5. AI РЕЗЮМЕ ЧАТА ─────────────────────────────────────────────
  async function summarizeChat() {
    if (!window.currentChat) return;
    toast('Анализирую чат... 🤖');
    try {
      const snap = await get(ref(db, `messages/${window.currentChat}`));
      const msgs = snap.val() || {};
      const sorted = Object.values(msgs).sort((a,b) => (a.timestamp||0)-(b.timestamp||0));
      const last50 = sorted.slice(-50);
      const chatText = last50.map(m => `${m.name}: ${m.text || (m.audioBase64 ? '[голосовое]' : '[медиа]')}`).join('\n');

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 300,
          system: 'Ты ассистент мессенджера P1XX. Кратко резюмируй переписку на русском языке в 2-3 предложениях. Выдели главные темы и тон общения.',
          messages: [{ role: 'user', content: `Резюмируй:\n${chatText}` }]
        })
      });
      const data = await response.json();
      const summary = data.content?.[0]?.text || 'Не удалось создать резюме';

      const container = document.getElementById('msgContainer');
      const pill = document.createElement('div');
      pill.className = 'ai-summary-pill';
      pill.innerHTML = `<strong>🤖 AI Резюме чата</strong>${escapeHtml(summary)} <span style="opacity:0.6;font-size:0.7rem;float:right;cursor:pointer;" id="closeSummary">✕</span>`;
      container?.insertAdjacentElement('afterbegin', pill);
      document.getElementById('closeSummary')?.addEventListener('click', () => pill.remove());
    } catch(e) {
      toast('Ошибка AI резюме', 'error');
    }
  }

  // ── 6. ИСЧЕЗАЮЩИЕ СООБЩЕНИЯ ──────────────────────────────────────
  async function sendDisappearingMessage(text, seconds = 30) {
    if (!window.currentChat || !window.currentUser) return;
    const snap = await get(ref(db, `users/${window.currentUser.uid}`));
    const user = snap.val() || {};
    const msgId = push(ref(db, 'messages')).key;
    const expiresAt = Date.now() + seconds * 1000;
    const msg = {
      id: msgId, text, uid: window.currentUser.uid,
      name: user.name || 'User', username: user.username || '',
      timestamp: Date.now(), read: false, reactions: {},
      disappearing: true, expiresAt
    };
    await set(ref(db, `messages/${window.currentChat}/${msgId}`), msg);
    await updateChatMetadata(window.currentChat, `⏱ ${text}`, msg.timestamp);
    // Schedule deletion
    setTimeout(async () => {
      try { await remove(ref(db, `messages/${window.currentChat}/${msgId}`)); } catch(e) {}
    }, seconds * 1000);
    toast(`Сообщение исчезнет через ${seconds}с ⏱`);
  }

  function showDisappearingMsgModal() {
    const input = document.getElementById('msgInput');
    const text = input?.value.trim();
    if (!text) return toast('Сначала напишите сообщение', 'warning');
    showModal(`
      <h3>⏱ Исчезающее сообщение</h3>
      <p style="color:var(--text-secondary);font-size:0.85rem;">«${escapeHtml(text.slice(0, 60))}»</p>
      <p style="font-size:0.82rem;">Через сколько секунд удалить?</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${[10, 30, 60, 300].map(s => `<button class="btn secondary disappear-time" data-s="${s}" style="flex:1;">${s < 60 ? s+'с' : (s/60)+'мин'}</button>`).join('')}
      </div>
      <button class="btn secondary" id="closeDisappearModal">Отмена</button>`);
    document.querySelectorAll('.disappear-time').forEach(btn => {
      btn.addEventListener('click', () => {
        sendDisappearingMessage(text, parseInt(btn.dataset.s));
        if (input) { input.value = ''; clearDraft(window.currentChat); }
        closeModal();
      });
    });
    document.getElementById('closeDisappearModal').addEventListener('click', closeModal);
  }

  // ── 7. ЗАПЛАНИРОВАННЫЕ СООБЩЕНИЯ ─────────────────────────────────
  function showScheduleMessageModal() {
    const input = document.getElementById('msgInput');
    const text = input?.value.trim();
    if (!text) return toast('Сначала напишите сообщение', 'warning');
    const now = new Date();
    now.setMinutes(now.getMinutes() + 1);
    const defaultVal = now.toISOString().slice(0, 16);
    showModal(`
      <h3>🕐 Запланировать сообщение</h3>
      <p style="color:var(--text-secondary);font-size:0.85rem;">«${escapeHtml(text.slice(0,60))}»</p>
      <input type="datetime-local" id="scheduleTime" value="${defaultVal}"
        style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--bg-tertiary);color:var(--text-primary);font-size:0.9rem;">
      <button class="btn" id="confirmScheduleBtn">📅 Запланировать</button>
      <button class="btn secondary" id="closeScheduleModal">Отмена</button>`);

    document.getElementById('confirmScheduleBtn').addEventListener('click', async () => {
      const timeVal = document.getElementById('scheduleTime').value;
      if (!timeVal) return toast('Выберите время', 'error');
      const sendAt = new Date(timeVal).getTime();
      if (sendAt <= Date.now()) return toast('Время должно быть в будущем', 'error');
      const delay = sendAt - Date.now();

      // Store scheduled in localStorage
      const scheduled = JSON.parse(localStorage.getItem('p1xx_scheduled') || '[]');
      const job = { id: Date.now(), chatId: window.currentChat, text, sendAt };
      scheduled.push(job);
      localStorage.setItem('p1xx_scheduled', JSON.stringify(scheduled));

      setTimeout(async () => {
        const snap = await get(ref(db, `users/${window.currentUser.uid}`)).catch(() => ({ val: () => ({}) }));
        const user = snap.val() || {};
        const msgId = push(ref(db, 'messages')).key;
        const msg = {
          id: msgId, text, uid: window.currentUser.uid,
          name: user.name || 'User', username: user.username || '',
          timestamp: Date.now(), read: false, reactions: {}
        };
        await set(ref(db, `messages/${job.chatId}/${msgId}`), msg).catch(() => {});
        await updateChatMetadata(job.chatId, text, msg.timestamp).catch(() => {});
        playMessageSound();
        showInAppNotification('📅 Запланированное отправлено', text.slice(0, 60));
        // Remove from scheduled
        const upd = JSON.parse(localStorage.getItem('p1xx_scheduled') || '[]').filter(j => j.id !== job.id);
        localStorage.setItem('p1xx_scheduled', JSON.stringify(upd));
      }, delay);

      if (input) { input.value = ''; clearDraft(window.currentChat); }
      const sendTime = new Date(sendAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      toast(`Отправится в ${sendTime} 📅`);
      closeModal();
    });
    document.getElementById('closeScheduleModal').addEventListener('click', closeModal);
  }

  // ── 8. СВАЙП ДЛЯ ОТВЕТА ─────────────────────────────────────────
  function setupSwipeToReply(container) {
    if (!container) return;
    container.querySelectorAll('.message-container').forEach(el => {
      let startX = null, swiping = false;
      const bubble = el.querySelector('.bubble');
      if (!bubble) return;
      const msgId = bubble.dataset.msgId;

      el.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
        swiping = false;
      }, { passive: true });

      el.addEventListener('touchmove', e => {
        if (startX === null) return;
        const dx = e.touches[0].clientX - startX;
        const isOutgoing = el.classList.contains('outgoing');
        // Outgoing: swipe left; Incoming: swipe right
        const threshold = isOutgoing ? -dx : dx;
        if (threshold > 10) {
          swiping = true;
          const move = Math.min(threshold, 60);
          bubble.style.transform = `translateX(${isOutgoing ? -move : move}px)`;
          bubble.style.transition = 'none';
          // Show arrow icon
          let icon = el.querySelector('.swipe-reply-icon');
          if (!icon) {
            icon = document.createElement('div');
            icon.className = 'swipe-reply-icon';
            icon.textContent = '↩️';
            isOutgoing ? el.prepend(icon) : el.append(icon);
          }
          icon.style.opacity = Math.min(1, move / 40).toString();
        }
      }, { passive: true });

      el.addEventListener('touchend', e => {
        bubble.style.transition = 'transform 0.25s var(--transition-smooth)';
        bubble.style.transform = '';
        const icon = el.querySelector('.swipe-reply-icon');
        if (icon) { icon.style.opacity = '0'; setTimeout(() => icon.remove(), 200); }
        if (!swiping) return;
        const dx = e.changedTouches[0].clientX - startX;
        const isOutgoing = el.classList.contains('outgoing');
        const threshold = isOutgoing ? -dx : dx;
        if (threshold > 50 && msgId) {
          const msg = currentMessages.find(m => m.id === msgId);
          if (msg) {
            replyToMessage = msg;
            const input = document.getElementById('msgInput');
            if (input) input.focus();
            // Show reply preview
            const area = document.querySelector('#chatScreen .input-area');
            const oldPreview = document.getElementById('replyPreview');
            if (oldPreview) oldPreview.remove();
            if (area) {
              const preview = document.createElement('div');
              preview.id = 'replyPreview';
              preview.style.cssText = 'padding:6px 12px;background:var(--bg-tertiary);border-left:3px solid var(--accent);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;';
              preview.innerHTML = `<div><div style="font-size:0.72rem;color:var(--accent);">↩️ ${escapeHtml(msg.name || '')}</div><div style="font-size:0.8rem;">${escapeHtml((msg.text || '').slice(0,50))}</div></div><span style="cursor:pointer;font-size:1.1rem;" id="cancelReplyBtn">✕</span>`;
              area.insertAdjacentElement('beforebegin', preview);
              document.getElementById('cancelReplyBtn')?.addEventListener('click', () => { replyToMessage = null; preview.remove(); });
            }
            if (navigator.vibrate) navigator.vibrate(30);
          }
        }
        startX = null; swiping = false;
      });
    });
  }

  // ── 9. EMOJI РЕАКЦИЯ ПО ДАБЛТАПУ ─────────────────────────────────
  function setupDoubleTapReaction(container) {
    if (!container) return;
    container.querySelectorAll('.bubble').forEach(bubble => {
      let tapTimer = null;
      bubble.addEventListener('touchend', e => {
        if (tapTimer) {
          clearTimeout(tapTimer);
          tapTimer = null;
          // Double tap — react with ❤️
          const msgId = bubble.dataset.msgId;
          if (msgId && window.currentChat && window.currentUser) {
            update(ref(db, `messages/${window.currentChat}/${msgId}/reactions`), {
              [window.currentUser.uid]: '❤️'
            });
            // Heart animation
            const heart = document.createElement('div');
            heart.textContent = '❤️';
            heart.style.cssText = `position:absolute;font-size:2rem;pointer-events:none;z-index:999;animation:heartPop 0.8s ease-out forwards;`;
            const r = bubble.getBoundingClientRect();
            heart.style.left = (e.changedTouches[0].clientX - r.left) + 'px';
            heart.style.top = (e.changedTouches[0].clientY - r.top) + 'px';
            if (!document.getElementById('heartPopStyle')) {
              const s = document.createElement('style');
              s.id = 'heartPopStyle';
              s.textContent = '@keyframes heartPop{0%{transform:scale(0);opacity:1}60%{transform:scale(1.5)}100%{transform:scale(1) translateY(-30px);opacity:0}}';
              document.head.appendChild(s);
            }
            bubble.style.position = 'relative';
            bubble.appendChild(heart);
            setTimeout(() => heart.remove(), 800);
          }
        } else {
          tapTimer = setTimeout(() => { tapTimer = null; }, 280);
        }
      });
    });
  }

  // Хук в renderChatMessages для новых функций
  const _origRenderChat = renderChatMessages;
  function renderChatMessages(...args) {
    _origRenderChat(...args);
    const container = document.getElementById('msgContainer');
    if (container) {
      setupSwipeToReply(container);
      setupDoubleTapReaction(container);
      // Render poll bubbles
      container.querySelectorAll('.bubble[data-is-poll]').forEach(b => {
        // handled inline via innerHTML
      });
    }
  }

  // Добавляем кнопки к input area
  function enhanceChatInput() {
    const area = document.querySelector('#chatScreen .input-area');
    if (!area || document.getElementById('quickReplyBtn')) return;

    const qBtn = document.createElement('span');
    qBtn.id = 'quickReplyBtn';
    qBtn.className = 'icon-btn';
    qBtn.title = 'Быстрые ответы';
    qBtn.textContent = '⚡';
    qBtn.addEventListener('click', showQuickReplies);

    const moreBtn = document.createElement('span');
    moreBtn.id = 'chatMoreActionsBtn';
    moreBtn.className = 'icon-btn';
    moreBtn.title = 'Ещё';
    moreBtn.textContent = '＋';
    moreBtn.addEventListener('click', () => {
      showContextMenu(10, window.innerHeight - 250, [
        { icon: '📊', label: 'Создать опрос', action: showCreatePollModal },
        { icon: '⏱', label: 'Исчезающее сообщение', action: showDisappearingMsgModal },
        { icon: '📅', label: 'Запланировать', action: showScheduleMessageModal },
        { icon: '🤖', label: 'AI Резюме чата', action: summarizeChat },
        { icon: '🔍', label: 'Поиск в чате', action: toggleMessageSearch },
      ]);
    });

    area.appendChild(qBtn);
    area.appendChild(moreBtn);
  }

  // Патчим searchMsgBtn чтобы открывал реальный поиск
  const origRenderForSearch = window.renderChatMessages;
  document.addEventListener('click', e => {
    if (e.target.id === 'searchMsgBtn') {
      e.preventDefault(); e.stopPropagation();
      toggleMessageSearch();
    }
  });

  // Вызываем enhanceChatInput когда чат открывается
  const _switchScreenOrig = switchScreen;
  function switchScreen(id) {
    _switchScreenOrig(id);
    if (id === 'chat') requestAnimationFrame(enhanceChatInput);
  }

  // Обработка poll-сообщений в renderChatMessages — patch
  // Мы патчим HTML генератор через monkey-patch строки
  const _renderMsg_orig = renderChatMessages;
